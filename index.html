        <div class="field-computed"><label>% Total descuento</label><input id="mpTotal" disabled></div>
        ${PC().lab ? `<div><label>Laboratorio</label><select name="laboratorio"><option>Calado</option><option>Sin calar</option></select></div>` : ''}
      </div>

      <div class="section-title">Parcelas</div>
      <div id="parcelaRows"></div>
      <button type="button" class="btn secondary small" onclick="mpAddParcela()">+ Agregar parcela</button>
      <div id="mpPctCheck" class="pct-check"></div>
      <div class="table-wrap" style="margin-bottom:14px;"><table class="calc-table"><thead><tr><th>Parcela</th><th class="num">%</th><th class="num">Neto (kg)</th><th class="num">Descuento (kg)</th><th class="num">Peso final (kg)</th></tr></thead><tbody id="mpCalcBody"></tbody><tfoot id="mpCalcFoot"></tfoot></table></div>

      <div class="section-title">Almacenamiento</div>
      <div class="grid">
        <div><label>Silo bolsa *</label><select name="silo_bolsa_id" id="mpSiloSelect" required></select></div>
        <div><label>Ubicación</label><select name="patio_destino"><option>Patio 1</option><option>Patio 2</option><option>Patio 3</option></select></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones" placeholder="Chacra, Pre limpio, Purga, Recupero…"></textarea>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;color:var(--text-secondary);margin:4px 0 12px;"><input type="checkbox" id="mpKeep" checked style="width:auto;margin:0;"> Después de guardar, mantener fecha, proveedor, tipo, silo y ubicación para el próximo camión</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" type="submit">${ICONS.check} <span id="mpBtnSave">Guardar recepción</span></button>
        <button type="button" id="mpBtnCancel" class="btn secondary hidden" onclick="mpCancel()">Cancelar edición</button>
        <button type="button" id="mpBtnDel" class="btn danger hidden" onclick="mpDelete()">Eliminar</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Kg ingresados por silo bolsa</h2>
    <div id="mpSiloCards" class="silo-cards"><div class="empty">Cargando...</div></div>
  </div>

  <div class="card">
    <h2>Planilla de recepciones</h2>
    <div class="tools">
      <div><label>Buscar</label><input id="mpQ" placeholder="remisión, chofer, proveedor…" oninput="mpRenderList()"></div>
      <div><label>Silo</label><select id="mpFSilo" onchange="mpRenderList()"><option value="">Todos</option></select></div>
      <div style="flex:0 0 auto;"><button class="btn secondary" type="button" onclick="mpExport()">Exportar a Excel</button></div>
    </div>
    <div id="mpList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;

  const f = document.getElementById('frmMP');
  f.fecha.value = hoyLocal();
  f.addEventListener('submit', mpSubmit);

  const { data: silos } = await sb.from('silos_bolsa').select('*').eq('estado','ABIERTO').order('creado_en',{ascending:false});
  mpFillSilos(silos || [], null);
  window.mpSilosAbiertos = silos || [];

  mpParcelaCount = 0;
  document.getElementById('parcelaRows').innerHTML = '';
  mpAddParcela('', 100);
  await mpLoad();
}

function mpFillSilos(silos, extra){
  const sel = document.getElementById('mpSiloSelect');
  const cur = sel.value;
  const list = silos.slice();
  if(extra && !list.some(s => s.id === extra.id)) list.push(extra);
  sel.innerHTML = list.map(s => `<option value="${s.id}">Silo ${mpEsc(s.numero)} · ${mpEsc(s.producto)} · ${mpEsc(s.categoria||'calidad pendiente')}</option>`).join('') || '<option value="">No hay silos abiertos - creá uno primero</option>';
  if(cur && list.some(s => s.id === cur)) sel.value = cur;
}

let _humTimer = null, _humPend = false;
function mpSetHumMax(){
  const inp = document.getElementById('mpHumMax');
  mpHumMax = mpN(inp.value);
  try { localStorage.setItem('mp_hum_max', String(mpHumMax)); } catch(e){}
  mpCalc();
  clearTimeout(_humTimer); _humPend = false;
  const raw = String(inp.value).trim(), v = Number(raw);
  if(raw === '' || isNaN(v) || v < 0 || v > 100) return;
  _humPend = true;
  _humTimer = setTimeout(async () => {
    const { error } = await sb.from('configuracion').upsert({ clave:'hum_max', valor:v, actualizado_por:usuario || null, actualizado_en:new Date().toISOString() }, { onConflict:'clave' });
    _humPend = false;
    if(error){ toast('No se pudo guardar la humedad máx. para todos: ' + error.message, 'err'); return; }
    toast('Humedad máx. actualizada para todos: ' + mpFk(v,1) + ' %', 'ok');
  }, 900);
}
async function mpCargarHumMax(force){
  if(!PC().hum || _humPend) return null;
  try{
    const { data, error } = await sb.from('configuracion').select('valor').eq('clave','hum_max').maybeSingle();
    if(error || !data) return null;
    const v = Number(data.valor);
    if(isNaN(v)) return null;
    mpHumMax = v;
    try { localStorage.setItem('mp_hum_max', String(v)); } catch(e){}
    const inp = document.getElementById('mpHumMax');
    if(inp && (force || document.activeElement !== inp)) inp.value = v;
    mpCalc();
    return v;
  }catch(e){ return null; }
}

function mpAddParcela(nro, pct){
  const id = mpParcelaCount++;
  const first = document.querySelectorAll('#parcelaRows .parcela-row').length === 0;
  document.getElementById('parcelaRows').insertAdjacentHTML('beforeend',
    `<div class="parcela-row" id="prow-${id}"><div><label>Nro. parcela</label><input class="pr-nro" placeholder="ej: 4" value="${mpEsc(nro==null?'':nro)}" oninput="mpCalc()"></div>`
    + `<div class="pr-pct"><label>% de esta parcela</label><input class="pr-p" type="number" step="0.01" placeholder="ej: 60" value="${pct==null?'':pct}" oninput="mpCalc()"></div>`
    + (first ? '' : `<button type="button" class="btn danger-ghost" onclick="document.getElementById('prow-${id}').remove();mpCalc()" title="Quitar">×</button>`)
    + `</div>`);
  mpCalc();
}

function mpLeerParcelas(){
  return Array.from(document.querySelectorAll('#parcelaRows .parcela-row')).map(r => ({
    nro: r.querySelector('.pr-nro').value.trim(),
    pct: r.querySelector('.pr-p').value === '' ? null : mpN(r.querySelector('.pr-p').value)
  })).filter(p => p.nro !== '' || p.pct !== null);
}

function mpCalc(){
  const f = document.getElementById('frmMP');
  if(!f) return;
  const neto = mpN(f.peso_bruto_kg.value) - mpN(f.peso_tara_kg.value);
  const dh = PC().hum ? mpDescHumFila(f.pct_humedad.value) : 0;
  const tot = PC().desc.reduce((a, d) => a + mpN(f[d.k].value), 0) + dh;
  document.getElementById('mpNeto').value = mpFk(neto,2) + ' kg';
  const eh = document.getElementById('mpDescHum'); if(eh) eh.value = mpFk(dh,2) + ' %';
  document.getElementById('mpTotal').value = mpFk(tot,2) + ' %';
  const ps = mpLeerParcelas();
  const sum = ps.reduce((a,p) => a + (p.pct||0), 0);
  const ck = document.getElementById('mpPctCheck');
  if(!ps.length){ ck.className = 'pct-check'; ck.textContent = ''; }
  else if(Math.abs(sum-100) < 0.005){ ck.className = 'pct-check ok'; ck.textContent = '✓ Los % suman 100'; }
  else { ck.className = 'pct-check bad'; ck.textContent = 'Los % suman ' + mpFk(sum,2) + ' (tienen que sumar 100)'; }
  let tn = 0, td = 0, tf = 0;
  document.getElementById('mpCalcBody').innerHTML = (ps.length ? ps : [{nro:'-',pct:100}]).map(p => {
    const nt = neto*(p.pct||0)/100, d = nt*tot/100; tn += nt; td += d; tf += nt-d;
    return `<tr><td>${mpEsc(p.nro||'-')}</td><td class="num">${mpFk(p.pct||0,2)}</td><td class="num">${mpFk(nt,2)}</td><td class="num">${mpFk(d,2)}</td><td class="num">${mpFk(nt-d,2)}</td></tr>`;
  }).join('');
  document.getElementById('mpCalcFoot').innerHTML = `<tr><td>Total</td><td class="num"></td><td class="num">${mpFk(tn,2)}</td><td class="num">${mpFk(td,2)}</td><td class="num">${mpFk(tf,2)}</td></tr>`;
}

function mpSetMode(){
  const e = mpEditId !== null;
  const r = e ? MP_ROWS.find(x => x.id === mpEditId) : null;
  document.getElementById('mpTitle').innerHTML = ICONS.mp + (e ? ' Editando remisión ' + mpEsc(r ? r.nro_boleta : '') : ' Recepción de materia prima');
  document.getElementById('mpBtnSave').textContent = e ? 'Guardar cambios' : 'Guardar recepción';
  document.getElementById('mpBtnCancel').classList.toggle('hidden', !e);
  document.getElementById('mpBtnDel').classList.toggle('hidden', !e);
}

function mpResetForm(keep){
  const f = document.getElementById('frmMP');
  const k = keep ? {fecha:f.fecha.value, proveedor:f.proveedor.value, tipo_cosecha:f.tipo_cosecha.value, destino:f.destino.value, silo_bolsa_id:f.silo_bolsa_id.value, patio_destino:f.patio_destino.value} : null;
  if(k && PC().lab) k.laboratorio = f.laboratorio.value;
  if(k && PC().variedad) k.variedad = f.variedad.value;
  f.reset();
  f.fecha.value = hoyLocal();
  mpFillSilos(window.mpSilosAbiertos || [], null);
  if(k) Object.keys(k).forEach(x => { f[x].value = k[x]; });
  document.getElementById('parcelaRows').innerHTML = '';
  mpAddParcela('', 100);
  mpEditId = null;
  mpSetMode();
  f.nro_boleta.focus();
}

function mpCancel(){ mpResetForm(false); }

function mpDup(err){ return err && (err.code === '23505' || /duplicate|unique/i.test(err.message||'')); }

async function mpSubmit(e){
  e.preventDefault();
  const f = e.target;
  const ps = mpLeerParcelas();
  if(ps.length){
    if(ps.some(p => p.pct === null)){ toast('Completá el % de cada parcela','err'); return; }
    const s = ps.reduce((a,p) => a + p.pct, 0);
    if(Math.abs(s-100) >= 0.005){ toast('Los % de las parcelas deben sumar 100','err'); return; }
  }
  if(mpN(f.peso_bruto_kg.value) <= mpN(f.peso_tara_kg.value)){ toast('El peso bruto tiene que ser mayor que la tara','err'); return; }
  if(!f.silo_bolsa_id.value){ toast('Elegí un silo bolsa','err'); return; }
  const nul = v => { v = (v||'').trim(); return v === '' ? null : v; };
  const num = v => v === '' ? null : Number(v);
  const payload = {
    nro_boleta: f.nro_boleta.value.trim(),
    fecha: f.fecha.value,
    chapa_camion: nul(f.chapa_camion.value),
    chofer: nul(f.chofer.value),
    proveedor: nul(f.proveedor.value),
    tipo_cosecha: f.tipo_cosecha.value,
    destino: f.destino.value,
    peso_bruto_kg: Number(f.peso_bruto_kg.value),
    peso_tara_kg: Number(f.peso_tara_kg.value),
    pct_humedad: num(f.pct_humedad.value),
    temperatura_c: num(f.temperatura_c.value),
    silo_bolsa_id: f.silo_bolsa_id.value,
    patio_destino: f.patio_destino.value,
    observaciones: f.observaciones.value.trim()
  };
  PC().desc.forEach(d => { const v = num(f[d.k].value); payload[d.k] = (v === null && d.cero) ? 0 : v; });
  if(PC().hum) payload.pct_descuento_humedad = mpDescHumFila(f.pct_humedad.value);
  if(PC().lab) payload.laboratorio = f.laboratorio.value;
  if(PC().variedad) payload.variedad = nul(f.variedad.value);
  if(PC().marcado) payload.marcado = !!f.marcado.checked;
  const humAntes = mpHumMax;
  const humAhora = await mpCargarHumMax(true);
  if(humAhora !== null && humAhora !== humAntes){ toast('La humedad máx. cambió a ' + mpFk(humAhora,1) + ' %. Revisá el descuento y guardá de nuevo', 'err'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  if(mpEditId === null) payload.creado_por = usuario || null;
  const { error } = await sb.rpc('fn_guardar_recepcion', { p_id: mpEditId, p_data: payload, p_parcelas: ps.map(p => ({ nro_parcela: p.nro || null, pct_parcela: p.pct })) });
  if(error){ btn.disabled = false; toast(mpDup(error) ? 'Ya existe una recepción con esa remisión' : 'Error: ' + error.message, 'err'); return; }
  btn.disabled = false;
  const wasEdit = mpEditId !== null;
  toast('Recepción ' + payload.nro_boleta + (wasEdit ? ' actualizada' : ' guardada'), 'ok');
  mpResetForm(document.getElementById('mpKeep').checked && !wasEdit);
  await mpLoad();
}

function mpEdit(id){
  const r = MP_ROWS.find(x => x.id === id);
  if(!r) return;
  if(r.estado === 'ASIGNADA'){ toast('Esta carga ya está en un lote y no se puede editar','err'); return; }
  const f = document.getElementById('frmMP');
  mpEditId = id;
  ['nro_boleta','fecha','chapa_camion','chofer','proveedor','tipo_cosecha','destino','peso_bruto_kg','peso_tara_kg','pct_humedad','temperatura_c'].concat(PC().desc.map(d => d.k), PC().lab ? ['laboratorio'] : [], PC().variedad ? ['variedad'] : [], ['patio_destino','observaciones']).forEach(k => { f[k].value = r[k] == null ? '' : r[k]; });
  if(PC().marcado) f.marcado.checked = !!r.marcado;
  mpFillSilos(window.mpSilosAbiertos || [], r.silos_bolsa ? {id:r.silo_bolsa_id, numero:r.silos_bolsa.numero, producto:r.silos_bolsa.producto, categoria:r.silos_bolsa.categoria} : {id:r.silo_bolsa_id, numero:r.silo_bolsa_id, producto:'', categoria:''});
  f.silo_bolsa_id.value = r.silo_bolsa_id;
  document.getElementById('parcelaRows').innerHTML = '';
  mpParcelaCount = 0;
  const ps = r.recepcion_parcela || [];
  if(ps.length) ps.forEach(p => mpAddParcela(p.nro_parcela, p.pct_parcela)); else mpAddParcela('', 100);
  mpSetMode(); mpCalc();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function mpDelete(){
  if(mpEditId === null) return;
  const r = MP_ROWS.find(x => x.id === mpEditId);
  if(!r || r.estado === 'ASIGNADA'){ toast('Esta carga ya está en un lote y no se puede eliminar','err'); return; }
  if(!confirm('¿Eliminar la remisión ' + r.nro_boleta + '? Esta acción no se puede deshacer.')) return;
  const { error: e2 } = await sb.rpc('fn_eliminar_recepcion', { p_id: r.id });
  if(e2){ toast('Error: ' + e2.message, 'err'); return; }
  toast('Recepción eliminada', 'ok');
  mpResetForm(false);
  await mpLoad();
}

async function mpLoad(){
  mpCargarHumMax();
  let data = [], error = null;
  for(let desde = 0; ; desde += 1000){
    const r = await sb.from('recepcion_mp')
      .select('*, silos_bolsa(numero,producto,categoria), recepcion_parcela(nro_parcela,pct_parcela), lote_recepcion(lote_id)')
      .order('fecha',{ascending:false}).order('creado_en',{ascending:false}).order('id',{ascending:false})
      .range(desde, desde + 999);
    if(r.error){ error = r.error; break; }
    data = data.concat(r.data || []);
    if(!r.data || r.data.length < 1000) break;
  }
  const el = document.getElementById('mpList');
  if(!el) return;
  if(error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(error.message)}</div>`; return; }
  MP_ROWS = data || [];
  const provs = Array.from(new Set(MP_ROWS.map(r => r.proveedor).filter(Boolean)));
  const dl = document.getElementById('mpProvList');
  if(dl) dl.innerHTML = provs.map(p => `<option value="${mpEsc(p)}">`).join('');
  const sel = document.getElementById('mpFSilo');
  const cur = sel.value;
  const silosVistos = {};
  MP_ROWS.forEach(r => { if(r.silos_bolsa) silosVistos[r.silo_bolsa_id] = r.silos_bolsa.numero; });
  (window.mpSilosAbiertos || []).forEach(s => { silosVistos[s.id] = s.numero; });
  sel.innerHTML = '<option value="">Todos</option>' + Object.keys(silosVistos).map(id => `<option value="${mpEsc(id)}">${mpEsc(silosVistos[id])}</option>`).join('');
  sel.value = cur;
  mpRenderSilos(silosVistos);
  mpRenderList();
}

function mpRenderSilos(silosVistos){
  const box = document.getElementById('mpSiloCards');
  const ids = Object.keys(silosVistos);
  if(!ids.length){ box.innerHTML = '<div class="empty">Todavía no hay silos con recepciones.</div>'; return; }
  box.innerHTML = ids.map(id => {
    const rs = MP_ROWS.filter(r => r.silo_bolsa_id === id);
    const kg = rs.reduce((a,r) => a + Number(r.kg_liquido_carga||0), 0);
    return `<div class="silo-card"><div class="t">Silo bolsa ${mpEsc(silosVistos[id])}</div><div class="n">${mpFk(kg)} kg</div><div class="s">${rs.length} ${rs.length===1?'camión':'camiones'} · peso final</div></div>`;
  }).join('');
}

function mpFilas(r){
  const neto = Number(r.peso_neto_kg||0), tot = Number(r.pct_total_descuento||0);
  const ps = (r.recepcion_parcela && r.recepcion_parcela.length) ? r.recepcion_parcela : [{nro_parcela:'-', pct_parcela:100}];
  return ps.map(p => {
    const pct = p.pct_parcela == null ? 100 : Number(p.pct_parcela);
    const nt = neto*pct/100, d = nt*tot/100;
    return { r, nro:p.nro_parcela||'-', pct, neto:nt, bruto:Number(r.peso_tara_kg||0)+nt, desc:d, fin:nt-d, tot, dh:Number(r.pct_descuento_humedad||0) };
  });
}

function mpFiltradas(){
  const q = (document.getElementById('mpQ').value || '').toLowerCase();
  const s = document.getElementById('mpFSilo').value;
  return MP_ROWS.flatMap(mpFilas).filter(x => (!s || x.r.silo_bolsa_id === s) && (!q || [x.r.nro_boleta, x.r.chofer, x.r.proveedor, x.r.chapa_camion].join(' ').toLowerCase().includes(q)));
}

function mpLoteDe(r){
  const lr = r.lote_recepcion;
  if(!lr) return '';
  return Array.isArray(lr) ? (lr[0] ? lr[0].lote_id : '') : (lr.lote_id || '');
}

function mpRenderList(){
  const el = document.getElementById('mpList');
  if(!el) return;
  const fs = mpFiltradas();
  if(!fs.length){ el.innerHTML = '<div class="empty">No hay recepciones para mostrar.</div>'; return; }
  const tn = fs.reduce((a,x) => a + x.neto, 0), td = fs.reduce((a,x) => a + x.desc, 0), tf = fs.reduce((a,x) => a + x.fin, 0), tb = fs.reduce((a,x) => a + x.bruto, 0);
  const seen = {}, hs = [];
  fs.forEach(x => { if(!seen[x.r.id] && x.r.pct_humedad != null){ seen[x.r.id] = 1; hs.push(Number(x.r.pct_humedad)); } });
  const hp = hs.length ? hs.reduce((a,b) => a + b, 0)/hs.length : 0;
  const pp = fs.reduce((a,x) => a + x.tot*x.neto, 0) / (tn || 1);
  el.innerHTML = `<table><thead><tr><th>Remisión</th><th>Fecha</th><th>Placa</th><th>Chofer</th><th>Proveedor / Productor</th><th>Parcela</th><th class="num">% parcela</th>${PC().variedad ? '<th>Variedad</th>' : ''}<th>Tipo</th><th class="num sep">Peso bruto</th><th class="num">Peso tara</th><th class="num">Peso neto</th><th class="num sep">Humedad %</th><th class="num">Temp °C</th>${PC().hum ? '<th class="num">Impurezas %</th><th class="num">Desc. calidad %</th><th class="num">Desc. humedad %</th>' : '<th class="num">Impureza %</th><th class="num">Contraste %</th><th class="num">Daños mec. %</th>'}<th class="num">Total desc. %</th><th class="num sep">Descuento kg</th><th class="num">Peso final kg</th><th class="sep">Observaciones</th><th>Ubicación</th><th>Silo bolsa</th><th>Lote</th><th>Para</th><th>Estado</th>${PC().lab ? '<th>Laboratorio</th>' : '<th>Marcado</th>'}<th></th></tr></thead><tbody>${
    fs.slice(0, mpLimit).map(x => { const r = x.r, lote = mpLoteDe(r), asig = r.estado === 'ASIGNADA';

function xlHoja(h){

    if(tipo === 'f'){ const n = typeof v === 'number' ? v : xlFecha(v); return n == null ? `<c r="${ref}" s="${st}"/>` : `<c r="${ref}" s="${st}"><v>${n}</v></c>`; }

      {t:'Análisis MP',k:'l',w:40},{t:'Análisis producto terminado',k:'l',w:40},{t:'Diferencia / observaciones',k:'l',w:40},{t:'Cerrado por',w:18}];
    const filasB = cerr.map(r => { const c = ci[r.lote_id] || {}; return [r.lote_id, RES_LAB[r.lote_id] || '', r.producto, r.categoria || '', r.fecha_cierre, n(c.kg_ingresado_mp != null ? c.kg_ingresado_mp : r.kg_ingresado_mp), n(c.kg_procesado_total != null ? c.kg_procesado_total : r.kg_procesado_total), n(c.mermas_totales_kg != null ? c.mermas_totales_kg : r.mermas_totales_kg),
      r.rendimiento_pct == null ? null : Number(r.rendimiento_pct) / 100, c.analisis_mp_resumen, c.analisis_pt_resumen, c.diferencia_analisis, c.cerrado_por]; });
    const sB = i => filasB.reduce((a, f) => a + (Number(f[i]) || 0), 0);

async function submitSilo(e){ e.preventDefault(); return _once('silo', _submitSilo, e); }
async function _submitSilo(e){
  const payload = Object.fromEntries(new FormData(e.target).entries());
  payload.numero = String(payload.numero||'').trim();
  payload.creado_por = usuario || null;
  const ex = await sb.from('silos_bolsa').select('id,numero');
  const igual = ((ex && ex.data) || []).find(x => _normTxt(x.numero) === _normTxt(payload.numero));
  if(igual){ toast('Ya existe el silo ' + igual.numero + ' (' + igual.id + ')', 'err'); return; }
  const { data, error } = await sb.from('silos_bolsa').insert(payload).select().single();
  if(error){ toast(_esDup(error) ? 'Ya existe un silo con ese número' : 'Error: ' + error.message, 'err'); return; }
  toast('Silo ' + data.id + ' creado', 'ok');
  renderSilo();
}

async function loadSiloList(){
  const { data, error } = await sb.from('silos_bolsa').select('*').order('creado_en',{ascending:false});
  const el = document.getElementById('siloList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(error.message)}</div>`; return; }

async function setSiloCategoria(id, v){

}

async function cerrarSilo(id){
  if(!confirm('¿Cerrar este silo bolsa? Ya no vas a poder cargarle más recepciones.')) return;

  loadSiloList();
}


/* ==============================================================================
   ==  LOTES
   ==  Crear lotes eligiendo cargas (carga completa o uso parcial) y listado.
   ============================================================================== */
let LOTE_ROWS = [];
let loteSel = new Set();
let loteFiltro = { q:'', silo:'', prov:'', solo:false };
let loteUltimo = null;
let loteKg = {};
let LOTE_LIST = [];
let loteListQ = '';

async function renderLote(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.lote} Crear lote</h2>
    <div class="grid">
      <div><label>Producto *</label><select id="loteProducto">${prodOpts()}</select></div>
      <div><label>Calidad</label><select id="loteCategoria"><option value="">-</option>${opt(PC().catsLote)}</select></div>
      <div><label>Responsable</label><input id="loteResponsable"></div>
      <div><label>Código de laboratorio</label><input id="loteCodigoLab" placeholder="Ej: ${PROD_INFO[PROD].lab} 030-26"></div>
    </div>
  </div>
  <div class="card">
    <h2>Cargas disponibles</h2>
    <div id="ltSilos" class="lt-chips"></div>
    <div class="lt-filtros">
      <input type="search" id="ltBuscar" placeholder="Buscar remisión, proveedor, chofer o chapa..." autocomplete="off" oninput="loteFiltro.q=this.value;ltRender()">
      <select id="ltProv" onchange="loteFiltro.prov=this.value;ltRender()"><option value="">Todos los proveedores</option></select>
      <label class="lt-solo"><input type="checkbox" id="ltSolo" onchange="loteFiltro.solo=this.checked;ltRender()"> Solo seleccionadas</label>

    <h2>Lotes</h2>
    <input type="search" id="loteListBuscar" placeholder="Buscar lote, código de laboratorio, producto..." autocomplete="off" oninput="loteListQ=this.value;loteListRender()" style="margin-bottom:10px">
    <div id="loteList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  loteSel = new Set(); loteUltimo = null; loteKg = {}; loteListQ = '';
  loteFiltro = { q:'', silo:'', prov:'', solo:false };

  loadLoteList();
}

async function loadRecepcionChecklist(){
  const { data, error } = await sb.from('recepcion_mp').select('*, silos_bolsa(numero,categoria,producto)').eq('estado','DISPONIBLE').order('fecha').order('nro_boleta');
  const el = document.getElementById('ltTabla');
  if(error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(error.message)}</div>`; return; }
  LOTE_ROWS = data || [];
  if(!LOTE_ROWS.length){ el.innerHTML = '<div class="empty">No hay cargas disponibles (todas ya están asignadas a un lote).</div>'; ltBarra(); return; }
  const provs = Array.from(new Set(LOTE_ROWS.map(r => r.proveedor).filter(Boolean))).sort();
  document.getElementById('ltProv').innerHTML = '<option value="">Todos los proveedores</option>' + provs.map(p => `<option>${mpEsc(p)}</option>`).join('');
  ltRender();
}

function ltN(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:0}); }
function ltP(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{minimumFractionDigits:1,maximumFractionDigits:2}); }
function ltLiq(r){ return Number(r.kg_liquido_carga||0); }
function ltSaldo(r){ return Math.max(0, ltLiq(r) - Number(r.kg_liquido_usado||0)); }
function ltUsar(r){ return loteKg[r.id] !== undefined ? loteKg[r.id] : ltSaldo(r); }
function ltAdd(r){ loteSel.add(r.id); if(loteKg[r.id] === undefined) loteKg[r.id] = Math.round(ltSaldo(r)*100)/100; }
function ltDel(id){ loteSel.delete(id); delete loteKg[id]; }
function ltSiloNum(r){ return r.silos_bolsa ? r.silos_bolsa.numero : r.silo_bolsa_id; }

function ltFiltradas(){
  const q = (loteFiltro.q || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
  return LOTE_ROWS.filter(r => {
    if(loteFiltro.silo && r.silo_bolsa_id !== loteFiltro.silo) return false;
    if(loteFiltro.prov && r.proveedor !== loteFiltro.prov) return false;
    if(loteFiltro.solo && !loteSel.has(r.id)) return false;
    if(q.length){ const h = [r.nro_boleta, r.proveedor, r.chofer, r.chapa_camion, ltSiloNum(r)].join(' ').toLowerCase(); if(!q.every(w => h.includes(w))) return false; }
    return true;
  });
}

function ltRender(){
  const porSilo = {};
  LOTE_ROWS.forEach(r => { const s = porSilo[r.silo_bolsa_id] = porSilo[r.silo_bolsa_id] || { id:r.silo_bolsa_id, num:ltSiloNum(r), n:0, kg:0, sel:0 }; s.n++; s.kg += ltSaldo(r); if(loteSel.has(r.id)) s.sel++; });
  const silos = Object.values(porSilo).sort((a,b) => String(a.num).localeCompare(String(b.num), 'es', {numeric:true}));
  const totKg = LOTE_ROWS.reduce((a,r) => a + ltSaldo(r), 0);
  document.getElementById('ltSilos').innerHTML =
    `<button type="button" class="lt-chip${loteFiltro.silo===''?' on':''}" onclick="ltSilo('')"><b>Todos</b><span>${LOTE_ROWS.length} cargas · ${ltN(totKg)} kg</span></button>` +
    silos.map(s => `<button type="button" class="lt-chip${loteFiltro.silo===s.id?' on':''}" onclick="ltSilo('${s.id}')"><b>${mpEsc(s.num)}</b><span>${s.n} cargas · ${ltN(s.kg)} kg</span>${s.sel?`<i>${s.sel} elegida${s.sel===1?'':'s'}</i>`:''}</button>`).join('');
  const fs = ltFiltradas();
  const todasSel = fs.length > 0 && fs.every(r => loteSel.has(r.id));
  const el = document.getElementById('ltTabla');
  if(!fs.length){ el.innerHTML = '<div class="empty">Ninguna carga coincide con el filtro.</div>'; }
  else {
    el.innerHTML = `<table class="lt-tabla"><thead><tr>
      <th style="width:34px"><input type="checkbox" ${todasSel?'checked':''} onchange="ltTodas(this.checked)" title="Elegir / quitar todas las que se ven"></th>
      <th>Remisión</th><th>Fecha</th><th>Proveedor</th><th>Silo</th><th class="num">Neto kg</th><th class="num">Hum %</th><th class="num">Imp %</th><th class="num">Líquido disp. kg</th><th class="num">Usar kg</th></tr></thead><tbody>
      ${fs.map(r => `<tr class="${loteSel.has(r.id)?'lt-sel':''}" onclick="ltFila(event,'${r.id}')"><td><input type="checkbox" ${loteSel.has(r.id)?'checked':''} tabindex="-1"></td>
        <td><b>${mpEsc(r.nro_boleta)}</b></td><td>${mpFd(r.fecha)}</td><td>${mpEsc(r.proveedor||'')}<span class="lt-parcial">${mpEsc(r.tipo_cosecha||'')}</span></td><td>${mpEsc(ltSiloNum(r))}</td>
        <td class="num">${ltN(r.peso_neto_kg)}</td><td class="num">${ltP(r.pct_humedad)}</td><td class="num">${ltP(impDe(r))}</td><td class="num"><b>${ltN(ltSaldo(r))}</b>${Number(r.kg_liquido_usado||0)>0?`<span class="lt-parcial">de ${ltN(ltLiq(r))} (ya usados ${ltN(r.kg_liquido_usado)})</span>`:''}</td>
        <td class="num" onclick="event.stopPropagation()">${loteSel.has(r.id)?`<input type="number" class="lt-kg" min="1" max="${Math.floor(ltSaldo(r)*100)/100}" step="any" value="${loteKg[r.id]}" oninput="ltKgInput('${r.id}',this.value)" onchange="ltKgFin('${r.id}',this.value)" title="Kg líquidos a usar de esta carga">`:'<span class="lt-muted">-</span>'}</td></tr>`).join('')}
    </tbody></table>`;
  }
  ltBarra(fs);
}

function ltBarra(fs){
  const el = document.getElementById('ltBarra'); if(!el) return;
  fs = fs || ltFiltradas();
  const sel = LOTE_ROWS.filter(r => loteSel.has(r.id));
  const use = r => Math.min(Number(ltUsar(r))||0, ltSaldo(r));
  const frac = r => ltLiq(r) ? use(r) / ltLiq(r) : 0;
  const liq = sel.reduce((a,r) => a + use(r), 0);
  const neto = sel.reduce((a,r) => a + Number(r.peso_neto_kg||0) * frac(r), 0);
  const w = f => neto ? sel.reduce((a,r) => a + Number(r.peso_neto_kg||0) * frac(r) * f(r), 0) / neto : null;
  const hum = w(r => Number(r.pct_humedad||0)), imp = w(r => impDe(r));
  const bySilo = {}; sel.forEach(r => { const k = ltSiloNum(r); bySilo[k] = (bySilo[k]||0) + 1; });
  const desglose = Object.entries(bySilo).map(([k,v]) => `${mpEsc(k)}: ${v}`).join(' · ');
  const parciales = sel.filter(r => use(r) < ltSaldo(r) - 0.5).length;
  const visSinSel = fs.filter(r => !loteSel.has(r.id)).length;
  el.innerHTML = `<div class="lt-res">${sel.length
      ? `<b>${sel.length}</b> carga${sel.length===1?'':'s'} elegida${sel.length===1?'':'s'} · <b>${ltN(liq)} kg</b> líquidos <span class="lt-muted">(${ltN(neto)} kg netos · hum. prom. ${ltP(hum)}% · imp. prom. ${ltP(imp)}%)</span>${parciales?` <span class="lt-muted">· ${parciales} con uso parcial</span>`:''}<div class="lt-muted">${desglose}</div>`
      : '<span class="lt-muted">Todavía no elegiste ninguna carga. Tocá una fila (o usá las casillas) para elegirla.</span>'}</div>
    <div class="lt-acc">
      ${visSinSel ? `<button type="button" class="btn secondary small" onclick="ltTodas(true)">Elegir las ${visSinSel} que se ven</button>` : ''}
      ${sel.length ? `<button type="button" class="btn secondary small" onclick="ltLimpiar()">Quitar todas</button>` : ''}
      <button type="button" class="btn" ${sel.length?'':'disabled'} onclick="crearLote()">${ICONS.plus} Crear lote${sel.length?` con ${sel.length}`:''}</button>
    </div>`;
}

function ltKgInput(id, v){ const r = LOTE_ROWS.find(x => x.id === id); if(!r) return; const n = parseFloat(String(v).replace(',','.')); loteKg[id] = isNaN(n) ? 0 : n; ltBarra(); }
function ltKgFin(id, v){
  const r = LOTE_ROWS.find(x => x.id === id); if(!r) return;
  let n = parseFloat(String(v).replace(',','.'));
  if(isNaN(n) || n <= 0) n = ltSaldo(r);
  if(n > ltSaldo(r)){ n = ltSaldo(r); toast('Esa carga solo tiene ' + ltN(n) + ' kg líquidos disponibles', 'err'); }
  loteKg[id] = Math.round(n*100)/100;
  const sc = document.getElementById('ltTabla'), top = sc ? sc.scrollTop : 0;
  ltRender();
  const sc2 = document.getElementById('ltTabla'); if(sc2) sc2.scrollTop = top;
}

function ltSilo(id){ loteFiltro.silo = (loteFiltro.silo === id ? '' : id); ltRender(); }
function ltLimpiar(){ loteSel.clear(); loteKg = {}; loteUltimo = null; ltRender(); }
function ltTodas(on){ ltFiltradas().forEach(r => on ? ltAdd(r) : ltDel(r.id)); ltRender(); }
function ltFila(ev, id){
  const fs = ltFiltradas();
  if(ev.shiftKey && loteUltimo && fs.some(r => r.id === loteUltimo)){
    const a = fs.findIndex(r => r.id === loteUltimo), b = fs.findIndex(r => r.id === id);
    const [i,j] = a < b ? [a,b] : [b,a];
    for(let k = i; k <= j; k++) ltAdd(fs[k]);
  } else {
    if(loteSel.has(id)) ltDel(id); else ltAdd(LOTE_ROWS.find(x => x.id === id));
  }
  loteUltimo = id;
  const sc = document.getElementById('ltTabla'), top = sc ? sc.scrollTop : 0;
  ltRender();
  const sc2 = document.getElementById('ltTabla'); if(sc2) sc2.scrollTop = top;
}

async function crearLote(){ return _once('crearLote', _crearLote); }
async function _crearLote(){
  const seleccionadas = LOTE_ROWS.filter(r => loteSel.has(r.id));
  if(!seleccionadas.length){ toast('Elegí al menos una carga', 'err'); return; }
  const producto = document.getElementById('loteProducto').value;
  const categoria = document.getElementById('loteCategoria').value || null;
  const responsable = document.getElementById('loteResponsable').value || null;
  const codigo_lab = (document.getElementById('loteCodigoLab').value || '').trim() || null;
  const uso = seleccionadas.map(r => ({ r, kg: Math.min(Math.round((Number(ltUsar(r))||0)*100)/100, ltSaldo(r)) }));
  const mala = uso.find(u => !(u.kg > 0));
  if(mala){ toast('Revisá los kg a usar de la remisión ' + mala.r.nro_boleta, 'err'); return; }
  if(codigo_lab){
    const exl = await sb.from('lotes').select('id,codigo_lab');
    const igual = ((exl && exl.data) || []).find(x => x.codigo_lab && _normTxt(x.codigo_lab) === _normTxt(codigo_lab));
    if(igual){ toast('Ya existe el lote ' + igual.id + ' con el código ' + igual.codigo_lab, 'err'); return; }
  }
  const kg = uso.reduce((a,u) => a + u.kg, 0);
  const parciales = uso.filter(u => u.kg < ltSaldo(u.r) - 0.5).length;
  if(!confirm('¿Crear un lote de ' + producto + (categoria ? ' (' + categoria + ')' : '') + (codigo_lab ? ' · ' + codigo_lab : '') + ' con ' + seleccionadas.length + ' carga(s) y ' + ltN(kg) + ' kg líquidos' + (parciales ? ' (' + parciales + ' con uso parcial)' : '') + '?')) return;

  const rows = uso.map(u => {
    const fila = {recepcion_mp_id: u.r.id};
    const yaUsado = Number(u.r.kg_liquido_usado||0);
    if(yaUsado > 0 || u.kg < ltLiq(u.r) - 0.5) fila.kg_liquido_usado = u.kg;
    return fila;
  });
  const { data: loteId, error } = await sb.rpc('fn_crear_lote', { p_lote: {producto, categoria, responsable, creado_por: usuario||null, codigo_lab}, p_cargas: rows });
  if(error){
    const m = String(error.message || '');
    toast(/uq_lotes_codigo_lab/.test(m) ? 'Ya existe un lote con ese código' : (_esDup(error) ? 'Alguna carga ya está en un lote' : 'Error: ' + m), 'err');
    return;
  }
  const lote = { id: loteId };

  toast('Lote ' + lote.id + ' creado con ' + seleccionadas.length + ' carga(s)', 'ok');
  renderLote();
}

async function loadLoteList(){
  const el = document.getElementById('loteList');
  const [rl, rr] = await Promise.all([
    sb.from('lotes').select('*').order('creado_en',{ascending:false}),
    sb.from('v_resumen_lotes').select('lote_id,cantidad_cargas_mp,kg_mp_asignado,cantidad_bigbags')
  ]);
  if(rl.error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(rl.error.message)}</div>`; return; }
  const res = {}; ((rr && rr.data) || []).forEach(x => { res[x.lote_id] = x; });
  LOTE_LIST = (rl.data || []).map(l => Object.assign({}, l, { _r: res[l.id] || {} }));
  loteListRender();
}
function loteListRender(){
  const el = document.getElementById('loteList'); if(!el) return;
  if(!LOTE_LIST.length){ el.innerHTML = '<div class="empty">Todavía no hay lotes.</div>'; return; }
  const norm = x => String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const t = norm(loteListQ).trim().split(/\s+/).filter(Boolean);
  const list = LOTE_LIST.filter(l => { const h = norm([l.id, l.codigo_lab, l.producto, l.categoria, l.responsable, l.estado].join(' ')); return t.every(w => h.includes(w)); });
  if(!list.length){ el.innerHTML = '<div class="empty">Ningún lote coincide.</div>'; return; }

let loteActivoId = null;

function loteSelectorHTML(pref){
  return `<div class="lote-sel">
    <input type="search" id="${pref}Buscar" class="lote-sel-q" placeholder="Buscar lote, código de laboratorio, producto o calidad..." autocomplete="off">
    <select id="${pref}Sel" class="lote-sel-s"></select>
    <div id="${pref}Cnt" class="lote-sel-cnt"></div>
  </div>`;
}
function loteSelectorInit(pref, lotes, onPick, key, opts){
  const suf = (opts && opts.sufijo !== undefined) ? opts.sufijo : ' en proceso';
  const q = document.getElementById(pref+'Buscar'), sel = document.getElementById(pref+'Sel'), cnt = document.getElementById(pref+'Cnt');
  const label = l => `${mpEsc(l.id)}${l.codigo_lab ? ' · ' + mpEsc(l.codigo_lab) : ''} · ${mpEsc(l.producto)}${l.categoria ? ' · ' + mpEsc(l.categoria) : ''}${opts && opts.estado ? ' · ' + (l.estado === 'CERRADO' ? 'cerrado' : 'en proceso') : ''}`;
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let last = null; try { last = localStorage.getItem(key); } catch(e){}
  let current = (last && lotes.some(l => l.id === last)) ? last : lotes[0].id;
  function fill(){
    const t = norm(q.value).trim().split(/\s+/).filter(Boolean);
    const list = lotes.filter(l => { const h = norm(label(l)); return t.every(w => h.includes(w)); });
    sel.innerHTML = list.map(l => `<option value="${mpEsc(l.id)}">${label(l)}</option>`).join('') || '<option value="">Ningún lote coincide</option>';
    cnt.textContent = t.length ? `${list.length} de ${lotes.length} lotes${suf}` : `${lotes.length} lote${lotes.length===1?'':'s'}${suf}`;
    if(list.some(l => l.id === current)) sel.value = current;
    else if(list.length){ sel.value = list[0].id; pick(list[0].id); }
  }
  function pick(id){
    current = id;
    try { localStorage.setItem(key, id); } catch(e){}
    onPick(id);
  }
  q.addEventListener('input', fill);
  sel.addEventListener('change', () => { if(sel.value) pick(sel.value); });
  fill();
  pick(current);
}

async function submitBigbag(e){ e.preventDefault(); return _once('bigbag', _submitBigbag, e); }
async function _submitBigbag(e){
  if(!loteActivoId){ toast('Elegí un lote primero', 'err'); return; }
  const payload = Object.fromEntries(new FormData(e.target).entries());
  if(!payload.nro_bigbag) delete payload.nro_bigbag; else payload.nro_bigbag = Number(payload.nro_bigbag);
  if(!payload.hora) delete payload.hora;
  ['pureza_pct','humedad_grano_pct','temperatura_ambiente_c','temperatura_grano_c'].forEach(k=>{
    payload[k] = payload[k] === '' ? null : Number(payload[k]);
  });
  payload.encargado = payload.encargado || usuario || null;

  const grupo = mezGrupo(), mez = grupo.length > 1;
  const obsMez = mez ? 'Mezcla ' + grupo.join(' + ') + '.' : '';
  const obs = [obsMez, (payload.observaciones || '').trim()].filter(Boolean).join(' ');
  if(mez && !payload.nro_bigbag){
    const { data: mx, error: emx } = await sb.from('produccion_bigbag').select('nro_bigbag').in('lote_id', grupo);
    if(emx){ toast('Error: ' + emx.message, 'err'); return; }
    payload.nro_bigbag = Math.max(0, ...(mx || []).map(r => Number(r.nro_bigbag) || 0)) + 1;
  }
  const mezId = mez ? ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })) : null;
  const filas = grupo.map(id => Object.assign({}, payload, { lote_id:id, observaciones:obs }, mez ? { mezcla_id:mezId } : {}));

  const { data, error } = await sb.from('produccion_bigbag').insert(filas).select();
  if(error){ toast(_esDup(error) ? (payload.nro_bigbag ? 'Ya existe el bigbag Nº ' + payload.nro_bigbag + (mez ? ' en alguno de los lotes de la mezcla' : ' en este lote') : 'Otro usuario cargó un bigbag justo ahora. Tocá Registrar de nuevo.') : 'Error: ' + error.message, 'err'); return; }
  const rows = data || [];
  toast(mez ? 'Bigbag Nº' + (rows[0] ? rows[0].nro_bigbag : '') + ' de la mezcla registrado (' + grupo.join(' + ') + ')' : 'Bigbag Nº' + (rows[0] ? rows[0].nro_bigbag : '') + ' registrado', 'ok');
  e.target.reset();
  elegirLote(loteActivoId, true);
}

let MEZ = { ids:new Set(), info:{}, modo:'cierre' };
function mezReparto(total, pesos){
  let s = pesos.reduce((a, b) => a + b, 0), w = pesos;
  if(!(s > 0)){ w = pesos.map(() => 1); s = w.length; }
  let acum = 0;
  return w.map((p, i) => { const v = i === w.length - 1 ? Math.round((total - acum) * 100) / 100 : Math.round(total * p / s * 100) / 100; acum += v; return v; });
}
function mezGrupo(){ return [loteActivoId].concat(Array.from(MEZ.ids).filter(id => id !== loteActivoId && MEZ.info[id])); }
function mezPesos(ids){ return ids.map(id => Number((MEZ.info[id] || {}).kg_mp_asignado || 0)); }

  const filaRep = (g.length > 1 && !bb) ? `<div class="mez-rep">${g.map((id, i) => `<span><b>${mpEsc(id)}</b> ${fmtKg(pesos[i])} MP · ${tot > 0 ? Math.round(pesos[i] / tot * 100) : Math.round(100 / g.length)}%</span>`).join('')}</div>` : '';
  box.innerHTML = `<div class="mez"><div class="mez-h"><b>¿Se procesa mezclado con otro lote?</b><span>Tildá los lotes que funcionan como uno. Los kg y mermas se cargan una sola vez y se reparten según la MP de cada lote.</span></div>
    <div class="mez-lista">${otros.map(id => { const l = MEZ.info[id]; return `<label class="mez-item${MEZ.ids.has(id) ? ' on' : ''}"><input type="checkbox" ${MEZ.ids.has(id) ? 'checked' : ''} onchange="mezToggle('${mpEsc(id)}',this.checked)"><span><b>${mpEsc(id)}</b><small>${mpEsc(l.producto || '')}${l.categoria ? ' · ' + mpEsc(l.categoria) : ''} · ${fmtKg(l.kg_mp_asignado)} MP</small></span></label>`; }).join('')}</div>${filaRep}</div>`;

  const grupo = mezGrupo(), pesos = mezPesos(grupo);
  const kgTot = f.kg_reales_procesados === '' ? null : Number(f.kg_reales_procesados);
  const merTot = f.mermas_kg === '' ? 0 : Number(f.mermas_kg);
  const kgs = kgTot == null ? grupo.map(() => null) : mezReparto(kgTot, pesos);
  const mers = mezReparto(merTot, pesos);
  const mez = grupo.length > 1;
  const obsMez = mez ? 'Mezcla ' + grupo.join(' + ') + ' (total ' + fmtKg(kgTot) + ', mermas ' + fmtKg(merTot) + ').' : '';
  const obs = [obsMez, (f.observaciones || '').trim()].filter(Boolean).join(' ');
  const filas = grupo.map((id, i) => ({ lote_id:id, fecha:f.fecha, turno:f.turno, kg_reales_procesados:kgs[i], mermas_kg:mers[i], observaciones:obs, ajustado_por:usuario || null }));

  const previos = [];
  for(const id of grupo){
    const prev = await sb.from('lote_turno_cierre').select('*').eq('lote_id', id).eq('fecha', f.fecha).eq('turno', f.turno);
    const hay = prev && prev.data && prev.data[0];
    if(hay) previos.push(id + ' (' + fmtKg(hay.kg_reales_procesados) + ', mermas ' + fmtKg(hay.mermas_kg) + ')');
  }
  if(previos.length && !confirm('Ya hay un ajuste cargado para ' + (f.turno === 'DIA' ? 'el turno Día' : 'el turno Noche') + ' de esa fecha en: ' + previos.join('; ') + '. ¿Reemplazarlo?')) return;
  const { error } = await sb.from('lote_turno_cierre').upsert(filas, {onConflict:'lote_id,fecha,turno'});
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast(mez ? 'Ajuste de turno guardado en ' + grupo.length + ' lotes (mezcla)' : 'Ajuste de turno guardado', 'ok');
  loadTurnoList(); concRefrescar();
}

function _turnoIds(){ return (MEZ.modo === 'cierre' && loteActivoId) ? mezGrupo() : [loteActivoId]; }
async function loadTurnoList(){
  const ids = _turnoIds(), g = ids.length > 1;

  const m = new Map();

    if(t.mermas_kg != null) a.mer = (a.mer || 0) + Number(t.mermas_kg);

  });

    ${filas.map(t => `<tr><td>${fmtDate(t.fecha)}</td><td>${mpEsc(t.turno)}</td><td>${t.kg == null ? '-' : fmtKg(_r2(t.kg))}</td><td>${t.mer == null ? '-' : fmtKg(_r2(t.mer))}</td><td>${mpEsc(t.por||'-')}</td></tr>`).join('')}
  </tbody></table>`;
}


/* ==============================================================================
   ==  CONCILIACIÓN DE CIERRE
   ==  Compara MP asignada, procesado por turno y bigbags antes de cerrar.
   ============================================================================== */
let CONC = null;
const _r2 = n => Math.round(Number(n) * 100) / 100;
async function concDatos(ids){
  const [t, b] = await Promise.all([
    sb.from('lote_turno_cierre').select('fecha,turno,kg_reales_procesados,mermas_kg').in('lote_id', ids),
    sb.from('produccion_bigbag').select('id,mezcla_id').in('lote_id', ids)
  ]);
  if(t.error || b.error) return null;
  const ts = t.data || [];
  return {
    nTurnos: new Set(ts.map(x => x.fecha + '|' + x.turno)).size,
    kgTurnos: _r2(ts.reduce((a, x) => a + (Number(x.kg_reales_procesados) || 0), 0)),
    merTurnos: _r2(ts.reduce((a, x) => a + (Number(x.mermas_kg) || 0), 0)),
    bigbags: new Set((b.data || []).map(x => x.mezcla_id || ('i' + x.id))).size
  };
}
async function concRefrescar(){
  const box = document.getElementById('cfConc');
  if(!box || MEZ.modo !== 'cierre' || !loteActivoId) return;
  const ids = mezGrupo(), tok = ids.join('|');
  const d = await concDatos(ids);
  if(tok !== mezGrupo().join('|') || !document.getElementById('cfConc')) return;
  if(!d){ CONC = null; concPintar(); return; }
  d.mp = _r2(mezPesos(ids).reduce((a, x) => a + x, 0));
  CONC = d;
  const p = document.getElementById('cfKgProc'), m = document.getElementById('cfMermas');
  if(p && d.kgTurnos > 0 && (p.value === '' || p.dataset.auto === '1')){ p.value = d.kgTurnos; p.dataset.auto = '1'; }
  if(m && d.merTurnos > 0 && (m.value === '' || m.dataset.auto === '1')){ m.value = d.merTurnos; m.dataset.auto = '1'; }
  concPintar();
}
function concAvisos(d, kgProc, merTot){
  const a = [];
  if(!d) return a;
  if(d.mp > 0 && kgProc > d.mp + 0.5) a.push('El procesado (' + fmtKg(kgProc) + ') supera la MP asignada (' + fmtKg(d.mp) + ').');
  if(d.nTurnos > 0 && Math.abs(kgProc - d.kgTurnos) > 0.5) a.push('El total que cargaste (' + fmtKg(kgProc) + ') no coincide con la suma de los ajustes por turno (' + fmtKg(d.kgTurnos) + ', diferencia ' + fmtKg(_r2(kgProc - d.kgTurnos)) + ').');
  if(d.nTurnos > 0 && d.merTurnos > 0 && merTot != null && !isNaN(merTot) && Math.abs(merTot - d.merTurnos) > 0.5) a.push('Las mermas que cargaste (' + fmtKg(merTot) + ') no coinciden con la suma por turno (' + fmtKg(d.merTurnos) + ').');
  if(d.bigbags === 0) a.push('No hay ningún bigbag cargado en ' + (mezGrupo().length > 1 ? 'esta mezcla' : 'este lote') + '.');
  return a;
}
function concPintar(){
  const box = document.getElementById('cfConc'); if(!box) return;
  const d = CONC;
  if(!d){ box.innerHTML = ''; return; }
  const kgProc = parseFloat(document.getElementById('cfKgProc').value), merTot = parseFloat(document.getElementById('cfMermas').value);
  const av = isNaN(kgProc) ? [] : concAvisos(d, kgProc, isNaN(merTot) ? null : merTot);
  const sin = d.nTurnos === 0 ? '<div style="font-size:13px;color:var(--text-muted);margin-top:8px">Todavía no hay ajustes por turno: el total lo cargás a mano.</div>' : '';
  box.innerHTML = `<div class="stat-grid" style="margin:4px 0 10px">
      <div class="stat"><div class="n">${fmtKg(d.mp)}</div><div class="l">MP asignada</div></div>
      <div class="stat"><div class="n">${fmtKg(d.kgTurnos)}</div><div class="l">Procesado por turno (${d.nTurnos})</div></div>
      <div class="stat"><div class="n">${fmtKg(d.merTurnos)}</div><div class="l">Mermas por turno</div></div>
      <div class="stat"><div class="n">${d.bigbags}</div><div class="l">Bigbags</div></div>
    </div>${sin}${av.map(x => `<div class="mez-aviso">${mpEsc(x)}</div>`).join('')}`;
}

async function cerrarLoteFinal(){ return _once('cierre', _cerrarLoteFinal); }
async function _cerrarLoteFinal(){
  const kgProc = parseFloat(document.getElementById('cfKgProc').value);
  if(!kgProc){ toast('Cargá el kg procesado total', 'err'); return; }
  const grupo = mezGrupo(), mez = grupo.length > 1;
  const merTot = parseFloat(document.getElementById('cfMermas').value);

  const mps = [];
  for(const id of grupo){
    const { data: sumRow, error: esr } = await sb.from('v_resumen_lotes').select('*').eq('lote_id', id).single();
    if(esr){ toast('Error: ' + esr.message, 'err'); return; }
    mps.push(sumRow ? Number(sumRow.kg_mp_asignado || 0) : 0);
  }
  const dc = await concDatos(grupo);
  if(!dc){ toast('No se pudo verificar los datos del lote. Revisá la señal e intentá de nuevo.', 'err'); return; }
  dc.mp = _r2(mps.reduce((a, x) => a + x, 0));
  const avisos = concAvisos(dc, kgProc, isNaN(merTot) ? null : merTot);
  const base = mez ? '¿Cerrar definitivamente la mezcla ' + grupo.join(' + ') + '? Se cierran los ' + grupo.length + ' lotes juntos.' : '¿Cerrar definitivamente el lote ' + loteActivoId + '?';
  const pie = ' Después solo el administrador puede reabrirlo.';
  const msg = avisos.length ? 'ATENCIÓN, revisá antes de cerrar:\n\n- ' + avisos.join('\n- ') + '\n\n' + base + pie : base + pie;
  if(!confirm(msg)) return;

  const kgs = mezReparto(kgProc, mps);
  const mers = isNaN(merTot) || !merTot ? grupo.map(() => null) : mezReparto(merTot, mps);
  const dif = document.getElementById('cfDif').value || '';
  const difMez = mez ? 'Mezcla ' + grupo.join(' + ') + ' (total procesado ' + fmtKg(kgProc) + (merTot ? ', mermas ' + fmtKg(merTot) : '') + ').' : '';
  const filas = grupo.map((id, i) => ({
    lote_id: id,
    kg_ingresado_mp: mps[i],
    kg_procesado_total: kgs[i],
    mermas_totales_kg: mers[i],
    analisis_mp_resumen: document.getElementById('cfAnalisisMp').value || null,
    analisis_pt_resumen: document.getElementById('cfAnalisisPt').value || null,
    diferencia_analisis: [difMez, dif].filter(Boolean).join(' ') || null,
    cerrado_por: usuario || null
  }));
  const { error } = await sb.from('lote_cierre').insert(filas);
  if(error){ toast(_esDup(error) ? (mez ? 'Alguno de los lotes ya fue cerrado' : 'Este lote ya fue cerrado') : 'Error: ' + error.message, 'err'); return; }
  toast(mez ? 'Mezcla cerrada: ' + grupo.join(' + ') : 'Lote ' + loteActivoId + ' cerrado', 'ok');
  renderCierre();
}

async function coElegir(id){

    ${cerr && ci ? `<div style="margin-top:6px">Cierre: procesado ${fmtKg(ci.kg_procesado_total)} · mermas ${fmtKg(ci.mermas_totales_kg)} · MP ${fmtKg(ci.kg_ingresado_mp)} · por ${mpEsc(ci.cerrado_por || '-')}</div>` : ''}
    ${cerr ? `<button class="btn danger" type="button" style="margin-top:10px" onclick="coReabrir(false)">Reabrir lote</button>${coMezCerrada(ci).length > 1 ? ` <button class="btn danger" type="button" style="margin-top:10px" onclick="coReabrir(true)">Reabrir toda la mezcla (${coMezCerrada(ci).map(mpEsc).join(' + ')})</button>` : ''}` : ''}
  </div>`;

  // bigbags
  const elbb = document.getElementById('coBb');
  if(bb.error){ elbb.innerHTML = `<div class="empty">Error: ${mpEsc(bb.error.message)}</div>`; }

function coMezCerrada(ci){

}

  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay correcciones registradas.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Cuándo</th><th>Quién</th><th>Qué</th><th>Lote</th></tr></thead><tbody>
    ${data.map(a => `<tr><td>${mpEsc(new Date(a.creado_en).toLocaleString('es-PY', {day:'numeric', month:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}))}</td><td>${mpEsc(a.usuario_nombre || '-')}</td><td>${mpEsc(a.accion)}</td><td>${mpEsc(a.lote_id || '-')}</td></tr>`).join('')}
  </tbody></table>`;
}
function coMsgErr(error){ return /solo el administrador/i.test(error.message || '') ? 'Solo el administrador puede hacer esto.' : 'Error: ' + error.message; }
function coEditar(id){
  const b = CORR.bb[id]; if(!b) return;
  const mez = b.mezcla_id ? (CORR.mez && CORR.mez[b.mezcla_id] || []) : [];
  const v = x => (x === null || x === undefined) ? '' : mpEsc(x);
  document.getElementById('coEdit').innerHTML = `<div class="card"><h2>Editar bigbag Nº ${mpEsc(b.nro_bigbag)}</h2>
    ${mez.length > 1 ? `<div class="mez-aviso">Es un bigbag de mezcla (${mez.map(mpEsc).join(' + ')}). Los cambios se aplican en todos los lotes de la mezcla.</div>` : ''}
    <form id="frmCoEdit" data-id="${Number(b.id)}">
      <div class="grid">
        <div><label>Fecha</label><input name="fecha" type="date" value="${v(b.fecha)}"></div>
        <div><label>Hora</label><input name="hora" type="time" value="${b.hora ? mpEsc(String(b.hora).slice(0,5)) : ''}"></div>
        <div><label>Turno</label><select name="turno"><option value="DIA"${b.turno === 'DIA' ? ' selected' : ''}>Día</option><option value="NOCHE"${b.turno === 'NOCHE' ? ' selected' : ''}>Noche</option></select></div>
        <div><label>Pureza %</label><input name="pureza_pct" type="number" step="0.01" value="${v(b.pureza_pct)}"></div>
        <div><label>Humedad del grano %</label><input name="humedad_grano_pct" type="number" step="0.01" value="${v(b.humedad_grano_pct)}"></div>
        <div><label>Temp. ambiente °C</label><input name="temperatura_ambiente_c" type="number" step="0.1" value="${v(b.temperatura_ambiente_c)}"></div>
        <div><label>Temp. del grano °C</label><input name="temperatura_grano_c" type="number" step="0.1" value="${v(b.temperatura_grano_c)}"></div>
        <div><label>Encargado</label><input name="encargado" value="${v(b.encargado)}"></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones">${v(b.observaciones)}</textarea>
      <button class="btn" type="submit">${ICONS.check} Guardar corrección</button>
      <button class="btn secondary" type="button" onclick="document.getElementById('coEdit').innerHTML=''">Cancelar</button>
    </form></div>`;
  document.getElementById('frmCoEdit').addEventListener('submit', e => { e.preventDefault(); return _once('coedit', _coGuardar, e); });
  document.getElementById('coEdit').scrollIntoView({behavior:'smooth', block:'start'});
}
async function _coGuardar(e){
  const f = e.target, id = Number(f.dataset.id);
  const d = Object.fromEntries(new FormData(f).entries());
  const { data, error } = await sb.rpc('fn_admin_editar_bigbag', { p_id:id, p_data:d });
  if(error){ toast(coMsgErr(error), 'err'); return; }
  toast('Bigbag corregido' + (data > 1 ? ' (' + data + ' lotes de la mezcla)' : ''), 'ok');
  coElegir(CORR.id);
}
async function coBorrarBb(id){
  return _once('cobb' + id, async () => {
    const b = CORR.bb[id]; if(!b) return;
    const mez = b.mezcla_id ? (CORR.mez && CORR.mez[b.mezcla_id] || []) : [];
    if(!confirm('¿Borrar el bigbag Nº ' + b.nro_bigbag + (mez.length > 1 ? ' de TODA la mezcla (' + mez.join(' + ') + ')' : ' del lote ' + b.lote_id) + '? No se puede deshacer.')) return;
    const { data, error } = await sb.rpc('fn_admin_eliminar_bigbag', { p_id:id });
    if(error){ toast(coMsgErr(error), 'err'); return; }
    toast('Bigbag borrado' + (data > 1 ? ' (' + data + ' lotes)' : ''), 'ok');
    coElegir(CORR.id);
  });
}
async function coBorrarTurno(id){
  return _once('cotn' + id, async () => {
    if(!confirm('¿Borrar este ajuste de turno? No se puede deshacer. Si fue una mezcla, el ajuste de los otros lotes se borra por separado.')) return;
    const { error } = await sb.rpc('fn_admin_eliminar_turno', { p_id:id });
    if(error){ toast(coMsgErr(error), 'err'); return; }
    toast('Ajuste borrado', 'ok');
    coElegir(CORR.id);
  });
}
async function coReabrir(mezcla){
  return _once('coreab', async () => {
    const id = CORR.id; if(!id) return;
    const { data: ci } = await sb.from('lote_cierre').select('diferencia_analisis').eq('lote_id', id).maybeSingle();
    const ids = mezcla ? coMezCerrada(ci) : [id];
    if(!ids.length) return;
    if(!confirm('¿Reabrir ' + (ids.length > 1 ? 'la mezcla ' + ids.join(' + ') : 'el lote ' + id) + '?\n\nVuelve a EN PROCESO y se borra su cierre final (kg procesado, mermas y resúmenes). Los bigbags y ajustes de turno se mantienen.')) return;
    const { error } = await sb.rpc('fn_admin_reabrir_lotes', { p_lotes:ids });
    if(error){ toast(coMsgErr(error), 'err'); return; }
    toast(ids.length > 1 ? 'Mezcla reabierta: ' + ids.join(' + ') : 'Lote ' + id + ' reabierto', 'ok');
    renderCorrecciones();
  });
}
async function coQuitarCarga(rec){
  return _once('coqc' + rec, async () => {
    const id = CORR.id; if(!id || !rec) return;
    if(!confirm('¿Quitar la carga ' + rec + ' del lote ' + id + '? La carga vuelve a quedar disponible para otro lote.')) return;
    const { error } = await sb.rpc('fn_admin_quitar_carga', { p_lote:id, p_recepcion:rec });
    if(error){ toast(coMsgErr(error), 'err'); return; }
    toast('Carga ' + rec + ' quitada del lote', 'ok');
    coElegir(id);
  });
}


/* ==============================================================================
   ==  USUARIOS (SOLO ADMINISTRADOR)
   ==  Lista de usuarios, roles y activación.
   ============================================================================== */
async function renderUsuarios(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.usuarios} Gestión de usuarios</h2>
    <div id="usuariosList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  loadUsuarios();
}

async function loadUsuarios(){
  const { data, error } = await sbPub.from('perfiles').select('*').order('creado_en');
  const el = document.getElementById('usuariosList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(error.message)}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">No hay usuarios todavía.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr>
      <td><input id="nom-${u.id}" type="text" value="${mpEsc(u.nombre||'')}" maxlength="60" placeholder="Nombre" aria-label="Nombre" style="margin:0;min-width:150px;"></td>
      <td>${mpEsc(u.email||'-')}</td>
      <td><select id="rol-${u.id}" style="width:auto;margin:0;"><option value="operario" ${u.rol==='operario'?'selected':''}>Operario</option><option value="laboratorio" ${u.rol==='laboratorio'?'selected':''}>Laboratorio</option><option value="admin" ${u.rol==='admin'?'selected':''}>Admin</option></select></td>
      <td><input type="checkbox" id="activo-${u.id}" style="width:auto;margin:0;" ${u.activo?'checked':''}></td>
      <td><button class="btn small" onclick="guardarUsuario('${u.id}')">Guardar</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function guardarUsuario(id){
  const rol = document.getElementById('rol-'+id).value;
  const activo = document.getElementById('activo-'+id).checked;
  const nombre = String(document.getElementById('nom-'+id).value || '').trim().replace(/\s+/g, ' ');
  if(!nombre){ toast('Escribí un nombre para este usuario', 'err'); return; }
  const { error } = await sbPub.from('perfiles').update({ nombre, rol, activo }).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Usuario actualizado', 'ok');
  if(currentUser && id === currentUser.id){
    miRol = rol; usuario = nombre;
    document.getElementById('upRol').textContent = rolLabel(miRol);
    document.getElementById('usuarioChipText').textContent = usuario;
    document.getElementById('avTxt').textContent = iniciales(usuario);
    document.getElementById('upName').textContent = usuario;
    renderHomeMenu(); renderNavbar();
  }
  loadUsuarios();
}


/* ==============================================================================
   ==  CAMBIO DE CONTRASEÑA
   ==  Ventana para cambiar la clave (con código por mail si hace falta).
   ============================================================================== */
let pwdModo = 'actual';
let pwdFallos = 0;
let pwdBloqueoHasta = 0;
let pwdOcupado = false;

const PWD_KEY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4"/><path d="M18 5l3 3"/><path d="M15 8l3 3"/></svg>';

function initBotonPass(){
  const chip = document.getElementById('usuarioChip');
  if(!chip || document.getElementById('pwdBtn')) return;
  const wrap = document.createElement('div');
  wrap.className = 'appbar-actions';
  chip.parentNode.insertBefore(wrap, chip);
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'pwdBtn'; b.className = 'usuario-btn pwd-btn';
  b.title = 'Cambiar contraseña'; b.setAttribute('aria-label','Cambiar contraseña');
  b.innerHTML = PWD_KEY_ICON;
  b.onclick = abrirCambioPass;
  wrap.appendChild(b);
  wrap.appendChild(chip);
}

function pwdMsg(txt, tipo){
  const el = document.getElementById('pwdMsg');
  if(!el) return;
  el.textContent = txt || '';
  el.className = 'auth-msg' + (tipo ? ' ' + tipo : '');
}

function pwdSetModo(modo){
  pwdModo = modo;
  document.getElementById('pwdBoxActual').classList.toggle('hidden', modo !== 'actual');
  document.getElementById('pwdBoxCodigo').classList.toggle('hidden', modo !== 'codigo');
  document.getElementById('pwdToggle').textContent = modo === 'actual' ? 'No recuerdo mi contraseña actual' : 'Prefiero usar mi contraseña actual';
  pwdMsg('');
}

async function abrirCambioPass(){
  if(document.getElementById('pwdModal')) return;
  const { data } = await sb.auth.getUser();
  const user = data && data.user;
  if(!user){ toast('Tenés que iniciar sesión primero','err'); return; }
  pwdModo = 'actual';
  const m = document.createElement('div');
  m.id = 'pwdModal'; m.className = 'pwd-overlay';
  m.innerHTML = `<div class="pwd-box" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
    <h3 id="pwdTitle">Cambiar contraseña</h3>
    <div class="desc" id="pwdUser"></div>
    <form id="frmPwd" autocomplete="off">
      <div id="pwdBoxActual">
        <label>Contraseña actual</label>
        <input type="password" id="pwdActual" autocomplete="current-password">
      </div>
      <div id="pwdBoxCodigo" class="hidden">
        <label>Código enviado a tu mail</label>
        <div class="pwd-row"><input id="pwdCodigo" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><button type="button" class="btn secondary small" id="pwdEnviar" style="margin-top:0;height:42px;">Enviar código</button></div>
      </div>
      <button type="button" class="pwd-link" id="pwdToggle">No recuerdo mi contraseña actual</button>
      <label>Nueva contraseña</label>
      <input type="password" id="pwdNueva" autocomplete="new-password">
      <label>Repetir nueva contraseña</label>
      <input type="password" id="pwdRepite" autocomplete="new-password">
      <div class="note">Mínimo 8 caracteres, con letras y números.</div>
      <div id="pwdMsg" class="auth-msg"></div>
      <div class="pwd-actions">
        <button type="button" class="btn secondary" id="pwdCancelar">Cancelar</button>
        <button type="submit" class="btn" id="pwdGuardar">Cambiar contraseña</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(m);
  document.getElementById('pwdUser').textContent = user.email || '';
  document.getElementById('pwdToggle').onclick = () => pwdSetModo(pwdModo === 'actual' ? 'codigo' : 'actual');
  document.getElementById('pwdCancelar').onclick = cerrarCambioPass;
  document.getElementById('pwdEnviar').onclick = pwdEnviarCodigo;
  document.getElementById('frmPwd').addEventListener('submit', pwdGuardar);
  m.addEventListener('mousedown', e => { if(e.target === m) cerrarCambioPass(); });
  document.addEventListener('keydown', pwdEsc);
  document.getElementById('pwdActual').focus();
}

function pwdEsc(e){ if(e.key === 'Escape') cerrarCambioPass(); }

function cerrarCambioPass(){
  const m = document.getElementById('pwdModal');
  if(m) m.remove();
  document.removeEventListener('keydown', pwdEsc);
}

async function pwdEnviarCodigo(){
  if(pwdOcupado) return;
  pwdOcupado = true;
  const btn = document.getElementById('pwdEnviar'); btn.disabled = true;
  const { error } = await sb.auth.reauthenticate();
  pwdOcupado = false; btn.disabled = false;
  if(error){ pwdMsg('No se pudo enviar el código: ' + error.message, 'err'); return; }
  pwdMsg('Te enviamos un código a tu mail. Escribilo arriba.', 'ok');
}

function pwdValidar(nueva, repite, actual){
  if(nueva.length < 8) return 'La nueva contraseña debe tener al menos 8 caracteres';
  if(!/[A-Za-z]/.test(nueva) || !/[0-9]/.test(nueva)) return 'Tiene que incluir letras y números';
  if(nueva !== repite) return 'Las contraseñas nuevas no coinciden';
  if(actual && nueva === actual) return 'La nueva contraseña tiene que ser distinta de la actual';
  return null;
}

async function pwdGuardar(e){
  e.preventDefault();
  if(pwdOcupado) return;
  if(Date.now() < pwdBloqueoHasta){
    pwdMsg('Demasiados intentos. Esperá ' + Math.ceil((pwdBloqueoHasta - Date.now())/1000) + ' segundos.', 'err');
    return;
  }
  const actual = document.getElementById('pwdActual').value;
  const codigo = document.getElementById('pwdCodigo').value.trim();
  const nueva = document.getElementById('pwdNueva').value;
  const repite = document.getElementById('pwdRepite').value;
  if(pwdModo === 'actual' && !actual){ pwdMsg('Escribí tu contraseña actual', 'err'); return; }
  if(pwdModo === 'codigo' && !codigo){ pwdMsg('Escribí el código que te llegó por mail', 'err'); return; }
  const v = pwdValidar(nueva, repite, pwdModo === 'actual' ? actual : null);
  if(v){ pwdMsg(v, 'err'); return; }

  pwdOcupado = true;
  const btn = document.getElementById('pwdGuardar'); btn.disabled = true;
  try {
    const { data: ud } = await sb.auth.getUser();
    const user = ud && ud.user;
    if(!user){ pwdMsg('Tu sesión venció. Volvé a ingresar.', 'err'); return; }
    let upd;
    if(pwdModo === 'actual'){
      const { error: eAuth } = await sb.auth.signInWithPassword({ email: user.email, password: actual });
      if(eAuth){
        pwdFallos++;
        if(pwdFallos >= 5){ pwdFallos = 0; pwdBloqueoHasta = Date.now() + 60000; pwdMsg('Demasiados intentos. Esperá 60 segundos.', 'err'); }
        else pwdMsg('La contraseña actual no es correcta', 'err');
        return;
      }
      upd = await sb.auth.updateUser({ password: nueva });
    } else {
      upd = await sb.auth.updateUser({ password: nueva, nonce: codigo });
    }
    if(upd.error){
      const msg = /nonce|reauth|code|token/i.test(upd.error.message) ? 'El código no es correcto o venció' : 'No se pudo cambiar: ' + upd.error.message;
      pwdMsg(msg, 'err');
      return;
    }
    pwdFallos = 0;
    await sb.auth.signOut({ scope: 'others' });
    cerrarCambioPass();
    toast('Contraseña actualizada. Se cerraron las sesiones en otros dispositivos.', 'ok');
  } finally {
    pwdOcupado = false;
    const b = document.getElementById('pwdGuardar'); if(b) b.disabled = false;
  }
}

initBotonPass();


/* ==============================================================================
   ==  AUTO-ACTUALIZACIÓN
   ==  Detecta una versión nueva publicada y recarga sola.
   ============================================================================== */
let _verPend = false, _verBusy = false, _verNueva = null, _dirty = false;
['input','change'].forEach(ev => document.addEventListener(ev, e => { if(e.target && e.target.closest && e.target.closest('#main')) _dirty = true; }, true));
document.addEventListener('click', e => { if(e.target && e.target.closest && e.target.closest('#main .lt-chip,#main .lote-pill,#main input[type=checkbox]')) _dirty = true; }, true);
function _campoActivo(){ const a = document.activeElement; return !!(a && a.matches && a.matches('input,textarea,select') && a.closest && a.closest('#main')); }
function _recargarApp(){ try{ sessionStorage.setItem('nh_recarga_ver', String(_verNueva || '')); }catch(e){} location.reload(); }
function _recargaFuerte(){
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => { if(r) r.update(); }).catch(()=>{}); }catch(e){}
  const fin = () => _recargarApp();
  if(window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(fin, fin); else fin();
}
function _bannerVersion(){
  if(document.getElementById('verBar')) return;
  const b = document.createElement('div');
  b.id = 'verBar'; b.className = 'verbar'; b.setAttribute('role','status');
  b.innerHTML = '<span>Hay una versión nueva de la app</span><button type="button" onclick="_recargaFuerte()">Actualizar</button>';
  document.body.appendChild(b);
}
function aplicarVersion(){
  if(!_verPend) return;
  let yaIntentada = false;
  try{ yaIntentada = sessionStorage.getItem('nh_recarga_ver') === String(_verNueva); }catch(e){}
  const seguro = !currentUser || activeTab === null || (!_dirty && !_campoActivo());
  if(seguro && !_campoActivo() && !yaIntentada){ _recargarApp(); return; }
  _bannerVersion();
}
async function verNuevaVersion(){
  if(_verBusy || document.hidden || navigator.onLine === false) return;
  _verBusy = true;
  try{
    let nueva = null;
    try{
      const rv = await fetch('version.json?x=' + Date.now(), { cache:'no-store' });
      if(rv.ok){ const j = await rv.json(); if(j && typeof j.v === 'string') nueva = j.v; }
    }catch(e){}
    if(!nueva){
      const r = await fetch('index.html?x=' + Date.now(), { cache:'no-store' });
      if(!r.ok) return;
      const t = await r.text();
      const m = t.match(/const APP_VERSION\s*=\s*'([^']+)'/);
      if(m) nueva = m[1];
    }
    if(nueva && nueva !== APP_VERSION){ _verPend = true; _verNueva = nueva; aplicarVersion(); }
  }catch(e){}
  finally{ _verBusy = false; }
}
setTimeout(verNuevaVersion, 8000);
setInterval(() => { verNuevaVersion(); if(_verPend) aplicarVersion(); }, 90000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) setTimeout(() => { if(_verPend) aplicarVersion(); else verNuevaVersion(); }, 400); });
window.addEventListener('focus', () => { if(_verPend) aplicarVersion(); else verNuevaVersion(); });
window.addEventListener('online', verNuevaVersion);


/* ==============================================================================
   ==  MAPA DE PANTALLAS Y ARRANQUE
   ==  Cada pestaña con su función de dibujo; registro del service worker.
   ============================================================================== */
const RENDERERS = { mp: renderMP, silo: renderSilo, lote: renderLote, bigbag: renderBigbag, cierre: renderCierre, resumen: renderResumen, correcciones: renderCorrecciones, usuarios: renderUsuarios };


if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
