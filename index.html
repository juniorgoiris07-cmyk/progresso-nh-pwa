<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Progresso NH - Producción</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1712">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#15130f; --surface:#1e1b15; --surface2:#262219; --border:#37311f;
    --ink:#f2ede2; --ink-dim:#a89e88; --accent:#8fae52; --accent-dark:#5c7532;
    --warn:#d18a3f; --danger:#c0503a; --ok:#4c9a6a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
  header{background:linear-gradient(155deg,#26211a,var(--bg) 65%);padding:18px 16px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  header h1{margin:0 0 2px;font-size:18px;font-weight:700;}
  header .sub{color:var(--ink-dim);font-size:12.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  #usuarioChip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:none;background:transparent;border:none;color:var(--ink-dim);font-size:13.5px;font-weight:600;padding:9px 13px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:2px solid transparent;}
  nav button.active{color:var(--ink);border-bottom:2px solid var(--accent);background:var(--surface);}
  main{padding:16px;max-width:900px;margin:0 auto;padding-bottom:60px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .card h2{margin:0 0 4px;font-size:15px;}
  .card .desc{color:var(--ink-dim);font-size:12.5px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:14.5px;margin-bottom:10px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:44px;}
  .field-computed{opacity:.7;}
  .field-computed input{background:#221f18;color:var(--ink-dim);}
  .row-flex{display:flex;gap:8px;align-items:flex-end;}
  .row-flex > div{flex:1;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#181510;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--surface2);color:var(--ink);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{padding:6px 10px;font-size:12.5px;}
  .btn svg{width:15px;height:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 8px;border-bottom:1px solid var(--border);}
  td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:hover{background:var(--surface2);}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.ok{background:rgba(76,154,106,.18);color:#7fce9c;}
  .badge.warn{background:rgba(209,138,63,.18);color:#e3a869;}
  .badge.off{background:rgba(168,158,136,.15);color:var(--ink-dim);}
  .empty{color:var(--ink-dim);font-size:13px;padding:14px 4px;text-align:center;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:100;max-width:90vw;}
  .toast.err{border-color:var(--danger);color:#f2a493;}
  .toast.ok{border-color:var(--ok);color:#9fdfb6;}
  .checklist{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
  .checkrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--border);font-size:13px;}
  .checkrow:last-child{border-bottom:none;}
  .checkrow input{width:auto;margin:0;}
  .checkrow .meta{color:var(--ink-dim);font-size:11.5px;}
  .silo-group{font-size:11.5px;color:var(--accent);font-weight:700;padding:8px 11px 2px;text-transform:uppercase;letter-spacing:.03em;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:4px;}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;}
  .stat .n{font-size:19px;font-weight:800;}
  .stat .l{font-size:11px;color:var(--ink-dim);text-transform:uppercase;}
  .section-title{font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;}
  .icon{width:17px;height:17px;vertical-align:-3px;margin-right:4px;}
  .lote-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;}
  .lote-pill.active{border-color:var(--accent);color:var(--accent);}
  .pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <h1>Progresso NH · Producción</h1>
  <div class="sub">
    <span id="connStatus">Conectando...</span>
    <span id="usuarioChip" onclick="cambiarUsuario()">Cargando...</span>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<script>
const SUPA_URL = 'https://oulrdijjdrfsmbeezolt.supabase.co';
const SUPA_KEY = 'sb_publishable_53SLBlt-7LRqrJZSa1u9tQ_Ky3qg4Qt';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const CATEGORIAS = ['Organico','Organico BNN','Convencional UE','Convencional ROW'];
const PRODUCTOS = ['Chia','Sesamo','Girasol confiteria','Otro'];

const ICONS = {
  mp: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M5 7l1 13h12l1-13M9 11v6M15 11v6M9 7V4h6v3"/></svg>',
  silo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 10c0-4 2.5-7 6-7s6 3 6 7v9a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-9z"/><path d="M6 14h12"/></svg>',
  lote: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  bigbag: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8l2-5h8l2 5"/><path d="M4 8h16l-1.5 12a2 2 0 0 1-2 2H7.5a2 2 0 0 1-2-2L4 8z"/></svg>',
  cierre: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
  resumen: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'
};

let usuario = localStorage.getItem('progresso_usuario') || '';

function cambiarUsuario(){
  const n = prompt('¿Quién sos? (nombre para registrar tus cargas)', usuario || '');
  if(n !== null && n.trim()){
    usuario = n.trim();
    localStorage.setItem('progresso_usuario', usuario);
    document.getElementById('usuarioChip').textContent = usuario;
  }
}
if(!usuario){ setTimeout(cambiarUsuario, 300); }

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function fmtKg(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + ' kg'; }
function fmtPct(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + '%'; }
function fmtDate(d){ if(!d) return '-'; return new Date(d).toLocaleDateString('es-PY'); }
function opt(list, sel){ return list.map(v => `<option value="${v}" ${v===sel?'selected':''}>${v}</option>`).join(''); }

const TABS = [
  {id:'mp', label:'Recepción MP', icon:ICONS.mp},
  {id:'silo', label:'Silos Bolsa', icon:ICONS.silo},
  {id:'lote', label:'Lotes', icon:ICONS.lote},
  {id:'bigbag', label:'Carga', icon:ICONS.bigbag},
  {id:'cierre', label:'Cierre', icon:ICONS.cierre},
  {id:'resumen', label:'Resumen', icon:ICONS.resumen},
];

let activeTab = 'mp';

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="${t.id===activeTab?'active':''}" onclick="goTab('${t.id}')">${t.icon}${t.label}</button>`
  ).join('');
}

function goTab(id){
  activeTab = id;
  renderTabs();
  RENDERERS[id]();
}

document.getElementById('usuarioChip').textContent = usuario || 'Elegí tu nombre';

// ============================================================
// RECEPCION MP
// ============================================================
async function renderMP(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.mp} Nueva recepción de materia prima</h2>
    <div class="desc">Datos de la boleta. Peso neto, % descuento total y kg líquido se calculan solos.</div>
    <form id="frmMP">
      <div class="section-title">Datos generales de la carga</div>
      <div class="grid">
        <div><label>Nº Boleta *</label><input name="nro_boleta" required></div>
        <div><label>Fecha *</label><input name="fecha" type="date" required></div>
        <div><label>Chapa camión</label><input name="chapa_camion"></div>
        <div><label>Chofer</label><input name="chofer"></div>
        <div><label>Procedencia</label><input name="procedencia"></div>
        <div><label>Tipo de cosecha</label><select name="tipo_cosecha"><option value="">-</option><option>Corte hilerado</option><option>Desecado</option></select></div>
        <div><label>Peso Bruto (kg) *</label><input name="peso_bruto_kg" type="number" step="0.01" required oninput="calcMP()"></div>
        <div><label>Peso Tara (kg) *</label><input name="peso_tara_kg" type="number" step="0.01" required oninput="calcMP()"></div>
        <div class="field-computed"><label>Peso Neto (calculado)</label><input id="mpPesoNeto" disabled></div>
        <div><label>Nº Parcela</label><input name="nro_parcela"></div>
        <div><label>% de esta parcela</label><input name="pct_parcela" type="number" step="0.01" placeholder="ej: 50"></div>
      </div>

      <div class="section-title">Laboratorio (recepción)</div>
      <div class="grid">
        <div><label>% Humedad</label><input name="pct_humedad" type="number" step="0.01" oninput="calcMP()"></div>
        <div><label>Temperatura (°C)</label><input name="temperatura_c" type="number" step="0.1"></div>
        <div><label>% Impureza gruesa</label><input name="pct_impureza_gruesa" type="number" step="0.01"></div>
        <div><label>% Impureza fina</label><input name="pct_impureza_fina" type="number" step="0.01"></div>
        <div><label>% Descuento calidad</label><input name="pct_descuento_calidad" type="number" step="0.01" oninput="calcMP()"></div>
        <div><label>% Descuento humedad</label><input name="pct_descuento_humedad" type="number" step="0.01" oninput="calcMP()"></div>
        <div class="field-computed"><label>% Total descuento</label><input id="mpTotalDesc" disabled></div>
        <div class="field-computed"><label>Kg descuento total</label><input id="mpKgDesc" disabled></div>
        <div class="field-computed"><label>Kg líquido de la carga</label><input id="mpKgLiquido" disabled></div>
      </div>

      <div class="section-title">Almacenamiento</div>
      <div class="grid">
        <div><label>Silo bolsa *</label><select name="silo_bolsa_id" id="mpSiloSelect" required></select></div>
        <div><label>Patio de destino</label><input name="patio_destino"></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones"></textarea>
      <button class="btn" type="submit">${ICONS.check} Guardar recepción</button>
    </form>
  </div>
  <div class="card">
    <h2>Recepciones recientes</h2>
    <div id="mpList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;

  document.getElementById('frmMP').querySelector('[name=fecha]').value = new Date().toISOString().slice(0,10);

  const { data: silos } = await sb.from('silos_bolsa').select('*').eq('estado','ABIERTO').order('creado_en',{ascending:false});
  const sel = document.getElementById('mpSiloSelect');
  sel.innerHTML = (silos||[]).map(s => `<option value="${s.id}">Silo ${s.numero} · ${s.producto} · ${s.categoria}</option>`).join('') || '<option value="">No hay silos abiertos - creá uno primero</option>';

  document.getElementById('frmMP').addEventListener('submit', submitMP);
  loadMPList();
}

function calcMP(){
  const f = document.getElementById('frmMP');
  const bruto = parseFloat(f.peso_bruto_kg.value) || 0;
  const tara = parseFloat(f.peso_tara_kg.value) || 0;
  const neto = bruto - tara;
  const dCal = parseFloat(f.pct_descuento_calidad.value) || 0;
  const dHum = parseFloat(f.pct_descuento_humedad.value) || 0;
  const totalDesc = dCal + dHum;
  const kgDesc = neto * totalDesc / 100;
  const kgLiquido = neto - kgDesc;
  document.getElementById('mpPesoNeto').value = neto.toFixed(2) + ' kg';
  document.getElementById('mpTotalDesc').value = totalDesc.toFixed(2) + ' %';
  document.getElementById('mpKgDesc').value = kgDesc.toFixed(2) + ' kg';
  document.getElementById('mpKgLiquido').value = kgLiquido.toFixed(2) + ' kg';
}

async function submitMP(e){
  e.preventDefault();
  const f = e.target;
  const fd = new FormData(f);
  const payload = Object.fromEntries(fd.entries());
  ['peso_bruto_kg','peso_tara_kg','pct_humedad','temperatura_c','pct_impureza_gruesa','pct_impureza_fina','pct_descuento_calidad','pct_descuento_humedad','pct_parcela'].forEach(k=>{
    payload[k] = payload[k] === '' ? null : Number(payload[k]);
  });
  payload.creado_por = usuario || null;

  const { data, error } = await sb.from('recepcion_mp').insert(payload).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }

  toast('Recepción ' + data.id + ' guardada', 'ok');
  renderMP();
}

async function loadMPList(){
  const { data, error } = await sb.from('recepcion_mp').select('*, silos_bolsa(numero,categoria)').order('creado_en',{ascending:false}).limit(30);
  const el = document.getElementById('mpList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay recepciones cargadas.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Boleta</th><th>Fecha</th><th>Silo</th><th>Peso Neto</th><th>Kg Líquido</th><th>Estado</th></tr></thead><tbody>
    ${data.map(r => `<tr><td>${r.id}</td><td>${r.nro_boleta}</td><td>${fmtDate(r.fecha)}</td><td>${r.silos_bolsa ? 'Silo '+r.silos_bolsa.numero+' · '+r.silos_bolsa.categoria : '-'}</td><td>${fmtKg(r.peso_neto_kg)}</td><td>${fmtKg(r.kg_liquido_carga)}</td><td><span class="badge ${r.estado==='DISPONIBLE'?'ok':'off'}">${r.estado}</span></td></tr>`).join('')}
  </tbody></table>`;
}

// ============================================================
// SILOS BOLSA
// ============================================================
async function renderSilo(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.silo} Nuevo silo bolsa</h2>
    <div class="desc">La categoría/calidad se define acá, no por carga individual.</div>
    <form id="frmSilo">
      <div class="grid">
        <div><label>Número *</label><input name="numero" required></div>
        <div><label>Producto *</label><select name="producto" required>${opt(PRODUCTOS)}</select></div>
        <div><label>Categoría *</label><select name="categoria" required>${opt(CATEGORIAS)}</select></div>
        <div><label>Patio</label><input name="patio"></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones"></textarea>
      <button class="btn" type="submit">${ICONS.check} Crear silo bolsa</button>
    </form>
  </div>
  <div class="card">
    <h2>Silos bolsa</h2>
    <div id="siloList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  document.getElementById('frmSilo').addEventListener('submit', submitSilo);
  loadSiloList();
}

async function submitSilo(e){
  e.preventDefault();
  const payload = Object.fromEntries(new FormData(e.target).entries());
  payload.creado_por = usuario || null;
  const { data, error } = await sb.from('silos_bolsa').insert(payload).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Silo ' + data.id + ' creado', 'ok');
  renderSilo();
}

async function loadSiloList(){
  const { data, error } = await sb.from('silos_bolsa').select('*').order('creado_en',{ascending:false});
  const el = document.getElementById('siloList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay silos bolsa.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Nº</th><th>Producto</th><th>Categoría</th><th>Patio</th><th>Estado</th><th></th></tr></thead><tbody>
    ${data.map(s => `<tr><td>${s.id}</td><td>${s.numero}</td><td>${s.producto}</td><td>${s.categoria}</td><td>${s.patio||'-'}</td><td><span class="badge ${s.estado==='ABIERTO'?'ok':'off'}">${s.estado}</span></td>
    <td>${s.estado==='ABIERTO' ? `<button class="btn secondary small" onclick="cerrarSilo('${s.id}')">Cerrar</button>` : ''}</td></tr>`).join('')}
  </tbody></table>`;
}

async function cerrarSilo(id){
  if(!confirm('¿Cerrar este silo bolsa? Ya no vas a poder cargarle más recepciones.')) return;
  const { error } = await sb.from('silos_bolsa').update({estado:'CERRADO'}).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  loadSiloList();
}

// ============================================================
// LOTES
// ============================================================
async function renderLote(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.lote} Crear lote</h2>
    <div class="desc">Elegí las cargas de materia prima (de uno o varios silos bolsa) que van a entrar en proceso.</div>
    <div class="grid">
      <div><label>Producto *</label><select id="loteProducto">${opt(PRODUCTOS)}</select></div>
      <div><label>Categoría</label><select id="loteCategoria"><option value="">-</option>${opt(CATEGORIAS)}</select></div>
      <div><label>Responsable</label><input id="loteResponsable"></div>
    </div>
    <label>Cargas disponibles</label>
    <div id="recepcionChecklist" class="checklist"><div class="empty">Cargando...</div></div>
    <div style="margin-top:12px"><button class="btn" onclick="crearLote()">${ICONS.plus} Crear lote con seleccionadas</button></div>
  </div>
  <div class="card">
    <h2>Lotes</h2>
    <div id="loteList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  loadRecepcionChecklist();
  loadLoteList();
}

async function loadRecepcionChecklist(){
  const { data, error } = await sb.from('recepcion_mp').select('*, silos_bolsa(numero,categoria,producto)').eq('estado','DISPONIBLE').order('silo_bolsa_id');
  const el = document.getElementById('recepcionChecklist');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">No hay cargas disponibles (todas ya están asignadas a un lote).</div>'; return; }
  const bySilo = {};
  data.forEach(r => { const k = r.silo_bolsa_id; (bySilo[k] = bySilo[k]||[]).push(r); });
  el.innerHTML = Object.entries(bySilo).map(([siloId, rows]) => {
    const s = rows[0].silos_bolsa;
    return `<div class="silo-group">Silo ${s.numero} · ${s.producto} · ${s.categoria}</div>` +
      rows.map(r => `<label class="checkrow"><input type="checkbox" class="recepcion-check" value="${r.id}"><span>${r.nro_boleta}</span><span class="meta">${fmtDate(r.fecha)} · ${fmtKg(r.kg_liquido_carga)}</span></label>`).join('');
  }).join('');
}

async function crearLote(){
  const seleccionadas = [...document.querySelectorAll('.recepcion-check:checked')].map(c => c.value);
  if(!seleccionadas.length){ toast('Elegí al menos una carga', 'err'); return; }
  const producto = document.getElementById('loteProducto').value;
  const categoria = document.getElementById('loteCategoria').value || null;
  const responsable = document.getElementById('loteResponsable').value || null;

  const { data: lote, error } = await sb.from('lotes').insert({producto, categoria, responsable, creado_por: usuario||null}).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }

  const rows = seleccionadas.map(rid => ({lote_id: lote.id, recepcion_mp_id: rid}));
  const { error: e2 } = await sb.from('lote_recepcion').insert(rows);
  if(e2){ toast('Lote creado pero error asignando cargas: ' + e2.message, 'err'); return; }

  toast('Lote ' + lote.id + ' creado con ' + seleccionadas.length + ' carga(s)', 'ok');
  renderLote();
}

async function loadLoteList(){
  const { data, error } = await sb.from('lotes').select('*').order('creado_en',{ascending:false});
  const el = document.getElementById('loteList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay lotes.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Lote</th><th>Producto</th><th>Categoría</th><th>Responsable</th><th>Creado</th><th>Estado</th></tr></thead><tbody>
    ${data.map(l => `<tr><td>${l.id}</td><td>${l.producto}</td><td>${l.categoria||'-'}</td><td>${l.responsable||'-'}</td><td>${fmtDate(l.fecha_creacion)}</td><td><span class="badge ${l.estado==='EN_PROCESO'?'warn':'ok'}">${l.estado}</span></td></tr>`).join('')}
  </tbody></table>`;
}

// ============================================================
// CARGA POR BIGBAG
// ============================================================
let loteActivoId = null;

async function renderBigbag(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.bigbag} Carga por bigbag</h2>
    <div class="desc">Elegí el lote en proceso y cargá cada bigbag a medida que se procesa.</div>
    <div id="lotePills" class="pill-row"></div>
    <form id="frmBigbag" style="display:none">
      <div class="grid">
        <div><label>Fecha</label><input name="fecha" type="date"></div>
        <div><label>Hora</label><input name="hora" type="time"></div>
        <div><label>Turno *</label><select name="turno" required><option value="DIA">Día (06-18h)</option><option value="NOCHE">Noche (18-06h)</option></select></div>
        <div><label>Nº Bigbag (vacío = automático)</label><input name="nro_bigbag" type="number"></div>
        <div><label>Pureza %</label><input name="pureza_pct" type="number" step="0.01"></div>
        <div><label>Humedad del grano %</label><input name="humedad_grano_pct" type="number" step="0.01"></div>
        <div><label>Temp. ambiente °C</label><input name="temperatura_ambiente_c" type="number" step="0.1"></div>
        <div><label>Temp. del grano °C</label><input name="temperatura_grano_c" type="number" step="0.1"></div>
        <div><label>Encargado</label><input name="encargado"></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones"></textarea>
      <button class="btn" type="submit">${ICONS.plus} Registrar bigbag</button>
    </form>
  </div>
  <div class="card">
    <h2>Bigbags del lote</h2>
    <div id="bigbagList" class="table-wrap"><div class="empty">Elegí un lote arriba.</div></div>
  </div>`;

  const { data: lotes } = await sb.from('lotes').select('*').eq('estado','EN_PROCESO').order('creado_en',{ascending:false});
  const pillsEl = document.getElementById('lotePills');
  if(!lotes || !lotes.length){ pillsEl.innerHTML = '<div class="empty">No hay lotes en proceso.</div>'; return; }
  pillsEl.innerHTML = lotes.map(l => `<div class="lote-pill" id="pill-${l.id}" onclick="elegirLote('${l.id}')">${l.id} · ${l.producto}</div>`).join('');
  elegirLote(lotes[0].id);

  document.getElementById('frmBigbag').addEventListener('submit', submitBigbag);
}

function elegirLote(id){
  loteActivoId = id;
  document.querySelectorAll('.lote-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById('pill-'+id);
  if(pill) pill.classList.add('active');
  const f = document.getElementById('frmBigbag');
  f.style.display = 'block';
  f.fecha.value = new Date().toISOString().slice(0,10);
  const h = new Date();
  f.turno.value = (h.getHours() >= 6 && h.getHours() < 18) ? 'DIA' : 'NOCHE';
  loadBigbagList();
}

async function submitBigbag(e){
  e.preventDefault();
  if(!loteActivoId){ toast('Elegí un lote primero', 'err'); return; }
  const payload = Object.fromEntries(new FormData(e.target).entries());
  payload.lote_id = loteActivoId;
  if(!payload.nro_bigbag) delete payload.nro_bigbag; else payload.nro_bigbag = Number(payload.nro_bigbag);
  ['pureza_pct','humedad_grano_pct','temperatura_ambiente_c','temperatura_grano_c'].forEach(k=>{
    payload[k] = payload[k] === '' ? null : Number(payload[k]);
  });
  payload.encargado = payload.encargado || usuario || null;

  const { data, error } = await sb.from('produccion_bigbag').insert(payload).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Bigbag Nº' + data.nro_bigbag + ' registrado', 'ok');
  e.target.reset();
  elegirLote(loteActivoId);
}

async function loadBigbagList(){
  const { data, error } = await sb.from('produccion_bigbag').select('*').eq('lote_id', loteActivoId).order('nro_bigbag');
  const el = document.getElementById('bigbagList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay bigbags cargados en este lote.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Nº</th><th>Turno</th><th>Fecha</th><th>Pureza</th><th>Hum. grano</th><th>Encargado</th></tr></thead><tbody>
    ${data.map(b => `<tr><td>${b.nro_bigbag}</td><td>${b.turno}</td><td>${fmtDate(b.fecha)}</td><td>${fmtPct(b.pureza_pct)}</td><td>${fmtPct(b.humedad_grano_pct)}</td><td>${b.encargado||'-'}</td></tr>`).join('')}
  </tbody></table>`;
}

// ============================================================
// CIERRE (turno + lote)
// ============================================================
async function renderCierre(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.cierre} Actualización diaria (por turno)</h2>
    <div class="desc">Ajuste con los números reales del turno: kg procesados y mermas.</div>
    <div id="lotePillsCierre" class="pill-row"></div>
    <form id="frmTurno" style="display:none">
      <div class="grid">
        <div><label>Fecha *</label><input name="fecha" type="date" required></div>
        <div><label>Turno *</label><select name="turno" required><option value="DIA">Día</option><option value="NOCHE">Noche</option></select></div>
        <div><label>Kg reales procesados</label><input name="kg_reales_procesados" type="number" step="0.01"></div>
        <div><label>Mermas (kg)</label><input name="mermas_kg" type="number" step="0.01"></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones"></textarea>
      <button class="btn" type="submit">${ICONS.check} Guardar ajuste de turno</button>
    </form>
  </div>
  <div class="card" id="cierreLoteCard" style="display:none">
    <h2>Cierre final del lote</h2>
    <div class="desc">Se hace una sola vez, cuando termina de procesarse todo el lote.</div>
    <div class="grid">
      <div><label>Kg ingresado MP (sugerido)</label><input id="cfKgMp" disabled></div>
      <div><label>Kg procesado total *</label><input id="cfKgProc" type="number" step="0.01"></div>
      <div><label>Mermas totales (kg)</label><input id="cfMermas" type="number" step="0.01"></div>
    </div>
    <label>Resumen análisis MP</label><textarea id="cfAnalisisMp"></textarea>
    <label>Resumen análisis PT (producto terminado)</label><textarea id="cfAnalisisPt"></textarea>
    <label>Diferencia MP vs PT / observaciones</label><textarea id="cfDif"></textarea>
    <button class="btn" onclick="cerrarLoteFinal()">${ICONS.check} Cerrar lote definitivamente</button>
  </div>
  <div class="card">
    <h2>Historial de ajustes de este lote</h2>
    <div id="turnoList" class="table-wrap"><div class="empty">Elegí un lote arriba.</div></div>
  </div>`;

  const { data: lotes } = await sb.from('lotes').select('*').eq('estado','EN_PROCESO').order('creado_en',{ascending:false});
  const pillsEl = document.getElementById('lotePillsCierre');
  if(!lotes || !lotes.length){ pillsEl.innerHTML = '<div class="empty">No hay lotes en proceso para cerrar.</div>'; return; }
  pillsEl.innerHTML = lotes.map(l => `<div class="lote-pill" id="pillc-${l.id}" onclick="elegirLoteCierre('${l.id}')">${l.id} · ${l.producto}</div>`).join('');
  elegirLoteCierre(lotes[0].id);

  document.getElementById('frmTurno').addEventListener('submit', submitTurno);
}

async function elegirLoteCierre(id){
  loteActivoId = id;
  document.querySelectorAll('#lotePillsCierre .lote-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('pillc-'+id).classList.add('active');
  document.getElementById('frmTurno').style.display = 'block';
  document.getElementById('frmTurno').fecha.value = new Date().toISOString().slice(0,10);

  document.getElementById('cierreLoteCard').style.display = 'block';
  const { data: sumRow } = await sb.from('v_resumen_lotes').select('*').eq('lote_id', id).single();
  document.getElementById('cfKgMp').value = sumRow ? fmtKg(sumRow.kg_mp_asignado) : '-';

  loadTurnoList();
}

async function submitTurno(e){
  e.preventDefault();
  const payload = Object.fromEntries(new FormData(e.target).entries());
  payload.lote_id = loteActivoId;
  payload.kg_reales_procesados = payload.kg_reales_procesados === '' ? null : Number(payload.kg_reales_procesados);
  payload.mermas_kg = payload.mermas_kg === '' ? 0 : Number(payload.mermas_kg);
  payload.ajustado_por = usuario || null;

  const { error } = await sb.from('lote_turno_cierre').upsert(payload, {onConflict:'lote_id,fecha,turno'});
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Ajuste de turno guardado', 'ok');
  loadTurnoList();
}

async function loadTurnoList(){
  const { data, error } = await sb.from('lote_turno_cierre').select('*').eq('lote_id', loteActivoId).order('fecha',{ascending:false});
  const el = document.getElementById('turnoList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay ajustes cargados para este lote.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Fecha</th><th>Turno</th><th>Kg reales</th><th>Mermas</th><th>Ajustó</th></tr></thead><tbody>
    ${data.map(t => `<tr><td>${fmtDate(t.fecha)}</td><td>${t.turno}</td><td>${fmtKg(t.kg_reales_procesados)}</td><td>${fmtKg(t.mermas_kg)}</td><td>${t.ajustado_por||'-'}</td></tr>`).join('')}
  </tbody></table>`;
}

async function cerrarLoteFinal(){
  const kgProc = parseFloat(document.getElementById('cfKgProc').value);
  if(!kgProc){ toast('Cargá el kg procesado total', 'err'); return; }
  if(!confirm('¿Cerrar definitivamente el lote ' + loteActivoId + '? No se puede deshacer desde acá.')) return;

  const { data: sumRow } = await sb.from('v_resumen_lotes').select('*').eq('lote_id', loteActivoId).single();
  const payload = {
    lote_id: loteActivoId,
    kg_ingresado_mp: sumRow ? sumRow.kg_mp_asignado : 0,
    kg_procesado_total: kgProc,
    mermas_totales_kg: parseFloat(document.getElementById('cfMermas').value) || null,
    analisis_mp_resumen: document.getElementById('cfAnalisisMp').value || null,
    analisis_pt_resumen: document.getElementById('cfAnalisisPt').value || null,
    diferencia_analisis: document.getElementById('cfDif').value || null,
    cerrado_por: usuario || null
  };
  const { error } = await sb.from('lote_cierre').insert(payload);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Lote ' + loteActivoId + ' cerrado', 'ok');
  renderCierre();
}

// ============================================================
// RESUMEN
// ============================================================
async function renderResumen(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card"><h2>${ICONS.resumen} Resumen de producción</h2>
  <div class="desc">Vista simple por ahora - se va a ampliar cuando conectemos con COMEX.</div>
  <div id="resumenBody"><div class="empty">Cargando...</div></div></div>`;

  const { data, error } = await sb.from('v_resumen_lotes').select('*').order('fecha_creacion',{ascending:false});
  const el = document.getElementById('resumenBody');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay lotes.</div>'; return; }

  const totalMp = data.reduce((a,r)=>a+(Number(r.kg_mp_asignado)||0),0);
  const totalProc = data.reduce((a,r)=>a+(Number(r.kg_procesado_total)||0),0);
  const cerrados = data.filter(r=>r.estado==='CERRADO').length;

  el.innerHTML = `<div class="stat-grid">
    <div class="stat"><div class="n">${data.length}</div><div class="l">Lotes</div></div>
    <div class="stat"><div class="n">${cerrados}</div><div class="l">Cerrados</div></div>
    <div class="stat"><div class="n">${fmtKg(totalMp)}</div><div class="l">MP asignada</div></div>
    <div class="stat"><div class="n">${fmtKg(totalProc)}</div><div class="l">Procesado</div></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Lote</th><th>Producto</th><th>Estado</th><th>Cargas MP</th><th>Kg MP</th><th>Bigbags</th><th>Rendimiento</th></tr></thead><tbody>
    ${data.map(r => `<tr><td>${r.lote_id}</td><td>${r.producto}</td><td><span class="badge ${r.estado==='EN_PROCESO'?'warn':'ok'}">${r.estado}</span></td><td>${r.cantidad_cargas_mp}</td><td>${fmtKg(r.kg_mp_asignado)}</td><td>${r.cantidad_bigbags}</td><td>${fmtPct(r.rendimiento_pct)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

const RENDERERS = { mp: renderMP, silo: renderSilo, lote: renderLote, bigbag: renderBigbag, cierre: renderCierre, resumen: renderResumen };

document.getElementById('connStatus').textContent = 'Conectado a Supabase';
renderTabs();
goTab('mp');

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
