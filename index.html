let currentUser = null;

function showAuthScreen(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appShell').classList.add('hidden');
  usuario = null;
  currentUser = null;
  miRol = null;
}

async function onLogin(session){
  currentUser = session.user;
  let nombre = null;
  let perfil = null;
  try{
    const { data } = await sb.from('perfiles').select('*').eq('id', session.user.id).single();
    perfil = data;
    nombre = perfil ? perfil.nombre : null;
  }catch(e){}
  if(perfil && perfil.activo === false){
    document.getElementById('authMsg').textContent = 'Tu cuenta está desactivada. Contactá al administrador.';
    document.getElementById('authMsg').className = 'auth-msg err';
    sb.auth.signOut();
    return;
  }
  miRol = perfil ? perfil.rol : 'operario';
  usuario = nombre || (session.user.email ? session.user.email.split('@')[0] : 'Usuario');
  document.getElementById('usuarioChipText').textContent = usuario;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  renderHomeMenu();
  if(!navInitialized){
    navInitialized = true;
    history.replaceState({view:'home'}, '');
    window.addEventListener('popstate', (e) => {
      const view = e.state ? e.state.view : 'home';
      if(view === 'home'){
        goHome(false);
      }else{
        activeTab = view;
        document.getElementById('homeMenu').classList.add('hidden');
        document.getElementById('volverBtn').classList.remove('hidden');
        RENDERERS[view]();
      }
    });
  }
}

function cerrarSesion(){
  if(!confirm('¿Cerrar sesión?')) return;
  sb.auth.signOut();
}

document.getElementById('frmLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email').trim();
  const password = fd.get('password');
  const msg = document.getElementById('authMsg');
  msg.textContent = 'Entrando...'; msg.className = 'auth-msg';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos' : error.message;
    msg.className = 'auth-msg err';
  }
});

sb.auth.onAuthStateChange((event, session) => {
  if(session){ onLogin(session); } else { showAuthScreen(); }
});

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function fmtKg(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + ' kg'; }
function fmtPct(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + '%'; }
function fmtDate(d){ if(!d) return '-'; const s=String(d); if(s.length===10){ const p=s.split('-'); return (+p[2])+'/'+(+p[1])+'/'+p[0]; } return new Date(d).toLocaleDateString('es-PY'); }
function opt(list, sel){ return list.map(v => `<option value="${v}" ${v===sel?'selected':''}>${v}</option>`).join(''); }

try { const hv = parseFloat(localStorage.getItem('mp_hum_max')); if(!isNaN(hv)) mpHumMax = hv; } catch(e){}
const mpN = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
const mpFk = (v,d) => Number(v||0).toLocaleString('es-PY',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const mpFd = s => { if(!s) return '-'; const p = String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; };
const mpEsc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mpDescHum = h => (h === '' || h === null || h === undefined) ? 0 : Math.max(0, mpN(h) - mpHumMax);
let mpParcelaCount = 0;

async function renderMP(){
  const main = document.getElementById('main');
  mpEditId = null;
  main.innerHTML = `<div class="card">
    <div class="row-flex" style="align-items:flex-start;">
      <div><h2 id="mpTitle">${ICONS.mp} Recepción de materia prima</h2>

      <div style="flex:0 0 150px;"><label>Humedad máx. admitida (%)</label><input id="mpHumMax" type="number" step="0.1" value="${mpHumMax}" oninput="mpSetHumMax()"></div>
    </div>
    <form id="frmMP">

        <div><label>Chapa camión</label><input name="chapa_camion"></div>
        <div><label>Chofer</label><input name="chofer"></div>
        <div><label>Proveedor / Productor</label><input name="proveedor" list="mpProvList"></div>
        <div><label>Tipo</label><select name="tipo_cosecha"><option>Corte hilerado</option><option>Desecado</option><option>Convencional</option></select></div>

        <div><label>Peso tara (kg) *</label><input name="peso_tara_kg" type="number" step="0.01" required oninput="mpCalc()"></div>
        <div class="field-computed"><label>Peso neto</label><input id="mpNeto" disabled></div>
      </div>

      <div class="section-title">Laboratorio</div>
      <div class="grid">
        <div><label>% Humedad</label><input name="pct_humedad" type="number" step="0.01" oninput="mpCalc()"></div>
        <div><label>Temperatura (°C)</label><input name="temperatura_c" type="number" step="0.1"></div>
        <div><label>% Impureza gruesa</label><input name="pct_impureza_gruesa" type="number" step="0.01" oninput="mpCalc()"></div>
        <div><label>% Impureza fina</label><input name="pct_impureza_fina" type="number" step="0.01" oninput="mpCalc()"></div>
        <div><label>% Descuento calidad</label><input name="pct_descuento_calidad" type="number" step="0.01" oninput="mpCalc()"></div>
        <div class="field-computed"><label>% Descuento humedad</label><input id="mpDescHum" disabled></div>
        <div class="field-computed"><label>% Total descuento</label><input id="mpTotal" disabled></div>
        <div><label>Laboratorio</label><select name="laboratorio"><option>Calado</option><option>Sin calar</option></select></div>
      </div>
      <div class="note">Total descuento = impureza gruesa + fina + descuento calidad + exceso de humedad sobre el máximo (igual que la planilla).</div>

      <div class="section-title">Parcelas</div>
      <div class="desc" style="margin-bottom:8px;">Una sola parcela: dejá 100. Si viene mezclada, agregá las que hagan falta; los % deben sumar 100.</div>
      <div id="parcelaRows"></div>
      <button type="button" class="btn secondary small" onclick="mpAddParcela()">+ Agregar parcela</button>
      <div id="mpPctCheck" class="pct-check"></div>
      <div class="table-wrap" style="margin-bottom:14px;"><table class="calc-table"><thead><tr><th>Parcela</th><th class="num">%</th><th class="num">Neto (kg)</th><th class="num">Descuento (kg)</th><th class="num">Peso final (kg)</th></tr></thead><tbody id="mpCalcBody"></tbody><tfoot id="mpCalcFoot"></tfoot></table></div>

      <div class="section-title">Almacenamiento</div>
      <div class="grid">
        <div><label>Silo bolsa *</label><select name="silo_bolsa_id" id="mpSiloSelect" required></select></div>
        <div><label>Ubicación</label><select name="patio_destino"><option>Patio 1</option><option>Patio 2</option><option>Patio 3</option></select></div>
      </div>
      <label>Observaciones</label><textarea name="observaciones" placeholder="Chacra, Pre limpio, Purga, Recupero…"></textarea>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;color:var(--text-secondary);margin:4px 0 12px;"><input type="checkbox" id="mpKeep" checked style="width:auto;margin:0;"> Después de guardar, mantener fecha, proveedor, tipo, silo y ubicación para el próximo camión</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" type="submit">${ICONS.check} <span id="mpBtnSave">Guardar recepción</span></button>

  </div>

  <div class="card">
    <h2>Kg ingresados por silo bolsa</h2>
    <div class="desc">Se suman solos con cada recepción (peso final, ya con descuentos).</div>
    <div id="mpSiloCards" class="silo-cards"><div class="empty">Cargando...</div></div>
  </div>

  <div class="card">
    <h2>Planilla de recepciones</h2>
    <div class="desc">Una fila por camión y parcela, como el Excel.</div>
    <div class="tools">
      <div><label>Buscar</label><input id="mpQ" placeholder="remisión, chofer, proveedor…" oninput="mpRenderList()"></div>
      <div><label>Silo</label><select id="mpFSilo" onchange="mpRenderList()"><option value="">Todos</option></select></div>
      <div style="flex:0 0 auto;"><button class="btn secondary" type="button" onclick="mpExport()">Exportar a Excel</button></div>
    </div>
    <div id="mpList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;

  const f = document.getElementById('frmMP');
  f.fecha.value = new Date().toISOString().slice(0,10);
  f.addEventListener('submit', mpSubmit);

  const { data: silos } = await sb.from('silos_bolsa').select('*').eq('estado','ABIERTO').order('creado_en',{ascending:false});
  mpFillSilos(silos || [], null);
  window.mpSilosAbiertos = silos || [];

  mpParcelaCount = 0;
  document.getElementById('parcelaRows').innerHTML = '';

  await mpLoad();
}

function mpFillSilos(silos, extra){
  const sel = document.getElementById('mpSiloSelect');
  const cur = sel.value;
  const list = silos.slice();
  if(extra && !list.some(s => s.id === extra.id)) list.push(extra);
  sel.innerHTML = list.map(s => `<option value="${s.id}">Silo ${mpEsc(s.numero)} · ${mpEsc(s.producto)} · ${mpEsc(s.categoria||'calidad pendiente')}</option>`).join('') || '<option value="">No hay silos abiertos - creá uno primero</option>';
  if(cur && list.some(s => s.id === cur)) sel.value = cur;
}

function mpSetHumMax(){
  mpHumMax = mpN(document.getElementById('mpHumMax').value);
  try { localStorage.setItem('mp_hum_max', String(mpHumMax)); } catch(e){}
  mpCalc();
}

function mpAddParcela(nro, pct){
  const id = mpParcelaCount++;
  const first = document.querySelectorAll('#parcelaRows .parcela-row').length === 0;
  document.getElementById('parcelaRows').insertAdjacentHTML('beforeend',
    `<div class="parcela-row" id="prow-${id}"><div><label>Nro. parcela</label><input class="pr-nro" placeholder="ej: 4" value="${mpEsc(nro==null?'':nro)}" oninput="mpCalc()"></div>`
    + `<div class="pr-pct"><label>% de esta parcela</label><input class="pr-p" type="number" step="0.01" placeholder="ej: 60" value="${pct==null?'':pct}" oninput="mpCalc()"></div>`
    + (first ? '' : `<button type="button" class="btn danger-ghost" onclick="document.getElementById('prow-${id}').remove();mpCalc()" title="Quitar">×</button>`)
    + `</div>`);
  mpCalc();
}

function mpLeerParcelas(){
  return Array.from(document.querySelectorAll('#parcelaRows .parcela-row')).map(r => ({
    nro: r.querySelector('.pr-nro').value.trim(),
    pct: r.querySelector('.pr-p').value === '' ? null : mpN(r.querySelector('.pr-p').value)
  })).filter(p => p.nro !== '' || p.pct !== null);
}

function mpCalc(){
  const f = document.getElementById('frmMP');
  if(!f) return;
  const neto = mpN(f.peso_bruto_kg.value) - mpN(f.peso_tara_kg.value);
  const dh = mpDescHum(f.pct_humedad.value);
  const tot = mpN(f.pct_impureza_gruesa.value) + mpN(f.pct_impureza_fina.value) + mpN(f.pct_descuento_calidad.value) + dh;
  document.getElementById('mpNeto').value = mpFk(neto,2) + ' kg';
  document.getElementById('mpDescHum').value = mpFk(dh,2) + ' %';
  document.getElementById('mpTotal').value = mpFk(tot,2) + ' %';
  const ps = mpLeerParcelas();
  const sum = ps.reduce((a,p) => a + (p.pct||0), 0);
  const ck = document.getElementById('mpPctCheck');
  if(!ps.length){ ck.className = 'pct-check'; ck.textContent = ''; }
  else if(Math.abs(sum-100) < 0.005){ ck.className = 'pct-check ok'; ck.textContent = '✓ Los % suman 100'; }
  else { ck.className = 'pct-check bad'; ck.textContent = 'Los % suman ' + mpFk(sum,2) + ' (tienen que sumar 100)'; }
  let tn = 0, td = 0, tf = 0;
  document.getElementById('mpCalcBody').innerHTML = (ps.length ? ps : [{nro:'-',pct:100}]).map(p => {
    const nt = neto*(p.pct||0)/100, d = nt*tot/100; tn += nt; td += d; tf += nt-d;
    return `<tr><td>${mpEsc(p.nro||'-')}</td><td class="num">${mpFk(p.pct||0,2)}</td><td class="num">${mpFk(nt,2)}</td><td class="num">${mpFk(d,2)}</td><td class="num">${mpFk(nt-d,2)}</td></tr>`;
  }).join('');
  document.getElementById('mpCalcFoot').innerHTML = `<tr><td>Total</td><td class="num"></td><td class="num">${mpFk(tn,2)}</td><td class="num">${mpFk(td,2)}</td><td class="num">${mpFk(tf,2)}</td></tr>`;
}

function mpSetMode(){
  const e = mpEditId !== null;
  const r = e ? MP_ROWS.find(x => x.id === mpEditId) : null;
  document.getElementById('mpTitle').innerHTML = ICONS.mp + (e ? ' Editando remisión ' + mpEsc(r ? r.nro_boleta : '') : ' Recepción de materia prima');
  document.getElementById('mpBtnSave').textContent = e ? 'Guardar cambios' : 'Guardar recepción';
  document.getElementById('mpBtnCancel').classList.toggle('hidden', !e);
  document.getElementById('mpBtnDel').classList.toggle('hidden', !e);
}

function mpResetForm(keep){
  const f = document.getElementById('frmMP');
  const k = keep ? {fecha:f.fecha.value, proveedor:f.proveedor.value, tipo_cosecha:f.tipo_cosecha.value, destino:f.destino.value, silo_bolsa_id:f.silo_bolsa_id.value, patio_destino:f.patio_destino.value, laboratorio:f.laboratorio.value} : null;
  f.reset();
  f.fecha.value = new Date().toISOString().slice(0,10);
  mpFillSilos(window.mpSilosAbiertos || [], null);
  if(k) Object.keys(k).forEach(x => { f[x].value = k[x]; });
  document.getElementById('parcelaRows').innerHTML = '';
  mpAddParcela('', 100);
  mpEditId = null;
  mpSetMode();
  f.nro_boleta.focus();
}

function mpCancel(){ mpResetForm(false); }

function mpDup(err){ return err && (err.code === '23505' || /duplicate|unique/i.test(err.message||'')); }

async function mpSubmit(e){
  e.preventDefault();
  const f = e.target;
  const ps = mpLeerParcelas();
  if(ps.length){
    if(ps.some(p => p.pct === null)){ toast('Completá el % de cada parcela','err'); return; }
    const s = ps.reduce((a,p) => a + p.pct, 0);
    if(Math.abs(s-100) >= 0.005){ toast('Los % de las parcelas deben sumar 100','err'); return; }
  }
  if(mpN(f.peso_bruto_kg.value) <= mpN(f.peso_tara_kg.value)){ toast('El peso bruto tiene que ser mayor que la tara','err'); return; }
  if(!f.silo_bolsa_id.value){ toast('Elegí un silo bolsa','err'); return; }
  const nul = v => { v = (v||'').trim(); return v === '' ? null : v; };
  const num = v => v === '' ? null : Number(v);
  const payload = {
    nro_boleta: f.nro_boleta.value.trim(),
    fecha: f.fecha.value,
    chapa_camion: nul(f.chapa_camion.value),
    chofer: nul(f.chofer.value),
    proveedor: nul(f.proveedor.value),
    tipo_cosecha: f.tipo_cosecha.value,
    destino: f.destino.value,
    peso_bruto_kg: Number(f.peso_bruto_kg.value),
    peso_tara_kg: Number(f.peso_tara_kg.value),
    pct_humedad: num(f.pct_humedad.value),
    temperatura_c: num(f.temperatura_c.value),
    pct_impureza_gruesa: num(f.pct_impureza_gruesa.value),
    pct_impureza_fina: num(f.pct_impureza_fina.value),
    pct_descuento_calidad: num(f.pct_descuento_calidad.value) === null ? 0 : num(f.pct_descuento_calidad.value),
    pct_descuento_humedad: mpDescHum(f.pct_humedad.value),
    laboratorio: f.laboratorio.value,
    silo_bolsa_id: f.silo_bolsa_id.value,
    patio_destino: f.patio_destino.value,
    observaciones: f.observaciones.value.trim()
  };
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  let recId = mpEditId;
  if(mpEditId !== null){
    const { error } = await sb.from('recepcion_mp').update(payload).eq('id', mpEditId);
    if(error){ btn.disabled = false; toast(mpDup(error) ? 'Ya existe una recepción con esa remisión' : 'Error: ' + error.message, 'err'); return; }
    const { error: eDel } = await sb.from('recepcion_parcela').delete().eq('recepcion_mp_id', mpEditId);
    if(eDel){ btn.disabled = false; toast('Error al actualizar parcelas: ' + eDel.message, 'err'); return; }
  } else {
    payload.creado_por = usuario || null;
    const { data, error } = await sb.from('recepcion_mp').insert(payload).select().single();
    if(error){ btn.disabled = false; toast(mpDup(error) ? 'Ya existe una recepción con esa remisión' : 'Error: ' + error.message, 'err'); return; }
    recId = data.id;
  }
  if(ps.length){
    const { error: errP } = await sb.from('recepcion_parcela').insert(ps.map(p => ({ recepcion_mp_id: recId, nro_parcela: p.nro || null, pct_parcela: p.pct })));
    if(errP){ btn.disabled = false; toast('Recepción guardada, pero error al guardar parcelas: ' + errP.message, 'err'); await mpLoad(); return; }
  }
  btn.disabled = false;
  const wasEdit = mpEditId !== null;
  toast('Recepción ' + payload.nro_boleta + (wasEdit ? ' actualizada' : ' guardada'), 'ok');
  mpResetForm(document.getElementById('mpKeep').checked && !wasEdit);
  await mpLoad();
}

function mpEdit(id){
  const r = MP_ROWS.find(x => x.id === id);
  if(!r) return;
  if(r.estado === 'ASIGNADA'){ toast('Esta carga ya está en un lote y no se puede editar','err'); return; }
  const f = document.getElementById('frmMP');
  mpEditId = id;
  ['nro_boleta','fecha','chapa_camion','chofer','proveedor','tipo_cosecha','destino','peso_bruto_kg','peso_tara_kg','pct_humedad','temperatura_c','pct_impureza_gruesa','pct_impureza_fina','pct_descuento_calidad','laboratorio','patio_destino','observaciones'].forEach(k => { f[k].value = r[k] == null ? '' : r[k]; });
  mpFillSilos(window.mpSilosAbiertos || [], r.silos_bolsa ? {id:r.silo_bolsa_id, numero:r.silos_bolsa.numero, producto:r.silos_bolsa.producto, categoria:r.silos_bolsa.categoria} : {id:r.silo_bolsa_id, numero:r.silo_bolsa_id, producto:'', categoria:''});
  f.silo_bolsa_id.value = r.silo_bolsa_id;
  document.getElementById('parcelaRows').innerHTML = '';
  mpParcelaCount = 0;
  const ps = r.recepcion_parcela || [];
  if(ps.length) ps.forEach(p => mpAddParcela(p.nro_parcela, p.pct_parcela)); else mpAddParcela('', 100);
  mpSetMode(); mpCalc();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function mpDelete(){
  if(mpEditId === null) return;
  const r = MP_ROWS.find(x => x.id === mpEditId);
  if(!r || r.estado === 'ASIGNADA'){ toast('Esta carga ya está en un lote y no se puede eliminar','err'); return; }
  if(!confirm('¿Eliminar la remisión ' + r.nro_boleta + '? Esta acción no se puede deshacer.')) return;
  const { error: e1 } = await sb.from('recepcion_parcela').delete().eq('recepcion_mp_id', r.id);
  if(e1){ toast('Error: ' + e1.message, 'err'); return; }
  const { error: e2 } = await sb.from('recepcion_mp').delete().eq('id', r.id);
  if(e2){ toast('Error: ' + e2.message, 'err'); return; }
  toast('Recepción eliminada', 'ok');
  mpResetForm(false);
  await mpLoad();
}

async function mpLoad(){
  const { data, error } = await sb.from('recepcion_mp')
    .select('*, silos_bolsa(numero,producto,categoria), recepcion_parcela(nro_parcela,pct_parcela), lote_recepcion(lote_id)')
    .order('fecha',{ascending:false}).order('creado_en',{ascending:false}).limit(2000);
  const el = document.getElementById('mpList');
  if(!el) return;
  if(error){ el.innerHTML = `<div class="empty">Error: ${mpEsc(error.message)}</div>`; return; }
  MP_ROWS = data || [];
  const provs = Array.from(new Set(MP_ROWS.map(r => r.proveedor).filter(Boolean)));
  const dl = document.getElementById('mpProvList');
  if(dl) dl.innerHTML = provs.map(p => `<option value="${mpEsc(p)}">`).join('');
  const sel = document.getElementById('mpFSilo');
  const cur = sel.value;
  const silosVistos = {};
  MP_ROWS.forEach(r => { if(r.silos_bolsa) silosVistos[r.silo_bolsa_id] = r.silos_bolsa.numero; });
  (window.mpSilosAbiertos || []).forEach(s => { silosVistos[s.id] = s.numero; });
  sel.innerHTML = '<option value="">Todos</option>' + Object.keys(silosVistos).map(id => `<option value="${mpEsc(id)}">${mpEsc(silosVistos[id])}</option>`).join('');
  sel.value = cur;
  mpRenderSilos(silosVistos);
  mpRenderList();
}

function mpRenderSilos(silosVistos){
  const box = document.getElementById('mpSiloCards');
  const ids = Object.keys(silosVistos);
  if(!ids.length){ box.innerHTML = '<div class="empty">Todavía no hay silos con recepciones.</div>'; return; }
  box.innerHTML = ids.map(id => {
    const rs = MP_ROWS.filter(r => r.silo_bolsa_id === id);
    const kg = rs.reduce((a,r) => a + Number(r.kg_liquido_carga||0), 0);
    return `<div class="silo-card"><div class="t">Silo bolsa ${mpEsc(silosVistos[id])}</div><div class="n">${mpFk(kg)} kg</div><div class="s">${rs.length} ${rs.length===1?'camión':'camiones'} · peso final</div></div>`;
  }).join('');
}

function mpFilas(r){
  const neto = Number(r.peso_neto_kg||0), tot = Number(r.pct_total_descuento||0);
  const ps = (r.recepcion_parcela && r.recepcion_parcela.length) ? r.recepcion_parcela : [{nro_parcela:'-', pct_parcela:100}];
  return ps.map(p => {
    const pct = p.pct_parcela == null ? 100 : Number(p.pct_parcela);
    const nt = neto*pct/100, d = nt*tot/100;
    return { r, nro:p.nro_parcela||'-', pct, neto:nt, bruto:Number(r.peso_tara_kg||0)+nt, desc:d, fin:nt-d, tot, dh:Number(r.pct_descuento_humedad||0) };
  });
}

function mpFiltradas(){
  const q = (document.getElementById('mpQ').value || '').toLowerCase();
  const s = document.getElementById('mpFSilo').value;
  return MP_ROWS.flatMap(mpFilas).filter(x => (!s || x.r.silo_bolsa_id === s) && (!q || [x.r.nro_boleta, x.r.chofer, x.r.proveedor, x.r.chapa_camion].join(' ').toLowerCase().includes(q)));
}

function mpLoteDe(r){
  const lr = r.lote_recepcion;
  if(!lr) return '';
  return Array.isArray(lr) ? (lr[0] ? lr[0].lote_id : '') : (lr.lote_id || '');
}

function mpRenderList(){
  const el = document.getElementById('mpList');
  if(!el) return;
  const fs = mpFiltradas();
  if(!fs.length){ el.innerHTML = '<div class="empty">No hay recepciones para mostrar.</div>'; return; }
  const tn = fs.reduce((a,x) => a + x.neto, 0), td = fs.reduce((a,x) => a + x.desc, 0), tf = fs.reduce((a,x) => a + x.fin, 0), tb = fs.reduce((a,x) => a + x.bruto, 0);
  const seen = {}, hs = [];
  fs.forEach(x => { if(!seen[x.r.id] && x.r.pct_humedad != null){ seen[x.r.id] = 1; hs.push(Number(x.r.pct_humedad)); } });
  const hp = hs.length ? hs.reduce((a,b) => a + b, 0)/hs.length : 0;
  const pp = fs.reduce((a,x) => a + x.tot*x.neto, 0) / (tn || 1);
  el.innerHTML = `<table><thead><tr><th>Remisión</th><th>Fecha</th><th>Placa</th><th>Chofer</th><th>Proveedor / Productor</th><th>Parcela</th><th class="num">% parcela</th><th>Tipo</th><th class="num sep">Peso bruto</th><th class="num">Peso tara</th><th class="num">Peso neto</th><th class="num sep">Humedad %</th><th class="num">Temp °C</th><th class="num">Impurezas %</th><th class="num">Desc. calidad %</th><th class="num">Desc. humedad %</th><th class="num">Total desc. %</th><th class="num sep">Descuento kg</th><th class="num">Peso final kg</th><th class="sep">Observaciones</th><th>Ubicación</th><th>Silo bolsa</th><th>Lote</th><th>Para</th><th>Estado</th><th>Laboratorio</th><th></th></tr></thead><tbody>${
    fs.map(x => { const r = x.r, lote = mpLoteDe(r), asig = r.estado === 'ASIGNADA';
      return `<tr><td>${mpEsc(r.nro_boleta)}</td><td>${mpFd(r.fecha)}</td><td>${mpEsc(r.chapa_camion||'')}</td><td>${mpEsc(r.chofer||'')}</td><td>${mpEsc(r.proveedor||'')}</td><td>${mpEsc(x.nro)}</td><td class="num">${mpFk(x.pct,2)}</td><td>${mpEsc(r.tipo_cosecha||'')}</td><td class="num sep">${mpFk(x.bruto)}</td><td class="num">${mpFk(r.peso_tara_kg)}</td><td class="num">${mpFk(x.neto)}</td><td class="num sep">${r.pct_humedad==null?'':mpFk(r.pct_humedad,1)}</td><td class="num">${r.temperatura_c==null?'':mpFk(r.temperatura_c)}</td><td class="num">${mpFk(Number(r.pct_impureza_gruesa||0)+Number(r.pct_impureza_fina||0),2)}</td><td class="num">${mpFk(r.pct_descuento_calidad,2)}</td><td class="num${x.dh>0?' hum':''}">${mpFk(x.dh,2)}</td><td class="num">${mpFk(x.tot,2)}</td><td class="num sep">${mpFk(x.desc)}</td><td class="num"><b>${mpFk(x.fin)}</b></td><td class="sep">${mpEsc(r.observaciones||'')}</td><td>${mpEsc(r.patio_destino||'')}</td><td>${mpEsc(r.silos_bolsa ? r.silos_bolsa.numero : '')}</td><td>${lote ? mpEsc(lote) : '<span style="color:var(--text-muted)">—</span>'}</td><td>${mpEsc(r.destino||'')}</td><td><span class="badge ${asig?'ok':'warn'}">${asig?'Procesado':'Sin procesar'}</span></td><td>${mpEsc(r.laboratorio||'')}</td><td>${asig ? '' : `<button class="edit-btn" onclick="mpEdit('${mpEsc(r.id)}')">Editar</button>`}</td></tr>`; }).join('')
  }</tbody><tfoot><tr><td colspan="8">Totales · ${fs.length} filas</td><td class="num sep">${mpFk(tb)}</td><td></td><td class="num">${mpFk(tn)}</td><td class="num sep">${mpFk(hp,1)} prom.</td><td colspan="4" class="num">${mpFk(pp,2)} prom.</td><td class="num sep">${mpFk(td)}</td><td class="num">${mpFk(tf)}</td><td colspan="8" class="sep"></td></tr></tfoot></table>`;
}

function mpExport(){
  const fs = mpFiltradas();
  const H = ['N° Remisión','Fecha','Placa Camión','Chofer','Proveedor / Productor','Parcela','% de la parcela','Tipo','Peso Bruto','Peso Tara','Peso Neto','Humedad (%)','Temperatura (°C)','Impureza gruesa (%)','Impureza fina (%)','Descuento Calidad (%)','Descuento Humedad (%)','Total Descuento %','Descuento (kg)','Peso Final (kg)','Observaciones','Ubicación','Silo Bolsa','Lote','Para','Estado','Laboratorio'];
  const L = fs.map(x => { const r = x.r; return [r.nro_boleta, mpFd(r.fecha), r.chapa_camion, r.chofer, r.proveedor, x.nro, x.pct, r.tipo_cosecha, x.bruto.toFixed(2), r.peso_tara_kg, x.neto.toFixed(2), r.pct_humedad, r.temperatura_c, r.pct_impureza_gruesa, r.pct_impureza_fina, r.pct_descuento_calidad, x.dh.toFixed(2), x.tot.toFixed(2), x.desc.toFixed(2), x.fin.toFixed(2), r.observaciones, r.patio_destino, r.silos_bolsa ? r.silos_bolsa.numero : '', mpLoteDe(r), r.destino, r.estado === 'ASIGNADA' ? 'Procesado' : 'Sin procesar', r.laboratorio]; });
  const csv = '﻿' + [H].concat(L).map(r => r.map(c => '"' + String(c==null?'':c).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'recepcion_materia_prima.csv';
  a.click();
}

async function submitSilo(e){

  const { data, error } = await sb.from('silos_bolsa').insert(payload).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Silo ' + data.id + ' creado', 'ok');
  renderSilo();
}

async function loadSiloList(){
  const { data, error } = await sb.from('silos_bolsa').select('*').order('creado_en',{ascending:false});
  const el = document.getElementById('siloList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay silos bolsa.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Nº</th><th>Producto</th><th>Categoría</th><th>Patio</th><th>Estado</th><th></th></tr></thead><tbody>
    ${data.map(s => `<tr><td>${s.id}</td><td>${s.numero}</td><td>${s.producto}</td><td><select onchange="setSiloCategoria('${s.id}', this.value)" style="min-width:150px"><option value=""${s.categoria?'':' selected'}>Pendiente (lab)</option>${CATEGORIAS.map(c => `<option${s.categoria===c?' selected':''}>${c}</option>`).join('')}</select></td><td>${s.patio||'-'}</td><td><span class="badge ${s.estado==='ABIERTO'?'ok':'off'}">${s.estado}</span></td>
    <td>${s.estado==='ABIERTO' ? `<button class="btn secondary small" onclick="cerrarSilo('${s.id}')">Cerrar</button>` : ''}</td></tr>`).join('')}
  </tbody></table>`;
}

async function setSiloCategoria(id, v){
  const { error } = await sb.from('silos_bolsa').update({categoria: v || null}).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); loadSiloList(); return; }
  toast(v ? 'Calidad del silo actualizada' : 'Calidad del silo: pendiente', 'ok');
}

async function cerrarSilo(id){
  if(!confirm('¿Cerrar este silo bolsa? Ya no vas a poder cargarle más recepciones.')) return;
  const { error } = await sb.from('silos_bolsa').update({estado:'CERRADO'}).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  loadSiloList();
}

let LOTE_ROWS = [];
let loteSel = new Set();
let loteFiltro = { q:'', silo:'', prov:'', solo:false };
let loteUltimo = null;
let loteKg = {};
let LOTE_LIST = [];
let loteListQ = '';

async function renderLote(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.lote} Crear lote</h2>
    <div class="desc">1) Completá los datos del lote. 2) Elegí las cargas de abajo (podés filtrar por silo, proveedor o buscar). 3) Si de una carga vas a usar solo una parte, cambiá los kg en la columna <b>Usar kg</b>; el resto queda disponible para otro lote. 4) Creá el lote.</div>
    <div class="grid">
      <div><label>Producto *</label><select id="loteProducto">${opt(PRODUCTOS)}</select></div>
      <div><label>Calidad</label><select id="loteCategoria"><option value="">-</option>${opt(CATEGORIAS)}</select></div>
      <div><label>Responsable</label><input id="loteResponsable"></div>
      <div><label>Código de laboratorio</label><input id="loteCodigoLab" placeholder="Ej: PROCHCE 030-26"></div>
    </div>
  </div>
  <div class="card">
    <h2>Cargas disponibles</h2>
    <div id="ltSilos" class="lt-chips"></div>
    <div class="lt-filtros">
      <input type="search" id="ltBuscar" placeholder="Buscar remisión, proveedor, chofer o chapa..." autocomplete="off" oninput="loteFiltro.q=this.value;ltRender()">
      <select id="ltProv" onchange="loteFiltro.prov=this.value;ltRender()"><option value="">Todos los proveedores</option></select>
      <label class="lt-solo"><input type="checkbox" id="ltSolo" onchange="loteFiltro.solo=this.checked;ltRender()"> Solo seleccionadas</label>
    </div>
    <div id="ltTabla" class="lt-scroll"><div class="empty">Cargando...</div></div>
    <div id="ltBarra" class="lt-barra"></div>
  </div>
  <div class="card">
    <h2>Lotes</h2>
    <input type="search" id="loteListBuscar" placeholder="Buscar lote, código de laboratorio, producto..." autocomplete="off" oninput="loteListQ=this.value;loteListRender()" style="margin-bottom:10px">
    <div id="loteList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  loteSel = new Set(); loteUltimo = null; loteKg = {}; loteListQ = '';
  loteFiltro = { q:'', silo:'', prov:'', solo:false };
  loadRecepcionChecklist();
  loadLoteList();
}

async function loadRecepcionChecklist(){
  const { data, error } = await sb.from('recepcion_mp').select('*, silos_bolsa(numero,categoria,producto)').eq('estado','DISPONIBLE').order('fecha').order('nro_boleta');
  const el = document.getElementById('ltTabla');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  LOTE_ROWS = data || [];
  if(!LOTE_ROWS.length){ el.innerHTML = '<div class="empty">No hay cargas disponibles (todas ya están asignadas a un lote).</div>'; ltBarra(); return; }
  const provs = Array.from(new Set(LOTE_ROWS.map(r => r.proveedor).filter(Boolean))).sort();
  document.getElementById('ltProv').innerHTML = '<option value="">Todos los proveedores</option>' + provs.map(p => `<option>${mpEsc(p)}</option>`).join('');
  ltRender();
}

function ltN(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:0}); }
function ltP(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{minimumFractionDigits:1,maximumFractionDigits:2}); }
function ltLiq(r){ return Number(r.kg_liquido_carga||0); }
function ltSaldo(r){ return Math.max(0, ltLiq(r) - Number(r.kg_liquido_usado||0)); }
function ltUsar(r){ return loteKg[r.id] !== undefined ? loteKg[r.id] : ltSaldo(r); }
function ltAdd(r){ loteSel.add(r.id); if(loteKg[r.id] === undefined) loteKg[r.id] = Math.round(ltSaldo(r)*100)/100; }
function ltDel(id){ loteSel.delete(id); delete loteKg[id]; }
function ltSiloNum(r){ return r.silos_bolsa ? r.silos_bolsa.numero : r.silo_bolsa_id; }

function ltFiltradas(){
  const q = (loteFiltro.q || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
  return LOTE_ROWS.filter(r => {
    if(loteFiltro.silo && r.silo_bolsa_id !== loteFiltro.silo) return false;
    if(loteFiltro.prov && r.proveedor !== loteFiltro.prov) return false;
    if(loteFiltro.solo && !loteSel.has(r.id)) return false;
    if(q.length){ const h = [r.nro_boleta, r.proveedor, r.chofer, r.chapa_camion, ltSiloNum(r)].join(' ').toLowerCase(); if(!q.every(w => h.includes(w))) return false; }
    return true;
  });
}

function ltRender(){
  // chips por silo
  const porSilo = {};
  LOTE_ROWS.forEach(r => { const s = porSilo[r.silo_bolsa_id] = porSilo[r.silo_bolsa_id] || { id:r.silo_bolsa_id, num:ltSiloNum(r), n:0, kg:0, sel:0 }; s.n++; s.kg += ltSaldo(r); if(loteSel.has(r.id)) s.sel++; });
  const silos = Object.values(porSilo).sort((a,b) => String(a.num).localeCompare(String(b.num), 'es', {numeric:true}));
  const totKg = LOTE_ROWS.reduce((a,r) => a + ltSaldo(r), 0);
  document.getElementById('ltSilos').innerHTML =
    `<button type="button" class="lt-chip${loteFiltro.silo===''?' on':''}" onclick="ltSilo('')"><b>Todos</b><span>${LOTE_ROWS.length} cargas · ${ltN(totKg)} kg</span></button>` +
    silos.map(s => `<button type="button" class="lt-chip${loteFiltro.silo===s.id?' on':''}" onclick="ltSilo('${s.id}')"><b>${mpEsc(s.num)}</b><span>${s.n} cargas · ${ltN(s.kg)} kg</span>${s.sel?`<i>${s.sel} elegida${s.sel===1?'':'s'}</i>`:''}</button>`).join('');
  // tabla
  const fs = ltFiltradas();
  const todasSel = fs.length > 0 && fs.every(r => loteSel.has(r.id));
  const el = document.getElementById('ltTabla');
  if(!fs.length){ el.innerHTML = '<div class="empty">Ninguna carga coincide con el filtro.</div>'; }
  else {
    el.innerHTML = `<table class="lt-tabla"><thead><tr>
      <th style="width:34px"><input type="checkbox" ${todasSel?'checked':''} onchange="ltTodas(this.checked)" title="Elegir / quitar todas las que se ven"></th>
      <th>Remisión</th><th>Fecha</th><th>Proveedor</th><th>Silo</th><th class="num">Neto kg</th><th class="num">Hum %</th><th class="num">Imp %</th><th class="num">Líquido disp. kg</th><th class="num">Usar kg</th></tr></thead><tbody>
      ${fs.map(r => `<tr class="${loteSel.has(r.id)?'lt-sel':''}" onclick="ltFila(event,'${r.id}')"><td><input type="checkbox" ${loteSel.has(r.id)?'checked':''} tabindex="-1"></td>
        <td><b>${mpEsc(r.nro_boleta)}</b></td><td>${mpFd(r.fecha)}</td><td>${mpEsc(r.proveedor||'')}<span class="lt-parcial">${mpEsc(r.tipo_cosecha||'')}</span></td><td>${mpEsc(ltSiloNum(r))}</td>
        <td class="num">${ltN(r.peso_neto_kg)}</td><td class="num">${ltP(r.pct_humedad)}</td><td class="num">${ltP(Number(r.pct_impureza_gruesa||0)+Number(r.pct_impureza_fina||0))}</td><td class="num"><b>${ltN(ltSaldo(r))}</b>${Number(r.kg_liquido_usado||0)>0?`<span class="lt-parcial">de ${ltN(ltLiq(r))} (ya usados ${ltN(r.kg_liquido_usado)})</span>`:''}</td>
        <td class="num" onclick="event.stopPropagation()">${loteSel.has(r.id)?`<input type="number" class="lt-kg" min="1" max="${Math.floor(ltSaldo(r)*100)/100}" step="any" value="${loteKg[r.id]}" oninput="ltKgInput('${r.id}',this.value)" onchange="ltKgFin('${r.id}',this.value)" title="Kg líquidos a usar de esta carga">`:'<span class="lt-muted">-</span>'}</td></tr>`).join('')}
    </tbody></table>`;
  }
  ltBarra(fs);
}

function ltBarra(fs){
  const el = document.getElementById('ltBarra'); if(!el) return;
  fs = fs || ltFiltradas();
  const sel = LOTE_ROWS.filter(r => loteSel.has(r.id));
  const use = r => Math.min(Number(ltUsar(r))||0, ltSaldo(r));
  const frac = r => ltLiq(r) ? use(r) / ltLiq(r) : 0;
  const liq = sel.reduce((a,r) => a + use(r), 0);
  const neto = sel.reduce((a,r) => a + Number(r.peso_neto_kg||0) * frac(r), 0);
  const w = f => neto ? sel.reduce((a,r) => a + Number(r.peso_neto_kg||0) * frac(r) * f(r), 0) / neto : null;
  const hum = w(r => Number(r.pct_humedad||0)), imp = w(r => Number(r.pct_impureza_gruesa||0)+Number(r.pct_impureza_fina||0));
  const bySilo = {}; sel.forEach(r => { const k = ltSiloNum(r); bySilo[k] = (bySilo[k]||0) + 1; });
  const desglose = Object.entries(bySilo).map(([k,v]) => `${mpEsc(k)}: ${v}`).join(' · ');
  const parciales = sel.filter(r => use(r) < ltSaldo(r) - 0.5).length;
  const visSinSel = fs.filter(r => !loteSel.has(r.id)).length;
  el.innerHTML = `<div class="lt-res">${sel.length
      ? `<b>${sel.length}</b> carga${sel.length===1?'':'s'} elegida${sel.length===1?'':'s'} · <b>${ltN(liq)} kg</b> líquidos <span class="lt-muted">(${ltN(neto)} kg netos · hum. prom. ${ltP(hum)}% · imp. prom. ${ltP(imp)}%)</span>${parciales?` <span class="lt-muted">· ${parciales} con uso parcial</span>`:''}<div class="lt-muted">${desglose}</div>`
      : '<span class="lt-muted">Todavía no elegiste ninguna carga. Tocá una fila (o usá las casillas) para elegirla.</span>'}</div>
    <div class="lt-acc">
      ${visSinSel ? `<button type="button" class="btn secondary small" onclick="ltTodas(true)">Elegir las ${visSinSel} que se ven</button>` : ''}
      ${sel.length ? `<button type="button" class="btn secondary small" onclick="ltLimpiar()">Quitar todas</button>` : ''}
      <button type="button" class="btn" ${sel.length?'':'disabled'} onclick="crearLote()">${ICONS.plus} Crear lote${sel.length?` con ${sel.length}`:''}</button>
    </div>`;
}

function ltKgInput(id, v){ const r = LOTE_ROWS.find(x => x.id === id); if(!r) return; const n = parseFloat(String(v).replace(',','.')); loteKg[id] = isNaN(n) ? 0 : n; ltBarra(); }
function ltKgFin(id, v){
  const r = LOTE_ROWS.find(x => x.id === id); if(!r) return;
  let n = parseFloat(String(v).replace(',','.'));
  if(isNaN(n) || n <= 0) n = ltSaldo(r);
  if(n > ltSaldo(r)){ n = ltSaldo(r); toast('Esa carga solo tiene ' + ltN(n) + ' kg líquidos disponibles', 'err'); }
  loteKg[id] = Math.round(n*100)/100;
  const sc = document.getElementById('ltTabla'), top = sc ? sc.scrollTop : 0;
  ltRender();
  const sc2 = document.getElementById('ltTabla'); if(sc2) sc2.scrollTop = top;
}

function ltSilo(id){ loteFiltro.silo = (loteFiltro.silo === id ? '' : id); ltRender(); }
function ltLimpiar(){ loteSel.clear(); loteKg = {}; loteUltimo = null; ltRender(); }
function ltTodas(on){ ltFiltradas().forEach(r => on ? ltAdd(r) : ltDel(r.id)); ltRender(); }
function ltFila(ev, id){
  const fs = ltFiltradas();
  if(ev.shiftKey && loteUltimo && fs.some(r => r.id === loteUltimo)){
    const a = fs.findIndex(r => r.id === loteUltimo), b = fs.findIndex(r => r.id === id);
    const [i,j] = a < b ? [a,b] : [b,a];
    for(let k = i; k <= j; k++) ltAdd(fs[k]);
  } else {
    if(loteSel.has(id)) ltDel(id); else ltAdd(LOTE_ROWS.find(x => x.id === id));
  }
  loteUltimo = id;
  const sc = document.getElementById('ltTabla'), top = sc ? sc.scrollTop : 0;
  ltRender();
  const sc2 = document.getElementById('ltTabla'); if(sc2) sc2.scrollTop = top;
}

async function crearLote(){
  const seleccionadas = LOTE_ROWS.filter(r => loteSel.has(r.id));
  if(!seleccionadas.length){ toast('Elegí al menos una carga', 'err'); return; }
  const producto = document.getElementById('loteProducto').value;
  const categoria = document.getElementById('loteCategoria').value || null;
  const responsable = document.getElementById('loteResponsable').value || null;
  const codigo_lab = (document.getElementById('loteCodigoLab').value || '').trim() || null;
  const uso = seleccionadas.map(r => ({ r, kg: Math.min(Math.round((Number(ltUsar(r))||0)*100)/100, ltSaldo(r)) }));
  const mala = uso.find(u => !(u.kg > 0));
  if(mala){ toast('Revisá los kg a usar de la remisión ' + mala.r.nro_boleta, 'err'); return; }
  const kg = uso.reduce((a,u) => a + u.kg, 0);
  const parciales = uso.filter(u => u.kg < ltSaldo(u.r) - 0.5).length;
  if(!confirm('¿Crear un lote de ' + producto + (categoria ? ' (' + categoria + ')' : '') + (codigo_lab ? ' · ' + codigo_lab : '') + ' con ' + seleccionadas.length + ' carga(s) y ' + ltN(kg) + ' kg líquidos' + (parciales ? ' (' + parciales + ' con uso parcial)' : '') + '?')) return;

  const nuevo = {producto, categoria, responsable, creado_por: usuario||null};
  if(codigo_lab) nuevo.codigo_lab = codigo_lab;
  const { data: lote, error } = await sb.from('lotes').insert(nuevo).select().single();
  if(error){ toast('Error: ' + error.message, 'err'); return; }

  const rows = uso.map(u => {
    const fila = {lote_id: lote.id, recepcion_mp_id: u.r.id};
    const yaUsado = Number(u.r.kg_liquido_usado||0);
    if(yaUsado > 0 || u.kg < ltLiq(u.r) - 0.5) fila.kg_liquido_usado = u.kg;
    return fila;
  });
  const { error: e2 } = await sb.from('lote_recepcion').insert(rows);
  if(e2){ toast('Lote creado pero error asignando cargas: ' + e2.message, 'err'); return; }

  toast('Lote ' + lote.id + ' creado con ' + seleccionadas.length + ' carga(s)', 'ok');
  renderLote();
}

function loteSelectorHTML(pref){
  return `<div class="lote-sel">
    <input type="search" id="${pref}Buscar" class="lote-sel-q" placeholder="Buscar lote, código de laboratorio, producto o calidad..." autocomplete="off">
    <select id="${pref}Sel" class="lote-sel-s"></select>
    <div id="${pref}Cnt" class="lote-sel-cnt"></div>
  </div>`;
}
function loteSelectorInit(pref, lotes, onPick, key){
  const q = document.getElementById(pref+'Buscar'), sel = document.getElementById(pref+'Sel'), cnt = document.getElementById(pref+'Cnt');
  const label = l => `${l.id}${l.codigo_lab ? ' · ' + l.codigo_lab : ''} · ${l.producto}${l.categoria ? ' · ' + l.categoria : ''}`;
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let last = null; try { last = localStorage.getItem(key); } catch(e){}
  let current = (last && lotes.some(l => l.id === last)) ? last : lotes[0].id;
  function fill(){
    const t = norm(q.value).trim().split(/\s+/).filter(Boolean);
    const list = lotes.filter(l => { const h = norm(label(l)); return t.every(w => h.includes(w)); });
    sel.innerHTML = list.map(l => `<option value="${l.id}">${label(l)}</option>`).join('') || '<option value="">Ningún lote coincide</option>';
    cnt.textContent = t.length ? `${list.length} de ${lotes.length} lotes en proceso` : `${lotes.length} lote${lotes.length===1?'':'s'} en proceso`;
    if(list.some(l => l.id === current)) sel.value = current;
    else if(list.length){ sel.value = list[0].id; pick(list[0].id); }
  }
  function pick(id){
    current = id;
    try { localStorage.setItem(key, id); } catch(e){}
    onPick(id);
  }
  q.addEventListener('input', fill);
  sel.addEventListener('change', () => { if(sel.value) pick(sel.value); });
  fill();
  pick(current);
}

    ${data.map(t => `<tr><td>${fmtDate(t.fecha)}</td><td>${t.turno}</td><td>${fmtKg(t.kg_reales_procesados)}</td><td>${fmtKg(t.mermas_kg)}</td><td>${t.ajustado_por||'-'}</td></tr>`).join('')}
  </tbody></table>`;
}

async function cerrarLoteFinal(){
  const kgProc = parseFloat(document.getElementById('cfKgProc').value);
  if(!kgProc){ toast('Cargá el kg procesado total', 'err'); return; }
  if(!confirm('¿Cerrar definitivamente el lote ' + loteActivoId + '? No se puede deshacer desde acá.')) return;

  const { data: sumRow } = await sb.from('v_resumen_lotes').select('*').eq('lote_id', loteActivoId).single();
  const payload = {
    lote_id: loteActivoId,
    kg_ingresado_mp: sumRow ? sumRow.kg_mp_asignado : 0,
    kg_procesado_total: kgProc,
    mermas_totales_kg: parseFloat(document.getElementById('cfMermas').value) || null,
    analisis_mp_resumen: document.getElementById('cfAnalisisMp').value || null,
    analisis_pt_resumen: document.getElementById('cfAnalisisPt').value || null,
    diferencia_analisis: document.getElementById('cfDif').value || null,
    cerrado_por: usuario || null
  };
  const { error } = await sb.from('lote_cierre').insert(payload);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Lote ' + loteActivoId + ' cerrado', 'ok');
  renderCierre();
}

  const el = document.getElementById('resumenBody');

    <div class="stat"><div class="n">${fmtKg(totalProc)}</div><div class="l">Procesado</div></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Lote</th><th>Cód. lab.</th><th>Producto</th><th>Estado</th><th>Cargas MP</th><th>Kg MP</th><th>Bigbags</th><th>Rendimiento</th></tr></thead><tbody>
    ${data.map(r => `<tr><td>${r.lote_id}</td><td>${mpEsc(labDe[r.lote_id]||'-')}</td><td>${r.producto}</td><td><span class="badge ${r.estado==='EN_PROCESO'?'warn':'ok'}">${r.estado}</span></td><td>${r.cantidad_cargas_mp}</td><td>${fmtKg(r.kg_mp_asignado)}</td><td>${r.cantidad_bigbags}</td><td>${fmtPct(r.rendimiento_pct)}</td></tr>`).join('')}

async function renderUsuarios(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.usuarios} Gestión de usuarios</h2>
    <div class="desc">Para crear una cuenta nueva: Supabase → Authentication → Users → Add user (email + contraseña). Acá asignás el rol y activás/desactivás el acceso.</div>
    <div id="usuariosList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;

async function loadUsuarios(){
  const { data, error } = await sb.from('perfiles').select('*').order('creado_en');

  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }

      <td><input type="checkbox" id="activo-${u.id}" style="width:auto;margin:0;" ${u.activo?'checked':''}></td>

async function guardarUsuario(id){
  const rol = document.getElementById('rol-'+id).value;
  const activo = document.getElementById('activo-'+id).checked;
  const { error } = await sb.from('perfiles').update({ rol, activo }).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Usuario actualizado', 'ok');
  if(currentUser && id === currentUser.id){ miRol = rol; }
  loadUsuarios();
}

// ============================================================
// CAMBIAR CONTRASEÑA (solo usuario logueado, sobre su propia cuenta)
// - Pide la contraseña actual, o un código enviado por mail si no la recuerda
// - Mínimo 8 caracteres con letras y números; bloqueo tras 5 intentos fallidos
// - Al cambiarla, cierra las sesiones abiertas en otros dispositivos
// ============================================================
let pwdModo = 'actual';
let pwdFallos = 0;
let pwdBloqueoHasta = 0;
let pwdOcupado = false;

const PWD_KEY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4"/><path d="M18 5l3 3"/><path d="M15 8l3 3"/></svg>';

function initBotonPass(){
  const chip = document.getElementById('usuarioChip');
  if(!chip || document.getElementById('pwdBtn')) return;
  const wrap = document.createElement('div');
  wrap.className = 'appbar-actions';
  chip.parentNode.insertBefore(wrap, chip);
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'pwdBtn'; b.className = 'usuario-btn pwd-btn';
  b.title = 'Cambiar contraseña'; b.setAttribute('aria-label','Cambiar contraseña');
  b.innerHTML = PWD_KEY_ICON;
  b.onclick = abrirCambioPass;
  wrap.appendChild(b);
  wrap.appendChild(chip);
}

function pwdMsg(txt, tipo){
  const el = document.getElementById('pwdMsg');
  if(!el) return;
  el.textContent = txt || '';
  el.className = 'auth-msg' + (tipo ? ' ' + tipo : '');
}

function pwdSetModo(modo){
  pwdModo = modo;
  document.getElementById('pwdBoxActual').classList.toggle('hidden', modo !== 'actual');
  document.getElementById('pwdBoxCodigo').classList.toggle('hidden', modo !== 'codigo');
  document.getElementById('pwdToggle').textContent = modo === 'actual' ? 'No recuerdo mi contraseña actual' : 'Prefiero usar mi contraseña actual';
  pwdMsg('');
}

async function abrirCambioPass(){
  if(document.getElementById('pwdModal')) return;
  const { data } = await sb.auth.getUser();
  const user = data && data.user;
  if(!user){ toast('Tenés que iniciar sesión primero','err'); return; }
  pwdModo = 'actual';
  const m = document.createElement('div');
  m.id = 'pwdModal'; m.className = 'pwd-overlay';
  m.innerHTML = `<div class="pwd-box" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
    <h3 id="pwdTitle">Cambiar contraseña</h3>
    <div class="desc" id="pwdUser"></div>
    <form id="frmPwd" autocomplete="off">
      <div id="pwdBoxActual">
        <label>Contraseña actual</label>
        <input type="password" id="pwdActual" autocomplete="current-password">
      </div>
      <div id="pwdBoxCodigo" class="hidden">
        <label>Código enviado a tu mail</label>
        <div class="pwd-row"><input id="pwdCodigo" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><button type="button" class="btn secondary small" id="pwdEnviar" style="margin-top:0;height:42px;">Enviar código</button></div>
      </div>
      <button type="button" class="pwd-link" id="pwdToggle">No recuerdo mi contraseña actual</button>
      <label>Nueva contraseña</label>
      <input type="password" id="pwdNueva" autocomplete="new-password">
      <label>Repetir nueva contraseña</label>
      <input type="password" id="pwdRepite" autocomplete="new-password">
      <div class="note">Mínimo 8 caracteres, con letras y números.</div>
      <div id="pwdMsg" class="auth-msg"></div>
      <div class="pwd-actions">
        <button type="button" class="btn secondary" id="pwdCancelar">Cancelar</button>
        <button type="submit" class="btn" id="pwdGuardar">Cambiar contraseña</button>
      </div>
    </form>
  </div>`;
  document.body.appendChild(m);
  document.getElementById('pwdUser').textContent = user.email || '';
  document.getElementById('pwdToggle').onclick = () => pwdSetModo(pwdModo === 'actual' ? 'codigo' : 'actual');
  document.getElementById('pwdCancelar').onclick = cerrarCambioPass;
  document.getElementById('pwdEnviar').onclick = pwdEnviarCodigo;
  document.getElementById('frmPwd').addEventListener('submit', pwdGuardar);
  m.addEventListener('mousedown', e => { if(e.target === m) cerrarCambioPass(); });
  document.addEventListener('keydown', pwdEsc);
  document.getElementById('pwdActual').focus();
}

function pwdEsc(e){ if(e.key === 'Escape') cerrarCambioPass(); }

function cerrarCambioPass(){
  const m = document.getElementById('pwdModal');
  if(m) m.remove();
  document.removeEventListener('keydown', pwdEsc);
}

async function pwdEnviarCodigo(){
  if(pwdOcupado) return;
  pwdOcupado = true;
  const btn = document.getElementById('pwdEnviar'); btn.disabled = true;
  const { error } = await sb.auth.reauthenticate();
  pwdOcupado = false; btn.disabled = false;
  if(error){ pwdMsg('No se pudo enviar el código: ' + error.message, 'err'); return; }
  pwdMsg('Te enviamos un código a tu mail. Escribilo arriba.', 'ok');
}

function pwdValidar(nueva, repite, actual){
  if(nueva.length < 8) return 'La nueva contraseña debe tener al menos 8 caracteres';
  if(!/[A-Za-z]/.test(nueva) || !/[0-9]/.test(nueva)) return 'Tiene que incluir letras y números';
  if(nueva !== repite) return 'Las contraseñas nuevas no coinciden';
  if(actual && nueva === actual) return 'La nueva contraseña tiene que ser distinta de la actual';
  return null;
}

async function pwdGuardar(e){
  e.preventDefault();
  if(pwdOcupado) return;
  if(Date.now() < pwdBloqueoHasta){
    pwdMsg('Demasiados intentos. Esperá ' + Math.ceil((pwdBloqueoHasta - Date.now())/1000) + ' segundos.', 'err');
    return;
  }
  const actual = document.getElementById('pwdActual').value;
  const codigo = document.getElementById('pwdCodigo').value.trim();
  const nueva = document.getElementById('pwdNueva').value;
  const repite = document.getElementById('pwdRepite').value;
  if(pwdModo === 'actual' && !actual){ pwdMsg('Escribí tu contraseña actual', 'err'); return; }
  if(pwdModo === 'codigo' && !codigo){ pwdMsg('Escribí el código que te llegó por mail', 'err'); return; }
  const v = pwdValidar(nueva, repite, pwdModo === 'actual' ? actual : null);
  if(v){ pwdMsg(v, 'err'); return; }

  pwdOcupado = true;
  const btn = document.getElementById('pwdGuardar'); btn.disabled = true;
  try {
    const { data: ud } = await sb.auth.getUser();
    const user = ud && ud.user;
    if(!user){ pwdMsg('Tu sesión venció. Volvé a ingresar.', 'err'); return; }
    let upd;
    if(pwdModo === 'actual'){
      const { error: eAuth } = await sb.auth.signInWithPassword({ email: user.email, password: actual });
      if(eAuth){
        pwdFallos++;
        if(pwdFallos >= 5){ pwdFallos = 0; pwdBloqueoHasta = Date.now() + 60000; pwdMsg('Demasiados intentos. Esperá 60 segundos.', 'err'); }
        else pwdMsg('La contraseña actual no es correcta', 'err');
        return;
      }
      upd = await sb.auth.updateUser({ password: nueva });
    } else {
      upd = await sb.auth.updateUser({ password: nueva, nonce: codigo });
    }
    if(upd.error){
      const msg = /nonce|reauth|code|token/i.test(upd.error.message) ? 'El código no es correcto o venció' : 'No se pudo cambiar: ' + upd.error.message;
      pwdMsg(msg, 'err');
      return;
    }
    pwdFallos = 0;
    await sb.auth.signOut({ scope: 'others' });
    cerrarCambioPass();
    toast('Contraseña actualizada. Se cerraron las sesiones en otros dispositivos.', 'ok');
  } finally {
    pwdOcupado = false;
    const b = document.getElementById('pwdGuardar'); if(b) b.disabled = false;
  }
}

initBotonPass();

const RENDERERS = { mp: renderMP, silo: renderSilo, lote: renderLote, bigbag: renderBigbag, cierre: renderCierre, resumen: renderResumen, usuarios: renderUsuarios };

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
