<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Progresso NH - Producción</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171511">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --surface-1:#fcfcfb; --surface-2:#f5f4ee; --card:#ffffff;
    --text-primary:#17150f; --text-secondary:#57523f; --text-muted:#938d79;
    --gridline:#e3e0d3; --border:rgba(23,21,15,.16);
    --accent:#8a6d00; --accent-dark:#5c4400; --accent-rgb:138,109,0;
    --good:#2e7d32; --good-bg:#e6f4e7; --danger:#c0392b; --danger-bg:#fbe9e6; --warn:#b9770e; --warn-bg:#fdf0dc;
    --ink-1:#171511; --ink-2:#000000;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(20,18,10,.06),0 1px 4px rgba(20,18,10,.05);
    --shadow-md:0 10px 28px rgba(20,18,10,.10),0 2px 8px rgba(20,18,10,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface-2);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
  .app-shell{max-width:920px;margin:0 auto;background:var(--surface-1);min-height:100vh;}
  @media(min-width:960px){
    body{padding:28px 16px;}
    .app-shell{border-radius:18px;box-shadow:var(--shadow-md);border:1px solid var(--gridline);overflow:hidden;min-height:0;}
  }
  header.appbar{position:relative;overflow:hidden;padding:20px 20px 22px;color:#fff;background:linear-gradient(135deg,#221d13 0%,#100d08 55%,#000 100%);}
  header.appbar::before{content:'';position:absolute;top:-60px;right:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(242,201,58,.16) 0%,rgba(242,201,58,0) 70%);pointer-events:none;}
  header.appbar::after{content:'';position:absolute;bottom:-70px;left:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(242,201,58,.08) 0%,rgba(242,201,58,0) 70%);pointer-events:none;}
  .appbar-glow{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent) 15%,#f2c93a 50%,var(--accent) 85%,transparent);}
  .appbar-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .appbar-title{display:flex;align-items:center;gap:14px;min-width:0;}
  .appbar-icon{flex-shrink:0;width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:5px;}
  header.appbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1.2;}
  .appbar-tag{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#f2c93a;background:rgba(242,201,58,.12);border:1px solid rgba(242,201,58,.28);border-radius:20px;padding:2px 9px;}
  .usuario-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .usuario-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);}
  .usuario-btn svg{width:13px;height:13px;opacity:.85;}

  main{padding:18px 16px 50px;max-width:920px;margin:0 auto;}
  .hidden{display:none !important;}

  .volver-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--gridline);color:var(--text-secondary);font-size:13px;font-weight:700;padding:9px 15px;border-radius:20px;cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .volver-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .volver-btn svg{width:13px;height:13px;}

  .vista-menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .vista-menu-card{appearance:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--gridline);border-radius:16px;padding:28px 14px;cursor:pointer;text-align:center;transition:box-shadow .2s ease,border-color .2s ease,transform .15s ease;box-shadow:var(--shadow-sm);}
  .vista-menu-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .vista-menu-card:active{transform:translateY(0) scale(.98);}
  .vista-menu-card .vmc-icon{width:52px;height:52px;border-radius:50%;background:rgba(var(--accent-rgb),.12);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
  .vista-menu-card .vmc-icon svg{width:24px;height:24px;}
  .vista-menu-card .vmc-label{font-size:13.5px;font-weight:800;color:var(--text-primary);}

  .card{background:var(--card);border:1px solid var(--gridline);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .card h2{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:2px;}
  .card .desc{color:var(--text-muted);font-size:12.5px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  input,select,textarea{width:100%;background:var(--surface-1);border:1px solid var(--border);color:var(--text-primary);border-radius:9px;padding:10px 11px;font-size:14.5px;margin-bottom:10px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
  textarea{resize:vertical;min-height:44px;}
  .field-computed{opacity:.85;}
  .field-computed input{background:var(--surface-2);color:var(--text-secondary);}
  .row-flex{display:flex;gap:8px;align-items:flex-end;}
  .row-flex > div{flex:1;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);}
  .btn:hover{filter:brightness(.95);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--card);color:var(--text-primary);border:1px solid var(--gridline);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn svg{width:15px;height:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;border-bottom:1px solid var(--gridline);background:var(--surface-2);}
  td{padding:9px;border-bottom:1px solid var(--gridline);white-space:nowrap;color:var(--text-primary);}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--gridline);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}
  .badge.ok{background:var(--good-bg);color:var(--good);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.off{background:var(--surface-2);color:var(--text-muted);}
  .empty{color:var(--text-muted);font-size:13px;padding:14px 4px;text-align:center;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink-1);border:1px solid rgba(255,255,255,.1);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-md);z-index:100;max-width:90vw;}
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--good);}
  .checklist{max-height:260px;overflow-y:auto;border:1px solid var(--gridline);border-radius:10px;}
  .checkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--gridline);font-size:13px;}
  .checkrow:last-child{border-bottom:none;}
  .checkrow input{width:auto;margin:0;}
  .checkrow .meta{color:var(--text-muted);font-size:11.5px;}
  .silo-group{font-size:11.5px;color:var(--accent-dark);font-weight:800;padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:4px;}
  .stat{background:var(--surface-2);border:1px solid var(--gridline);border-radius:10px;padding:12px;}
  .stat .n{font-size:20px;font-weight:800;color:var(--text-primary);}
  .stat .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;}
  .section-title{font-size:12px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;}
  .icon{width:17px;height:17px;vertical-align:-3px;margin-right:4px;}
  .lote-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--gridline);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);}
  .lote-pill.active{border-color:var(--accent);color:var(--accent-dark);background:rgba(var(--accent-rgb),.08);}
  .pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
  .vista-menu-grid{margin-top:4px;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--surface-2);}
  .auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--gridline);border-radius:18px;padding:28px 26px 24px;box-shadow:var(--shadow-md);text-align:center;}
  .auth-logo{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:#171511;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:var(--shadow-sm);}
  .auth-logo svg{width:100%;height:100%;}
  .auth-card h1{margin:0 0 2px;font-size:19px;font-weight:800;}
  .auth-sub{margin:0 0 18px;color:var(--text-muted);font-size:12.5px;}
  .auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:18px;gap:4px;}
  .auth-tab{flex:1;appearance:none;font-family:inherit;background:transparent;border:none;border-radius:9px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;}
  .auth-tab.active{background:var(--card);color:var(--text-primary);box-shadow:var(--shadow-sm);}
  .auth-card form{text-align:left;}
  .btn.auth-submit{width:100%;justify-content:center;margin-top:6px;}
  .auth-msg{min-height:16px;margin:12px 0 0;font-size:12.5px;color:var(--text-muted);}
  .auth-msg.err{color:var(--danger);}
  .auth-msg.ok{color:var(--good);}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Progresso NH S.A."><circle cx="50" cy="50" r="47" fill="#171511"/><ellipse cx="48" cy="47" rx="36" ry="34" fill="#f2c93a" transform="rotate(-25 48 47)"/><ellipse cx="59" cy="57" rx="15" ry="5.5" fill="#6b4a1a" transform="rotate(-25 59 57)"/><line x1="46" y1="42" x2="55" y2="51" stroke="#c98a2c" stroke-width="1.4"/></svg></div>
    <h1>Progresso NH</h1>
    <p class="auth-sub">Ingresá para continuar</p>
    <form id="frmLogin">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="username" placeholder="tu@email.com">
      <label>Contraseña</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      <button class="btn auth-submit" type="submit">Entrar</button>
    </form>
    <p id="authMsg" class="auth-msg"></p>
    <p class="auth-sub" style="margin:14px 0 0;">¿No tenés cuenta? Pedile acceso al administrador.</p>
  </div>
</div>

<div class="app-shell hidden" id="appShell">
  <header class="appbar">
    <div class="appbar-top">
      <div class="appbar-title">
        <span class="appbar-icon"><svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Progresso NH S.A."><circle cx="50" cy="50" r="47" fill="#171511"/><ellipse cx="48" cy="47" rx="36" ry="34" fill="#f2c93a" transform="rotate(-25 48 47)"/><ellipse cx="59" cy="57" rx="15" ry="5.5" fill="#6b4a1a" transform="rotate(-25 59 57)"/><line x1="46" y1="42" x2="55" y2="51" stroke="#c98a2c" stroke-width="1.4"/></svg></span>
        <div>
          <h1>Progresso NH</h1>
          <span class="appbar-tag">Producción</span>
        </div>
      </div>
      <button class="usuario-btn" id="usuarioChip" onclick="cerrarSesion()" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span id="usuarioChipText">Cargando...</span>
      </button>
    </div>
    <div class="appbar-glow"></div>
  </header>

  <main id="mainWrap">
    <button id="volverBtn" class="volver-btn hidden" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      Menú
    </button>

    <div id="homeMenu">
      <div class="vista-menu-grid" id="vistaMenuGrid"></div>
    </div>

    <div id="main"></div>
  </main>
</div>

<script>
const SUPA_URL = 'https://oulrdijjdrfsmbeezolt.supabase.co';
const SUPA_KEY = 'sb_publishable_53SLBlt-7LRqrJZSa1u9tQ_Ky3qg4Qt';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const CATEGORIAS = ['Organico','Organico BNN','Convencional UE','Convencional ROW'];
const PRODUCTOS = ['Chia','Sesamo','Girasol confiteria','Otro'];

const ICONS = {
  mp: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M5 7l1 13h12l1-13M9 11v6M15 11v6M9 7V4h6v3"/></svg>',
  silo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 10c0-4 2.5-7 6-7s6 3 6 7v9a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-9z"/><path d="M6 14h12"/></svg>',
  lote: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  bigbag: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8l2-5h8l2 5"/><path d="M4 8h16l-1.5 12a2 2 0 0 1-2 2H7.5a2 2 0 0 1-2-2L4 8z"/></svg>',
  cierre: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
  resumen: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
  usuarios: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};

let usuario = null;
let currentUser = null;
let miRol = null;

function showAuthScreen(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appShell').classList.add('hidden');
  usuario = null;
  currentUser = null;
  miRol = null;
}

async function onLogin(session){
  currentUser = session.user;
  let nombre = null;
  let perfil = null;
  try{
    const { data } = await sb.from('perfiles').select('*').eq('id', session.user.id).single();
    perfil = data;
    nombre = perfil ? perfil.nombre : null;
  }catch(e){}
  if(perfil && perfil.activo === false){
    document.getElementById('authMsg').textContent = 'Tu cuenta está desactivada. Contactá al administrador.';
    document.getElementById('authMsg').className = 'auth-msg err';
    sb.auth.signOut();
    return;
  }
  miRol = perfil ? perfil.rol : 'operario';
  usuario = nombre || (session.user.email ? session.user.email.split('@')[0] : 'Usuario');
  document.getElementById('usuarioChipText').textContent = usuario;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  renderHomeMenu();
}

function cerrarSesion(){
  if(!confirm('¿Cerrar sesión?')) return;
  sb.auth.signOut();
}

document.getElementById('frmLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email').trim();
  const password = fd.get('password');
  const msg = document.getElementById('authMsg');
  msg.textContent = 'Entrando...'; msg.className = 'auth-msg';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos' : error.message;
    msg.className = 'auth-msg err';
  }
});

sb.auth.onAuthStateChange((event, session) => {
  if(session){ onLogin(session); } else { showAuthScreen(); }
});

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function fmtKg(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + ' kg'; }
function fmtPct(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('es-PY',{maximumFractionDigits:2}) + '%'; }
function fmtDate(d){ if(!d) return '-'; return new Date(d).toLocaleDateString('es-PY'); }
function opt(list, sel){ return list.map(v => `<option value="${v}" ${v===sel?'selected':''}>${v}</option>`).join(''); }

const TABS = [
  {id:'mp', label:'Recepción MP', icon:ICONS.mp},
  {id:'silo', label:'Silos Bolsa', icon:ICONS.silo},
  {id:'lote', label:'Lotes', icon:ICONS.lote},
  {id:'bigbag', label:'Carga', icon:ICONS.bigbag},
  {id:'cierre', label:'Cierre', icon:ICONS.cierre},
  {id:'resumen', label:'Resumen', icon:ICONS.resumen},
];
const TAB_ADMIN = {id:'usuarios', label:'Usuarios', icon:ICONS.usuarios};

let activeTab = null;

function renderHomeMenu(){
  const tabs = miRol === 'admin' ? [...TABS, TAB_ADMIN] : TABS;
  document.getElementById('vistaMenuGrid').innerHTML = tabs.map(t =>
    `<button type="button" class="vista-menu-card" onclick="goTab('${t.id}')">
      <span class="vmc-icon">${t.icon}</span>
      <span class="vmc-label">${t.label}</span>
    </button>`
  ).join('');
}

function goHome(){
  activeTab = null;
  document.getElementById('homeMenu').classList.remove('hidden');
  document.getElementById('volverBtn').classList.add('hidden');
  document.getElementById('main').innerHTML = '';
}

function goTab(id){
  activeTab = id;
  document.getElementById('homeMenu').classList.add('hidden');
  document.getElementById('volverBtn').classList.remove('hidden');
  RENDERERS[id]();
}

// ============================================================
// RECEPCION MP
// ============================================================
async function renderMP(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.mp} Nueva recepción de materia prima</h2>
    <div class="desc">Datos de la boleta. Peso neto, % descuento total y kg líquido se calculan solos.</div>
    <form id="frmMP">
      <div class="section-title">Datos generales de la carga</div>
      <div class="grid">
        <div><label>Nº Boleta *</label><input name="nro_boleta" required></div>
        <div><label>Fecha *</label><input name="fecha" type="date" required></div>
        <div><label>Chapa camión</label><input name="chapa_camion"></div>
        <div><label>Chofer</label><input name="chofer"></div>
        <div><label>Procedencia</label><input name="procedencia"></div>
        <div><label>Tipo de cosecha</label><select name="tipo_cosecha"><option value="">-</option><option>Corte hilerado</option><option>Desecado</option></select></div>
        <div><label>Peso Bruto (kg) *</label><input name="peso_bruto_kg" type="number" step="0.01" required oninput="calcMP()"></div>
        <div><label>Peso Tara (kg) *</label><input name="peso_tara_kg" type="number" step="0.01" required oninput="calcMP()"></div>

function calcMP(){
  const f = document.getElementById('frmMP');
  const bruto = parseFloat(f.peso_bruto_kg.value) || 0;
  const tara = parseFloat(f.peso_tara_kg.value) || 0;
  const neto = bruto - tara;
  const dCal = parseFloat(f.pct_descuento_calidad.value) || 0;
  const dHum = parseFloat(f.pct_descuento_humedad.value) || 0;
  const totalDesc = dCal + dHum;
  const kgDesc = neto * totalDesc / 100;
  const kgLiquido = neto - kgDesc;
  document.getElementById('mpPesoNeto').value = neto.toFixed(2) + ' kg';
  document.getElementById('mpTotalDesc').value = totalDesc.toFixed(2) + ' %';
  document.getElementById('mpKgDesc').value = kgDesc.toFixed(2) + ' kg';
  document.getElementById('mpKgLiquido').value = kgLiquido.toFixed(2) + ' kg';
}

  e.preventDefault();

  ['peso_bruto_kg','peso_tara_kg','pct_humedad','temperatura_c','pct_impureza_gruesa','pct_impureza_fina','pct_descuento_calidad','pct_descuento_humedad','pct_parcela'].forEach(k=>{

  if(error){ toast('Error: ' + error.message, 'err'); return; }

}

  const payload = {
    lote_id: loteActivoId,
    kg_ingresado_mp: sumRow ? sumRow.kg_mp_asignado : 0,
    kg_procesado_total: kgProc,
    mermas_totales_kg: parseFloat(document.getElementById('cfMermas').value) || null,
    analisis_mp_resumen: document.getElementById('cfAnalisisMp').value || null,
    analisis_pt_resumen: document.getElementById('cfAnalisisPt').value || null,
    diferencia_analisis: document.getElementById('cfDif').value || null,
    cerrado_por: usuario || null
  };
  const { error } = await sb.from('lote_cierre').insert(payload);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Lote ' + loteActivoId + ' cerrado', 'ok');
  renderCierre();
}

// ============================================================
// RESUMEN
// ============================================================
async function renderResumen(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card"><h2>${ICONS.resumen} Resumen de producción</h2>
  <div class="desc">Vista simple por ahora - se va a ampliar cuando conectemos con COMEX.</div>
  <div id="resumenBody"><div class="empty">Cargando...</div></div></div>`;

  const { data, error } = await sb.from('v_resumen_lotes').select('*').order('fecha_creacion',{ascending:false});
  const el = document.getElementById('resumenBody');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">Todavía no hay lotes.</div>'; return; }

  const totalMp = data.reduce((a,r)=>a+(Number(r.kg_mp_asignado)||0),0);
  const totalProc = data.reduce((a,r)=>a+(Number(r.kg_procesado_total)||0),0);
  const cerrados = data.filter(r=>r.estado==='CERRADO').length;

  el.innerHTML = `<div class="stat-grid">
    <div class="stat"><div class="n">${data.length}</div><div class="l">Lotes</div></div>
    <div class="stat"><div class="n">${cerrados}</div><div class="l">Cerrados</div></div>
    <div class="stat"><div class="n">${fmtKg(totalMp)}</div><div class="l">MP asignada</div></div>
    <div class="stat"><div class="n">${fmtKg(totalProc)}</div><div class="l">Procesado</div></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Lote</th><th>Producto</th><th>Estado</th><th>Cargas MP</th><th>Kg MP</th><th>Bigbags</th><th>Rendimiento</th></tr></thead><tbody>
    ${data.map(r => `<tr><td>${r.lote_id}</td><td>${r.producto}</td><td><span class="badge ${r.estado==='EN_PROCESO'?'warn':'ok'}">${r.estado}</span></td><td>${r.cantidad_cargas_mp}</td><td>${fmtKg(r.kg_mp_asignado)}</td><td>${r.cantidad_bigbags}</td><td>${fmtPct(r.rendimiento_pct)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

// ============================================================
// USUARIOS (solo admin)
// ============================================================
async function renderUsuarios(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="card">
    <h2>${ICONS.usuarios} Gestión de usuarios</h2>
    <div class="desc">Para crear una cuenta nueva: Supabase → Authentication → Users → Add user (email + contraseña). Acá asignás el rol y activás/desactivás el acceso.</div>
    <div id="usuariosList" class="table-wrap"><div class="empty">Cargando...</div></div>
  </div>`;
  loadUsuarios();
}

async function loadUsuarios(){
  const { data, error } = await sb.from('perfiles').select('*').order('creado_en');
  const el = document.getElementById('usuariosList');
  if(error){ el.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = '<div class="empty">No hay usuarios todavía.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr>
      <td>${u.nombre||'-'}</td>
      <td>${u.email||'-'}</td>
      <td><select id="rol-${u.id}" style="width:auto;margin:0;"><option value="operario" ${u.rol==='operario'?'selected':''}>Operario</option><option value="admin" ${u.rol==='admin'?'selected':''}>Admin</option></select></td>
      <td><input type="checkbox" id="activo-${u.id}" style="width:auto;margin:0;" ${u.activo?'checked':''}></td>
      <td><button class="btn small" onclick="guardarUsuario('${u.id}')">Guardar</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function guardarUsuario(id){
  const rol = document.getElementById('rol-'+id).value;
  const activo = document.getElementById('activo-'+id).checked;
  const { error } = await sb.from('perfiles').update({ rol, activo }).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  toast('Usuario actualizado', 'ok');
  if(currentUser && id === currentUser.id){ miRol = rol; }
  loadUsuarios();
}

const RENDERERS = { mp: renderMP, silo: renderSilo, lote: renderLote, bigbag: renderBigbag, cierre: renderCierre, resumen: renderResumen, usuarios: renderUsuarios };

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
