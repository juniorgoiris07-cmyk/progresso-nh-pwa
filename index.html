<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Progresso NH - Producción</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fcfcfb">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="supabase-2.117.2.js"></script>
<!-- ==============================================================================
     ==  ESTILOS (CSS)
     ==  Todo el diseño de la app está en este bloque.
     ============================================================================== -->
<style>

  /* ==============================================================================
     ==  VARIABLES DE COLOR Y MEDIDAS
     ============================================================================== */
  :root{
    --surface-1:#fcfcfb; --surface-2:#f5f4ee; --card:#ffffff;
    --text-primary:#17150f; --text-secondary:#57523f; --text-muted:#938d79;
    --gridline:#e3e0d3; --border:rgba(23,21,15,.16);
    --accent:#8a6d00; --accent-dark:#5c4400; --accent-rgb:138,109,0;
    --good:#2e7d32; --good-bg:#e6f4e7; --danger:#c0392b; --danger-bg:#fbe9e6; --warn:#b9770e; --warn-bg:#fdf0dc;
    --ink-1:#171511; --ink-2:#000000;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(20,18,10,.06),0 1px 4px rgba(20,18,10,.05);
    --shadow-md:0 10px 28px rgba(20,18,10,.10),0 2px 8px rgba(20,18,10,.06);
  }

  /* ==============================================================================
     ==  BASE
     ==  Reset, tipografía y contenedor general.
     ============================================================================== */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface-2);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
  .app-shell{max-width:920px;margin:0 auto;background:var(--surface-1);min-height:100vh;}
  @media(min-width:960px){
    body{padding:28px 16px;}
    .app-shell{border-radius:18px;box-shadow:var(--shadow-md);border:1px solid var(--gridline);overflow:hidden;min-height:0;}
  }

  /* ==============================================================================
     ==  BARRA SUPERIOR
     ==  Encabezado, botón de usuario y estilos base de la barra.
     ============================================================================== */
  header.appbar{position:relative;overflow:hidden;padding:20px 20px 22px;color:#fff;background:#1a160e;}
  header.appbar::before{content:'';position:absolute;top:-60px;right:-50px;width:220px;height:220px;background:none;pointer-events:none;}
  header.appbar::after{content:'';position:absolute;bottom:-70px;left:-30px;width:180px;height:180px;background:none;pointer-events:none;}
  .appbar-glow{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);}
  .appbar-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .appbar-title{display:flex;align-items:center;gap:14px;min-width:0;}
  .appbar-icon{flex-shrink:0;width:54px;height:54px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:2px;}
  header.appbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1.2;}
  .appbar-tag{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#f2c93a;background:rgba(242,201,58,.12);border:1px solid rgba(242,201,58,.28);border-radius:20px;padding:2px 9px;}
  .usuario-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .usuario-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);}
  .usuario-btn svg{width:13px;height:13px;opacity:.85;}

  main{padding:18px 16px 50px;max-width:920px;margin:0 auto;}
  .hidden{display:none !important;}

  /* ==============================================================================
     ==  SELECTOR DE PRODUCTO
     ==  Pastilla de la barra superior y pantallas de login/elección de producto.
     ============================================================================== */
  .prod-chip{appearance:none;display:inline-flex;align-items:center;gap:9px;height:38px;background:#fff;border:1px solid var(--gridline);border-radius:19px;padding:0 10px 0 6px;font:inherit;font-size:13.5px;font-weight:700;color:var(--text-primary);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .15s ease,background .15s ease;}
  .prod-chip i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:13px;font-weight:800;line-height:1;transition:background .15s ease;}
  .prod-chip svg{width:14px;height:14px;color:var(--text-muted);flex:none;transition:color .15s ease;}
  .prod-chip:hover,.prod-chip:focus-visible{border-color:var(--accent);outline:none;}
  .prod-chip:hover i{background:var(--accent-dark);}
  .prod-chip:hover svg{color:var(--accent-dark);}
  .prod-chip:active{background:var(--surface-2);}
  .prod-chip.flip i{animation:tileFlip .42s cubic-bezier(.4,0,.2,1) both;}
  .prod-chip.pop i{animation:tilePop .5s cubic-bezier(.2,.9,.3,1.4) both;}
  @keyframes tileFlip{0%{transform:perspective(260px) rotateY(0);}100%{transform:perspective(260px) rotateY(360deg);}}
  @keyframes tilePop{0%{transform:scale(.55);}100%{transform:scale(1);}}
  .prod-bar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);pointer-events:none;z-index:2;}
  /* ---- cambio de producto: sale el contenido, entra el nuevo ---- */
  #main,#homeMenu{transition:opacity .22s ease,transform .22s ease;}
  #appShell.cambiando #main,#appShell.cambiando #homeMenu{opacity:0;transform:translateY(12px);}
  #appShell.cambiando .prod-bar{width:100%;transition:width .5s cubic-bezier(.3,.7,.2,1);}
  #appShell.entra-cambio #main,#appShell.entra-cambio #homeMenu{animation:cambioIn .5s cubic-bezier(.2,.7,.2,1) both;}
  #appShell.entra-cambio #homeMenu .vista-menu-card{animation:cambioIn .5s cubic-bezier(.2,.7,.2,1) both;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(2){animation-delay:.03s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(3){animation-delay:.06s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(4){animation-delay:.09s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(5){animation-delay:.12s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(6){animation-delay:.15s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(7){animation-delay:.18s;}
  #appShell.entra-cambio #homeMenu .vista-menu-card:nth-child(8){animation-delay:.21s;}
  @keyframes cambioIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  /* ---- pantalla de elección: la opción elegida se marca y las otras se apagan ---- */
  .prod-opt{transition:opacity .2s ease,transform .2s ease,border-color .15s ease,background .15s ease;}
  .prod-opt.act{border-color:var(--accent);background:#fbf8ee;}
  #prodScreen.saliendo .prod-opt.off{opacity:.35;transform:scale(.97);}
  #prodScreen.saliendo .prod-opt.sel{border-color:var(--accent);transform:scale(1.02);}
  #prodScreen.saliendo .prod-opt.sel .prod-ic{background:var(--accent-dark);}
  #prodScreen{transition:opacity .22s ease;}
  #prodScreen.saliendo{opacity:0;}
  #authScreen,#prodScreen{position:relative;background:#2d3b2a url("fondo.jpg?v=52") center/cover no-repeat;}
  #authScreen::before,#prodScreen::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(23,21,15,.14);pointer-events:none;}
  #authScreen .auth-card{position:relative;z-index:1;border:none;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.30);}
  #authScreen:not(.hidden) .auth-card{animation:prodIn .38s cubic-bezier(.2,.7,.2,1) both;}
  #prodScreen .auth-card{max-width:430px;padding:34px 28px 14px;position:relative;z-index:1;border:none;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.30);}
  #prodScreen .auth-logo-img{margin-bottom:20px;}
  #prodScreen h1{font-size:23px;font-weight:800;letter-spacing:-.01em;}
  .prod-hello{margin:4px 0 22px;font-size:13.5px;color:var(--text-muted);}
  .prod-list{display:grid;gap:12px;margin:0 0 14px;text-align:left;}
  .prod-opt{appearance:none;width:100%;display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--gridline);border-radius:16px;padding:16px 18px 16px 16px;font:inherit;color:var(--text-primary);cursor:pointer;text-align:left;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;}
  .prod-opt:hover,.prod-opt:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 24px rgba(23,21,15,.10);outline:none;}
  .prod-opt:active{transform:scale(.985);}
  .prod-ic{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:800;color:#fff;background:var(--accent);transition:background .2s ease;}
  .prod-opt:hover .prod-ic,.prod-opt:focus-visible .prod-ic{background:var(--accent-dark);}
  .prod-txt{flex:1;min-width:0;}
  .prod-txt b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15;}
  .prod-txt small{display:block;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .prod-opt>svg{width:20px;height:20px;flex:none;opacity:.4;transition:transform .2s ease,opacity .2s ease;}
  .prod-opt:hover>svg{transform:translateX(3px);opacity:.9;}
  .prod-salir{appearance:none;background:none;border:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;padding:8px 10px;margin-bottom:8px;transition:color .18s ease;}
  .prod-salir:hover{color:var(--text-primary);}
  @keyframes prodIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  #prodScreen:not(.hidden) .auth-card{animation:prodIn .38s cubic-bezier(.2,.7,.2,1) both;}
  #prodScreen:not(.hidden) .prod-opt{animation:prodIn .42s cubic-bezier(.2,.7,.2,1) both;}
  #prodScreen:not(.hidden) .prod-opt:nth-child(1){animation-delay:.08s;}
  #prodScreen:not(.hidden) .prod-opt:nth-child(2){animation-delay:.15s;}
  #appShell.entra{animation:prodFade .35s ease both;}
  @keyframes prodFade{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){#prodScreen *,#appShell.entra,#appShell.entra-cambio *,.prod-chip,.prod-chip i,.prod-chip svg,#main,#homeMenu{animation:none !important;transition:none !important;}}


  /* ==============================================================================
     ==  BOTÓN VOLVER Y TARJETAS DE MENÚ
     ============================================================================== */
  .volver-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--gridline);color:var(--text-secondary);font-size:13px;font-weight:700;padding:9px 15px;border-radius:20px;cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .volver-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .volver-btn svg{width:13px;height:13px;}

  .vista-menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .vista-menu-card{appearance:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--gridline);border-radius:16px;padding:28px 14px;cursor:pointer;text-align:center;transition:box-shadow .2s ease,border-color .2s ease,transform .15s ease;box-shadow:var(--shadow-sm);}
  .vista-menu-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .vista-menu-card:active{transform:translateY(0) scale(.98);}
  .vista-menu-card .vmc-icon{width:52px;height:52px;border-radius:50%;background:rgba(var(--accent-rgb),.12);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
  .vista-menu-card .vmc-icon svg{width:24px;height:24px;}
  .vista-menu-card .vmc-label{font-size:13.5px;font-weight:800;color:var(--text-primary);}


  /* ==============================================================================
     ==  TARJETAS, FORMULARIOS Y BOTONES
     ============================================================================== */
  .card{background:var(--card);border:1px solid var(--gridline);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .card h2{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:2px;}
  .card .desc{color:var(--text-muted);font-size:12.5px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  input,select,textarea{width:100%;background:var(--surface-1);border:1px solid var(--border);color:var(--text-primary);border-radius:9px;padding:10px 11px;font-size:14.5px;margin-bottom:10px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
  textarea{resize:vertical;min-height:44px;}
  .field-computed{opacity:.85;}
  .field-computed input{background:var(--surface-2);color:var(--text-secondary);}
  .row-flex{display:flex;gap:8px;align-items:flex-end;}
  .row-flex > div{flex:1;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);}
  .btn:hover{filter:brightness(.95);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--card);color:var(--text-primary);border:1px solid var(--gridline);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn svg{width:15px;height:15px;}
          .btn.danger-ghost{background:transparent;color:var(--danger);border:1px solid var(--danger-bg);width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;margin-bottom:10px;flex:0 0 40px;}
    .parcela-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
    .parcela-row > div{flex:1;}
    .parcela-row .pr-pct{max-width:130px;flex:0 0 130px;}

  /* ==============================================================================
     ==  TABLAS Y ETIQUETAS
     ============================================================================== */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;border-bottom:1px solid var(--gridline);background:var(--surface-2);}
  td{padding:9px;border-bottom:1px solid var(--gridline);white-space:nowrap;color:var(--text-primary);}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--gridline);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}
  .badge.ok{background:var(--good-bg);color:var(--good);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.off{background:var(--surface-2);color:var(--text-muted);}
  .empty{color:var(--text-muted);font-size:13px;padding:14px 4px;text-align:center;}
  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;max-width:90vw;pointer-events:none;}

  /* ==============================================================================
     ==  AVISOS (TOAST)
     ============================================================================== */
  .toast{background:var(--ink-1);border:1px solid rgba(255,255,255,.1);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-md);max-width:90vw;}
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--good);}
  .checklist{max-height:260px;overflow-y:auto;border:1px solid var(--gridline);border-radius:10px;}
  .checkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--gridline);font-size:13px;}
  .checkrow:last-child{border-bottom:none;}
  .checkrow input{width:auto;margin:0;}
  .checkrow .meta{color:var(--text-muted);font-size:11.5px;}
  .silo-group{font-size:11.5px;color:var(--accent-dark);font-weight:800;padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:4px;}
  .stat{background:var(--surface-2);border:1px solid var(--gridline);border-radius:10px;padding:12px;}
  .stat .n{font-size:20px;font-weight:800;color:var(--text-primary);}
  .stat .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;}
  .section-title{font-size:12px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;}
  .icon{width:17px;height:17px;vertical-align:-3px;margin-right:4px;}

  /* ==============================================================================
     ==  LOTES Y SELECCIÓN DE CARGAS
     ============================================================================== */
  .lote-pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--gridline);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);}
  .lote-pill.active{border-color:var(--accent);color:var(--accent-dark);background:rgba(var(--accent-rgb),.08);}
  .lote-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px;}
  .lote-sel-q{flex:1 1 220px;min-width:0;}
  .lote-sel-s{flex:2 1 280px;min-width:0;font-weight:700;}
  .lote-sel-cnt{flex:1 1 100%;font-size:12px;color:var(--text-muted);}
  .lt-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;}
  .lt-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--gridline);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left;box-shadow:var(--shadow-sm);position:relative;}
  .lt-chip b{font-size:13px;color:var(--text-primary);}
  .lt-chip span{font-size:11px;color:var(--text-muted);}
  .lt-chip i{position:absolute;top:-7px;right:-4px;background:var(--accent);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px;}
  .lt-chip.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.09);}
  .lt-chip.on b{color:var(--accent-dark);}
  .lt-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
  .lt-filtros input[type=search]{flex:2 1 240px;min-width:0;}
  .lt-filtros select{flex:1 1 180px;min-width:0;}
  .lt-solo{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text-secondary);margin:0;white-space:nowrap;}
  .lt-solo input{width:auto;margin:0;}
  .lt-scroll{max-height:440px;overflow:auto;border:1px solid var(--gridline);border-radius:10px;background:var(--card);}
  .lt-scroll thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);}
  .lt-tabla tbody tr{cursor:pointer;}
  .lt-tabla tbody tr:hover td{background:rgba(var(--accent-rgb),.05);}
  .lt-tabla tbody tr.lt-sel td{background:rgba(var(--accent-rgb),.13);}
  .lt-tabla td.num,.lt-tabla th.num{text-align:right;white-space:nowrap;}
  .lt-tabla td input,.lt-tabla th input{width:auto;margin:0;}
  .lt-tabla th,.lt-tabla td{padding:8px 7px;}
  .lt-kg{width:96px !important;text-align:right;padding:6px 8px !important;font-weight:700;}
  .lt-parcial{font-size:11px;color:var(--text-muted);display:block;font-weight:400;}
  .lt-barra{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow-md);}
  .lt-res{font-size:13.5px;flex:1 1 260px;}
  .lt-muted{color:var(--text-muted);font-size:12px;}
  .lt-acc{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
  .vista-menu-grid{margin-top:4px;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--surface-2);}
  .auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--gridline);border-radius:18px;padding:28px 26px 24px;box-shadow:var(--shadow-md);text-align:center;}

  /* ==============================================================================
     ==  LOGIN Y CAMBIO DE CONTRASEÑA
     ============================================================================== */
  .auth-logo{width:132px;height:132px;margin:0 auto 12px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;border:1px solid var(--gridline);box-shadow:var(--shadow-sm);overflow:hidden;}
  .auth-logo svg{width:100%;height:100%;}
  .auth-card h1{margin:0 0 2px;font-size:19px;font-weight:800;}
  .auth-sub{margin:0 0 18px;color:var(--text-muted);font-size:12.5px;}
  .auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:18px;gap:4px;}
  .auth-tab{flex:1;appearance:none;font-family:inherit;background:transparent;border:none;border-radius:9px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;}
  .auth-tab.active{background:var(--card);color:var(--text-primary);box-shadow:var(--shadow-sm);}
  .auth-card form{text-align:left;}
  .btn.auth-submit{width:100%;justify-content:center;margin-top:6px;}
  .auth-msg{min-height:16px;margin:12px 0 0;font-size:12.5px;color:var(--text-muted);}
  .auth-msg.err{color:var(--danger);}
  .auth-msg.ok{color:var(--good);}
  .preview-banner{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid #f0d9ae;padding:9px 16px;font-size:12.5px;font-weight:700;text-align:center;}
  .grid.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .calc-table td,.calc-table th{padding:7px 9px;}
  .calc-table td.num,.calc-table th.num,#mpList td.num,#mpList th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .calc-table tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--gridline);}
  .pct-check{font-size:12.5px;font-weight:800;margin:6px 0 10px;}
  .pct-check.ok{color:var(--good);} .pct-check.bad{color:var(--danger);}
  .note{font-size:12px;color:var(--text-muted);margin:-4px 0 10px;}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .tools > div{flex:1;min-width:130px;} .tools input,.tools select{margin-bottom:0;}
  #mpList tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--gridline);}
  #mpList td.sep,#mpList th.sep{border-left:2px solid var(--gridline);}

  /* ==============================================================================
     ==  RECEPCIÓN: TARJETAS DE SILO Y PLANILLA
     ============================================================================== */
  .silo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .silo-card{background:var(--surface-2);border:1px solid var(--gridline);border-radius:12px;padding:12px 14px;}
  .silo-card .t{font-size:12px;font-weight:800;color:var(--accent-dark);text-transform:uppercase;}
  .silo-card .n{font-size:20px;font-weight:800;margin-top:2px;} .silo-card .s{font-size:11.5px;color:var(--text-muted);}
  #mpList th:first-child,#mpList td:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--gridline);}
  #mpList th:first-child{background:var(--surface-2);}
  #mpList tfoot td:first-child{background:var(--surface-2);}
  .edit-btn{appearance:none;border:1px solid var(--gridline);background:var(--card);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--accent-dark);}
  .edit-btn:hover{border-color:var(--accent);}
  #mpList td.hum{color:var(--warn);font-weight:700;}
  .appbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .usuario-btn.pwd-btn{padding:8px 10px;}
  .usuario-btn.pwd-btn svg{width:15px;height:15px;opacity:1;}
  .pwd-overlay{position:fixed;inset:0;background:rgba(10,8,4,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200;}
  .pwd-box{width:100%;max-width:400px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--gridline);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow-md);}
  .pwd-box h3{margin:0 0 2px;font-size:17px;font-weight:800;}
  .pwd-box .desc{margin-bottom:14px;word-break:break-all;}
  .pwd-link{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent-dark);margin:-4px 0 12px;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit;}
  .pwd-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .pwd-row{display:flex;gap:8px;align-items:flex-start;}
  .pwd-row > input{flex:1;}

  /* ==============================================================================
     ==  APP NATIVA (MÓVIL)
     ==  Sensación de app: barra inferior, hoja de menú, toques.
     ============================================================================== */
  :root{--nav-h:62px;}
  html,body{overscroll-behavior-y:none;}
  button,.vista-menu-card,.navb,.sheet-item,.lote-pill,.lt-chip,.edit-btn,.volver-btn,.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  header.appbar{padding-top:calc(20px + env(safe-area-inset-top));}
  main{padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));}
  #toasts{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));}
  .lt-barra{bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom));}
  .btn:active,.vista-menu-card:active,.edit-btn:active,.volver-btn:active,.lote-pill:active,.lt-chip:active{transform:scale(.97);transition:transform .08s;}
  @media (hover:none){.vista-menu-card:hover{transform:none;box-shadow:var(--shadow-sm);border-color:var(--gridline);}}

  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateZ(0);will-change:transform;contain:layout paint;}
  .navbar-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--gridline);padding:0 4px calc(0px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(20,18,10,.07);}
  .navb{appearance:none;background:none;border:none;position:relative;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--text-muted);cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;}
  .navb .icon{width:23px;height:23px;transition:transform .12s;}
  .navb:active .icon{transform:scale(.86);}
  .navb:active{background:rgba(var(--accent-rgb),.08);}
  .navb.on{color:var(--accent-dark);}
  .navb.on .icon{transform:translateY(-1px);}
  .navb.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent);}
  body.kb .navbar{display:none;}
  body.kb #toasts{bottom:18px;}

  .sheet-bg{position:fixed;inset:0;background:rgba(10,8,4,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-bg.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);pointer-events:none;will-change:transform;visibility:hidden;}
  .sheet.on{transform:none;pointer-events:auto;visibility:visible;}
  .sheet-in{max-width:920px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(20,18,10,.18);}
  .sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--gridline);margin:4px auto 10px;}
  .sheet-item{appearance:none;width:100%;display:flex;align-items:center;gap:14px;background:none;border:none;font-family:inherit;font-size:15.5px;font-weight:700;color:var(--text-primary);padding:13px 10px;border-radius:12px;cursor:pointer;text-align:left;}
  .sheet-item:active{background:rgba(var(--accent-rgb),.1);}
  .sheet-ic{width:42px;height:42px;border-radius:50%;background:rgba(var(--accent-rgb),.12);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex:none;}
  .sheet-ic .icon{width:20px;height:20px;}

  @keyframes viewInR{from{opacity:0;transform:translate3d(16px,0,0);}to{opacity:1;transform:none;}}
  @keyframes viewInL{from{opacity:0;transform:translate3d(-16px,0,0);}to{opacity:1;transform:none;}}
  @keyframes viewInU{from{opacity:0;transform:translate3d(0,8px,0);}to{opacity:1;transform:none;}}
  .anim-r,.anim-l,.anim-u{will-change:transform,opacity;}
  .anim-r{animation:viewInR .17s ease-out;}
  .anim-l{animation:viewInL .17s ease-out;}
  .anim-u{animation:viewInU .17s ease-out;}
  @media (prefers-reduced-motion:reduce){.anim-r,.anim-l,.anim-u{animation:none;}.sheet,.sheet-bg{transition:none;}}
  .sheet-bg{will-change:opacity;}

  /* ==============================================================================
     ==  ESCRITORIO
     ==  Barra lateral en pantallas anchas.
     ============================================================================== */
  .sidebar{display:none;}
  @media(min-width:960px){
    body{padding:0;background:var(--surface-1);}
    .app-shell{max-width:none;width:100%;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto 1fr;overflow:visible;min-height:100vh;border:none;border-radius:0;box-shadow:none;}
    header.appbar{grid-column:1 / -1;border-radius:0;padding-left:28px;padding-right:28px;}
    .sidebar{display:block;background:var(--surface-2);border-right:1px solid var(--gridline);}
    .sidebar-in{position:sticky;top:0;padding:18px 12px 20px;display:flex;flex-direction:column;gap:3px;max-height:100vh;overflow:auto;}
    .sb-title{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);padding:2px 14px 8px;}
    .sb-sep{height:1px;background:var(--gridline);margin:8px 10px;}
    .sb-item{appearance:none;border:none;background:none;font-family:inherit;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:11px;font-size:14px;font-weight:700;color:var(--text-secondary);cursor:pointer;position:relative;transition:background .12s,color .12s;}
    .sb-item .icon{width:19px;height:19px;flex:none;}
    .sb-item:hover{background:rgba(var(--accent-rgb),.09);color:var(--accent-dark);}
    .sb-item:active{background:rgba(var(--accent-rgb),.16);}
    .sb-item.on{background:rgba(var(--accent-rgb),.15);color:var(--accent-dark);}
    .sb-item.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
    .sb-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
    main{max-width:none;margin:0;padding:26px 32px 44px;min-width:0;}
    .navbar,.sheet,.sheet-bg{display:none !important;}
    #toasts{bottom:24px;}
    .lt-barra{bottom:12px;}
    .card{padding:22px;}
    .vista-menu-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
    .vista-menu-card{padding:34px 16px;}
    .lt-scroll{max-height:calc(100vh - 300px);min-height:320px;}
  }

  /* ==============================================================================
     ==  BARRA SUPERIOR MINIMALISTA
     ============================================================================== */
  :root{--hdr-h:54px;}
  header.appbar{position:sticky;top:0;z-index:55;overflow:visible;height:calc(var(--hdr-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;background:var(--surface-1);color:var(--text-primary);border-bottom:1px solid var(--gridline);transition:box-shadow .2s;}
  header.appbar.scrolled{box-shadow:0 6px 18px rgba(20,18,10,.07);}
  header.appbar::before,header.appbar::after,.appbar-glow,.appbar-icon{display:none;}
  .appbar-top{height:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .appbar-title{gap:10px;}
  .brandmark{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:#e6bd2c;color:#1a1405;font-weight:900;font-size:13px;letter-spacing:-.02em;box-shadow:0 1px 3px rgba(120,90,0,.35);}
  header.appbar h1{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--text-primary);margin:0;line-height:1.15;}
  .appbar-tag{display:block;margin:1px 0 0;padding:0;background:none;border:none;border-radius:0;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
  header.appbar.is-tab .appbar-tag{display:none;}
  #usuarioChip,.appbar-actions{display:none !important;}
  .usermenu{position:relative;flex:none;}
  .avatar-btn{appearance:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--gridline);background:rgba(var(--accent-rgb),.10);color:var(--accent-dark);font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .15s,border-color .15s;}
  .avatar-btn:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.16);}
  .avatar-btn:active{transform:scale(.94);}
  .userpop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--card);border:1px solid var(--gridline);border-radius:14px;box-shadow:var(--shadow-md);padding:6px;z-index:90;transform-origin:top right;animation:popIn .14s ease-out;}
  @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-4px);}to{opacity:1;transform:none;}}
  .up-head{padding:10px 12px 9px;border-bottom:1px solid var(--gridline);margin-bottom:4px;}
  .up-name{font-weight:800;font-size:14px;text-transform:capitalize;}
  .up-rol{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .up-item{appearance:none;width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--text-primary);padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left;}
  .up-item:hover,.up-item:active{background:rgba(var(--accent-rgb),.10);}
  .up-item.danger{color:var(--danger);}
  .up-item.danger:hover,.up-item.danger:active{background:var(--danger-bg);}
  .up-item svg{width:17px;height:17px;flex:none;}
  .sb-brand{display:none;}
  @media(min-width:960px){
    :root{--hdr-h:64px;}
    header.appbar{grid-column:2;grid-row:1;padding-left:32px;padding-right:32px;}
    .sidebar{grid-column:1;grid-row:1 / span 2;}
    main{grid-column:2;grid-row:2;}
    header.appbar .brandmark{display:none;}
    header.appbar h1{font-size:20px;}
    .sidebar-in{top:0;max-height:100vh;padding-top:18px;}
    .sb-brand{display:flex;align-items:center;gap:11px;height:var(--hdr-h);margin:-18px -12px 12px;padding:0 26px;border-bottom:1px solid var(--gridline);}
    .sb-bn{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
    .sb-bt{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-top:1px;}
  }

  /* ==============================================================================
     ==  LOGO REAL
     ============================================================================== */
  img.brandmark{width:36px;height:auto;border-radius:0;background:none;box-shadow:none;object-fit:contain;display:block;}

  /* ==============================================================================
     ==  ESTILO ERP
     ==  Barra blanca, buscador y menú lateral colapsable.
     ============================================================================== */
  header.appbar{background:#fff;}
  .avatar-btn{width:38px;height:38px;border:none;background:#6b4f00;color:#fff;font-size:13px;letter-spacing:.02em;box-shadow:0 1px 4px rgba(60,45,0,.35);}
  .avatar-btn:hover{background:#7a5a00;border:none;}
  .gsearch{display:none;}
  .sb-toggle{display:none;}
  @media(min-width:960px){
    body{background:var(--surface-2);}
    .app-shell{--sbw:76px;background:var(--surface-2);grid-template-columns:var(--sbw) minmax(0,1fr);transition:grid-template-columns .2s ease;}
    .app-shell.sb-open{--sbw:244px;}
    header.appbar .appbar-title{display:none;}
    header.appbar{padding-left:28px;padding-right:28px;}
    /* buscador */
    .gsearch{display:flex;align-items:center;gap:9px;position:relative;width:min(360px,46vw);height:38px;padding:0 12px;border:1px solid var(--gridline);border-radius:19px;background:#fff;color:var(--text-muted);transition:border-color .15s,box-shadow .15s;}
    .gsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);}
    .gsearch > svg{width:16px;height:16px;flex:none;}
    .gsearch input{border:none;background:none;box-shadow:none;padding:0;height:100%;font-size:13.5px;font-weight:600;color:var(--text-primary);outline:none;min-width:0;flex:1;}
    .gsearch input:focus{box-shadow:none;border:none;}
    .gsearch kbd{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--text-muted);border:1px solid var(--gridline);border-radius:5px;padding:1px 5px;background:var(--surface-2);}
    .gsearch:focus-within kbd{display:none;}
    .gs-list{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--gridline);border-radius:14px;box-shadow:var(--shadow-md);padding:6px;z-index:95;max-height:340px;overflow:auto;}
    .gs-item{appearance:none;width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--text-primary);padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;}
    .gs-item .icon{width:18px;height:18px;color:var(--accent-dark);}
    .gs-item.sel,.gs-item:hover{background:rgba(var(--accent-rgb),.11);}
    .gs-empty{padding:12px;font-size:13px;color:var(--text-muted);}
    /* menu lateral colapsable */
    .sidebar{background:#fff;position:relative;z-index:56;}
    .sidebar-in{align-items:stretch;}
    .sb-toggle{display:flex;position:absolute;right:-12px;top:calc(var(--hdr-h) - 12px);z-index:6;width:24px;height:24px;border-radius:50%;border:1px solid var(--gridline);background:#fff;color:var(--text-secondary);align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(20,18,10,.12);transition:transform .2s,border-color .15s,color .15s;}
    .sb-toggle:hover{border-color:var(--accent);color:var(--accent-dark);}
    .sb-toggle svg{width:12px;height:12px;}
    .app-shell.sb-open .sb-toggle{transform:rotate(180deg);}
    .sb-title,.sb-bn,.sb-bt,.sb-item span{display:none;}
    .app-shell.sb-open .sb-title,.app-shell.sb-open .sb-bn,.app-shell.sb-open .sb-bt{display:block;}
    .app-shell.sb-open .sb-item span{display:inline;}
    .sb-brand{padding:0;justify-content:center;gap:11px;}
    .sb-brand img.brandmark{width:42px;}
    .app-shell.sb-open .sb-brand{justify-content:flex-start;padding:0 26px;}
    .sb-item{justify-content:center;width:50px;height:46px;padding:0;margin:0 auto;}
    .app-shell.sb-open .sb-item{justify-content:flex-start;width:100%;height:auto;padding:11px 14px;margin:0;}
    .sb-item .icon{width:21px;height:21px;}
    .app-shell.sb-open .sb-item .icon{width:19px;height:19px;}
    .sb-sep{margin:8px 14px;}
    .sidebar-in{padding-left:8px;padding-right:8px;}
    .sb-brand{margin-left:-8px;margin-right:-8px;}
    /* tarjetas de inicio */
    .vista-menu-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
    .vista-menu-card{padding:40px 16px 32px;border-radius:12px;box-shadow:none;gap:16px;}
    .vista-menu-card .vmc-icon{width:auto;height:auto;background:none;border-radius:0;color:var(--accent-dark);}
    .vista-menu-card .vmc-icon svg{width:44px;height:44px;stroke-width:1.5;}
    .vista-menu-card .vmc-label{font-size:14px;font-weight:600;color:var(--text-secondary);}
    .vista-menu-card:hover{box-shadow:0 8px 24px rgba(20,18,10,.08);transform:none;}
    .vista-menu-card:hover .vmc-label{color:var(--accent-dark);}
  }

  /* ==============================================================================
     ==  LOGO COMPLETO
     ============================================================================== */
  img.brandmark{width:auto;height:44px;max-width:none;}
  header.appbar:not(.is-tab) h1,header.appbar:not(.is-tab) .appbar-tag{display:none;}
  @media(min-width:960px){
    :root{--hdr-h:64px;}
    .sb-brand img.brandmark{height:42px;width:auto;}
    .sb-brand{gap:0;}
    .app-shell:not(.sb-open) .sb-brand img.brandmark{height:auto;width:60px;}
    .app-shell.sb-open .sb-brand{justify-content:center;padding:0;}
  }

  /* ==============================================================================
     ==  ALINEACIÓN
     ============================================================================== */
  .navb .icon,.sb-item .icon,.sheet-ic .icon,.gs-item .icon{margin:0;vertical-align:middle;display:block;flex:none;}
  .navb.on .icon{transform:none;}
  header.appbar{padding-left:16px;padding-right:16px;}
  @media(min-width:960px){
    header.appbar{padding-left:32px;padding-right:32px;}
    .app-shell.sb-open .sb-item{gap:14px;}
    .vista-menu-card{padding:36px 16px;}
  }

  /* ==============================================================================
     ==  ALINEACIÓN FINA
     ============================================================================== */
  .vmc-icon .icon{margin:0;vertical-align:middle;display:block;}
  .vmc-icon{display:flex;align-items:center;justify-content:center;}
  @media(min-width:960px){
    .gsearch input{margin:0 !important;height:34px;line-height:34px;align-self:center;}
    .gsearch > svg{margin:0;}
  }
  /* centrado optico del icono Usuarios (el glifo es asimetrico) */
  .vista-menu-card[onclick*="'usuarios'"] .vmc-icon .icon{transform:translateX(-1px);}
  .sb-item[data-id="usuarios"] .icon{transform:translateX(-.8px);}
  @media(min-width:960px){.vista-menu-card[onclick*="'usuarios'"] .vmc-icon .icon{transform:translateX(-2px);}}

  /* ==============================================================================

  .dleg-v small{font-size:11px;color:var(--text-muted);}
  .dleg-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .dtog{appearance:none;font-family:inherit;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--gridline);background:var(--card);font-size:12px;font-weight:700;color:var(--text-primary);cursor:pointer;transition:opacity .2s,background .2s;}
  .dtog[aria-pressed=false]{opacity:.45;background:var(--surface-2);}
  .dhit{cursor:default;}
  .dhit.clic{cursor:pointer;}
  .dtip{position:fixed;left:0;top:0;z-index:9500;pointer-events:none;background:#17150f;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;max-width:260px;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .dtip.on{opacity:1;}
  .dtip b{font-weight:800;}
  .dskel i{display:block;height:14px;border-radius:7px;background:var(--surface-2);margin:12px 0;animation:dPulse 1.2s ease-in-out infinite;}
  .dskel i:first-child{width:45%;}
  .dskel i:nth-child(2){height:28px;width:60%;}
  .dskel{min-height:120px;}
  @keyframes dPulse{50%{opacity:.45;}}
  /* animaciones de entrada */
  @keyframes dFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes dDraw{from{stroke-dashoffset:1;}to{stroke-dashoffset:0;}}
  @keyframes dIn{from{opacity:0;}to{opacity:1;}}
  @keyframes dGrowY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes dGrowX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes dSweep{from{stroke-dasharray:0 100;}}
  .dash.anim .dash-top,.dash.anim .dkpi,.dash.anim .dcard{animation:dFade .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms);}
  .dash.anim .dkpi .dline,.canim .dline{stroke-dasharray:1;animation:dDraw 1.1s ease-out .3s both;}
  .dash.anim .dkpi .darea,.canim .darea{animation:dIn .8s ease .7s both;}
  .canim .dpt{animation:dIn .35s ease both;animation-delay:calc(.5s + var(--k) * 70ms);}
  .dash.anim .dbv,.canim .dbv{transform-box:fill-box;transform-origin:bottom;animation:dGrowY .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.15s + var(--k) * 50ms);}
  .dash.anim .dprog i,.canim .dbar-f,.canim .dlote-bar i,.dash.anim .dlote-bar i,.dash.anim .dbar-f{animation:dGrowX .9s cubic-bezier(.2,.7,.2,1) .35s both;}
  .canim .dsl{animation:dSweep .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 90ms);}
  @media (prefers-reduced-motion:reduce){.dash *,.dash *::before,.dash *::after,.canim *{animation:none !important;transition:none !important;}}
  @media (min-width:760px){.dash-kpis.k6{grid-template-columns:repeat(3,1fr);}.dash-kpis.k4{grid-template-columns:repeat(4,1fr);}.dash-kpis.k5{grid-template-columns:repeat(6,1fr);}.dash-kpis.k5 .dkpi{grid-column:span 2;}.dash-kpis.k5 .dkpi:nth-child(n+4){grid-column:span 3;}}
  @media (min-width:1180px){.dash-kpis.k5{grid-template-columns:repeat(5,1fr);}.dash-kpis.k5 .dkpi,.dash-kpis.k5 .dkpi:nth-child(n+4){grid-column:auto;}}
  @media (min-width:960px){.dash-grid{grid-template-columns:1fr 1fr;}.dash-grid .dwide{grid-column:1/-1;}}
  @media (max-width:520px){.dlote{grid-template-columns:1fr 92px;}.dlote-bar{display:none;}.dbar{grid-template-columns:92px 1fr 56px;gap:10px;}.dcard{padding:15px;}.dkpi .n{font-size:25px;}}
</style>
</head>

const _busy = {};
async function _once(clave, fn, e){
  if(_busy[clave]) return;
  _busy[clave] = true;
  const btn = e && e.target && e.target.querySelector ? e.target.querySelector('button[type=submit]') : null;
  if(btn) btn.disabled = true;
  try{ return await fn(e); }
  finally{ _busy[clave] = false; if(btn) btn.disabled = false; }
}
const _normTxt = x => String(x==null?'':x).trim().replace(/\s+/g,' ').toLowerCase();
const _esDup = err => !!err && (err.code === '23505' || /duplicate key|unique constraint/i.test(err.message||''));

function toast(msg, type){
  if(type === 'err' && /failed to fetch|networkerror|load failed|network request failed/i.test(String(msg))) msg = 'Sin conexión: no se guardó nada. Revisá la señal e intentá de nuevo.';
  let box = document.getElementById('toasts');
  if(!box){
    box = document.createElement('div');
    box.id = 'toasts';
    box.setAttribute('role','status');
    box.setAttribute('aria-live','polite');
    document.body.appendChild(box);
  }
  const cls = 'toast' + (type ? ' '+type : '');
  const igual = Array.from(box.children).find(x => x.className === cls && x.textContent === msg);
  if(igual){ clearTimeout(igual._t); igual._t = setTimeout(()=>igual.remove(), 3200); return; }
  const t = document.createElement('div');
  t.className = cls;
  t.textContent = msg;
  box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  if(type === 'ok'){ vibrar(12); _dirty = false; } else if(type === 'err') vibrar([40,60,40]);
  t._t = setTimeout(()=>t.remove(), 3200);
}

const dChip = (p, tip) => p == null ? '' : `<span class="dchip ${p >= 0 ? 'up' : 'down'}"${tip ? dTipAttr(tip) : ''}>${p >= 0 ? '▲' : '▼'} ${dN(Math.abs(p),0)}%</span>`;

async function dashAll(tabla, cols, ord, tie){
  let out = [], desde = 0;
  for(;;){
    let q = sb.from(tabla).select(cols);
    if(ord) q = q.order(ord, {ascending:false});
    q = q.order(tie || 'id', {ascending:false});
    const { data, error } = await q.range(desde, desde + 999);
    if(error) throw error;
    out = out.concat(data || []);
    if(!data || data.length < 1000) break;
    desde += 1000;
  }
  return out;
}

async function renderDash(forzar){

    if(!DASH.ok){ const r = dRefMes(); DASH.anio = Number(r.slice(0,4)); DASH.mes = Number(r.slice(5,7)); }

/* ---- agregados mensuales de un año ---- */
function dMensual(a){
  const rec = new Array(12).fill(0), neto = new Array(12).fill(0), car = new Array(12).fill(0), proc = new Array(12).fill(0);
  const hn = new Array(12).fill(0), im = new Array(12).fill(0), provs = Array.from({length:12}, () => new Set());
  DASH.rec.forEach(r => {
    if(!r.fecha || Number(String(r.fecha).slice(0,4)) !== a) return;
    const m = Number(String(r.fecha).slice(5,7)) - 1, n = Number(r.peso_neto_kg||0);
    rec[m] += Number(r.kg_liquido_carga||0); car[m]++; neto[m] += n; provs[m].add(r.proveedor || 'Sin proveedor');
    if(n > 0){ hn[m] += n * Number(r.pct_humedad||0); im[m] += n * impDe(r); }
  });
  DASH.lotes.forEach(l => {
    if(l.estado !== 'CERRADO' || !l.fecha_cierre || Number(String(l.fecha_cierre).slice(0,4)) !== a) return;
    proc[Number(String(l.fecha_cierre).slice(5,7)) - 1] += Number(l.kg_procesado_total||0);
  });
  return { rec, neto, car, proc, provs: provs.map(s => s.size), hum: neto.map((p,i) => p ? hn[i]/p : null), imp: neto.map((p,i) => p ? im[i]/p : null) };
}
function dMesesVisibles(){ const h = hoyLocal(); return DASH.anio === Number(h.slice(0,4)) ? Number(h.slice(5,7)) : 12; }
function dSerieKg(hasta, n){ /* últimos n meses terminando en 'hasta' (YYYY-MM) */
  const out = []; let k = hasta;
  for(let i = 0; i < n; i++){ out.unshift({ k, kg: DASH.rec.filter(r => dKey(r.fecha) === k).reduce((a,r) => a + Number(r.kg_liquido_carga||0), 0) }); k = dMesAnterior(k); }
  return out;
}

/* ---- gráficos pequeños ---- */
function dSpark(vals, color){
  const W = 120, H = 34, max = Math.max(1, ...vals), n = vals.length;
  const X = i => n === 1 ? W/2 : 3 + i * (W - 6) / (n - 1), Y = v => H - 4 - (H - 8) * v / max;
  const d = vals.map((v,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  return `<svg class="dspark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="darea" d="${d} L${X(n-1)} ${H} L${X(0)} ${H} Z" fill="${color}" fill-opacity=".12"/><path class="dline" pathLength="1" d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function dMiniBarras(vals, color, marca){
  const W = 120, H = 34, max = Math.max(1, ...vals), g = W / vals.length, bw = Math.max(3, g - 4);
  return `<svg class="dspark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${vals.map((v,i) => { const h = v > 0 ? Math.max(2, (H - 3) * v / max) : 1.5; return `<rect class="dbv" style="--k:${i}" x="${(i * g + (g - bw) / 2).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${color}" fill-opacity="${i === marca ? 1 : .35}"/>`; }).join('')}</svg>`;
}
const dCu = (v, d, suf) => { d = Number(v) === 0 ? 0 : d; return `<span class="cu" data-v="${Number(v)}" data-d="${d||0}">${dN(v,d)}</span>${suf ? `<small class="u">${suf}</small>` : ''}`; };
function dCuAll(root, anim){
  const red = dRed();
  root.querySelectorAll('.cu').forEach(el => {
    const v = Number(el.dataset.v), d = Number(el.dataset.d || 0), fin = () => { el.textContent = dN(v, d); };
    if(!anim || red || !isFinite(v) || v === 0){ fin(); return; }
    const t0 = performance.now(), dur = 950;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = dN(v * e, d); if(k < 1) requestAnimationFrame(step); else fin(); };
    el.textContent = dN(0, d); requestAnimationFrame(step);
  });
}

/* ---- gráficos grandes ---- */
function dNice(max){
  if(!(max > 0)) return { max:1, step:.25 };
  const p = Math.pow(10, Math.floor(Math.log10(max))), m = max / p;
  const n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
  return { max:n*p, step:n*p/4 };
}
function dAncho(id, def){ const el = document.getElementById(id); const w = el ? el.clientWidth : 0; return w > 120 ? w : def; }
const dTipAttr = h => ` data-tip="${mpEsc(h)}"`;
function dGrid(W, H, L, R, T, B, nz, fmtY){
  let g = '';
  for(let k = 0; k <= 4; k++){ const v = nz.step * k, y = T + (H-T-B) * (1 - v / nz.max); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3e0d3" stroke-width="1"${k ? ' stroke-dasharray="3 4"' : ''}/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#938d79">${fmtY(v)}</text>`; }
  return g;
}

function dLinea(id, series, nMes, fmtY, tipFn, sel, clic){
  const W = dAncho(id, 560), H = 240, L = 46, R = 16, T = 16, B = 28;
  const labels = W < 430 ? D_MES1 : D_MES3;
  const all = series.flatMap(s => s.v.slice(0, nMes)).filter(v => v != null);
  const nz = dNice(Math.max(0, ...all));
  const step = nMes === 1 ? (W-L-R) : (W-L-R) / (nMes-1);
  const X = i => L + (nMes === 1 ? (W-L-R)/2 : i * step);
  const Y = v => T + (H-T-B) * (1 - v / nz.max);
  let g = dGrid(W, H, L, R, T, B, nz, fmtY), hits = '';
  if(sel != null && sel < nMes) g += `<rect x="${X(sel) - Math.max(step/2, 14)}" y="${T}" width="${Math.max(step, 28)}" height="${H-T-B}" fill="#8a6d00" fill-opacity=".07" rx="6"/>`;
  for(let i = 0; i < nMes; i++) g += `<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="${i === sel ? 800 : 500}" fill="${i === sel ? '#5c4400' : '#938d79'}">${labels[i]}</text>`;
  series.forEach((s, si) => {
    let d = '', abierto = false, pts = '', area = '';
    for(let i = 0; i < nMes; i++){
      const v = s.v[i];
      if(v == null){ abierto = false; continue; }
      d += (abierto ? 'L' : 'M') + X(i) + ' ' + Y(v) + ' '; abierto = true;
      pts += `<circle class="dpt" style="--k:${i}" cx="${X(i)}" cy="${Y(v)}" r="${i === sel && si === 0 ? 6 : 4}" fill="${i === sel && si === 0 ? s.c : '#fff'}" stroke="${s.c}" stroke-width="2"/>`;
    }
    if(s.area && all.length > 1){
      const idx = s.v.slice(0, nMes).map((v,i) => v == null ? null : i).filter(i => i != null);
      if(idx.length > 1) area = `<path class="darea" d="M${X(idx[0])} ${Y(0)} ` + idx.map(i => `L${X(i)} ${Y(s.v[i])}`).join(' ') + ` L${X(idx[idx.length-1])} ${Y(0)} Z" fill="${s.c}" fill-opacity=".10"/>`;
    }
    g += area + `<path class="dline" pathLength="1" d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` + pts;
  });
  g += `<line class="dcross" y1="${T}" y2="${H-B}" stroke="#57523f" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  for(let i = 0; i < nMes; i++) hits += `<rect class="dhit${clic ? ' clic' : ''}" x="${X(i) - Math.max(step/2, 12)}" y="0" width="${Math.max(step, 24)}" height="${H}" fill="transparent" data-x="${X(i)}"${clic ? ` data-i="${i}"` : ''}${dTipAttr(tipFn(i))}/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" style="touch-action:pan-y">${g}${hits}</svg>`;
}

function dBarras(id, series, fmtY, tipFn){
  const W = dAncho(id, 560), H = 240, L = 46, R = 10, T = 16, B = 28;
  const labels = W < 430 ? D_MES1 : D_MES3;
  const vis = series.filter(s => !DASH.hideBar[s.k]);
  const nz = dNice(Math.max(0, ...vis.flatMap(s => s.v)));
  const Y = v => T + (H-T-B) * (1 - v / nz.max);
  const gw = (W-L-R) / 12, bw = Math.max(4, Math.min(16, (gw - 6) / Math.max(1, vis.length)));
  let g = dGrid(W, H, L, R, T, B, nz, fmtY), hits = '';
  for(let m = 0; m < 12; m++){
    const cx = L + gw * m + gw / 2;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="#938d79">${labels[m]}</text>`;
    vis.forEach((s, j) => {
      const v = s.v[m]; if(!(v > 0)) return;
      const x = cx - (vis.length * bw) / 2 + j * bw;
      g += `<rect class="dbv" style="--k:${m}" x="${x}" y="${Y(v)}" width="${bw - 1}" height="${Y(0) - Y(v)}" rx="2.5" fill="${s.c}"/>`;
    });
    hits += `<rect class="dhit" x="${L + gw * m}" y="0" width="${gw}" height="${H}" fill="transparent" data-x="${cx}"${dTipAttr(tipFn(m))}/>`;
  }
  g += `<line class="dcross" y1="${T}" y2="${H-B}" stroke="#57523f" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" style="touch-action:pan-y">${g}${hits}</svg>`;
}

function dDona(items, total, cargas){
  const S = 200, c = S/2, r = 70, sw = 28;
  if(!(total > 0)) return `<div class="empty">Sin recepciones en ${D_MESES[DASH.mes-1].toLowerCase()} de ${DASH.anio}.<br><small>Elegí otro mes arriba o tocá un mes en el gráfico de recepción.</small></div>`;
  let acc = 0, arcs = '';
  items.forEach((it, i) => {
    const len = it.v / total * 100;
    arcs += `<circle class="dsl" style="--k:${i}" data-i="${i}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${it.c}" stroke-width="${sw}" pathLength="100" stroke-dasharray="${Math.max(0.1, len - (items.length > 1 ? .6 : 0)).toFixed(2)} 100" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${c} ${c})"${dTipAttr(`<b>${mpEsc(it.n)}</b><br>${dT(it.v)} t · ${dN(len,1)}%<br>${it.c2} carga${it.c2 === 1 ? '' : 's'}${it.h != null ? ' · humedad ' + dN(it.h,1) + '%' : ''}`)}/>`;
    acc += len;
  });
  const leg = items.map((it, i) => `<div class="dleg" data-i="${i}"><span class="dot" style="background:${it.c}"></span><span class="dleg-n">${mpEsc(it.n)}</span><span class="dleg-v"><span><b>${dT(it.v)} t</b> · ${dN(it.v/total*100,0)}%</span><small>${it.c2} carga${it.c2 === 1 ? '' : 's'}${it.h != null ? ' · ' + dN(it.h,1) + '% hum.' : ''}</small></span></div>`).join('');
  return `<div class="ddona"><svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img">${arcs}<text id="dCenN" x="${c}" y="${c+1}" text-anchor="middle" font-size="24" font-weight="800" fill="#17150f">${dT(total)}</text><text id="dCenL" x="${c}" y="${c+19}" text-anchor="middle" font-size="12" fill="#938d79">t · ${cargas} cargas</text></svg><div class="dlegs">${leg}</div></div>`;
}

/* ---- días trabajados (contador del panel + detalle) ---- */
const DIAS = { k:null, abierto:false };
function diasData(k){
  const mapa = {};
  const dia = f => (mapa[f] = mapa[f] || { f, turnos:new Set(), mez:new Set(), bb:0, kg:0, lotes:new Set() });
  (DASH.bbs || []).forEach(b => {
    if(!b.fecha || dKey(b.fecha) !== k) return;
    const d = dia(String(b.fecha).slice(0,10));
    if(b.turno) d.turnos.add(b.turno);
    if(b.mezcla_id){ if(!d.mez.has(b.mezcla_id)){ d.mez.add(b.mezcla_id); d.bb++; } } else d.bb++;
    d.lotes.add(b.lote_id);
  });
  (DASH.tcs || []).forEach(t => {
    if(!t.fecha || dKey(t.fecha) !== k || !(Number(t.kg_reales_procesados) > 0)) return;
    const d = dia(String(t.fecha).slice(0,10));
    if(t.turno) d.turnos.add(t.turno);
    d.kg += Number(t.kg_reales_procesados);
    d.lotes.add(t.lote_id);
  });
  const dias = Object.values(mapa).sort((a, b) => b.f.localeCompare(a.f));
  const cnt = t => dias.filter(d => d.turnos.has(t)).length;
  return { dias, turnos:dias.reduce((a, d) => a + d.turnos.size, 0), dia:cnt('DIA'), noche:cnt('NOCHE'), bb:dias.reduce((a, d) => a + d.bb, 0), kg:dias.reduce((a, d) => a + d.kg, 0) };
}
function diasMesMin(){
  let m = null;
  (DASH.bbs || []).forEach(b => { if(b.fecha){ const k = dKey(b.fecha); if(!m || k < m) m = k; } });
  (DASH.tcs || []).forEach(t => { if(t.fecha && Number(t.kg_reales_procesados) > 0){ const k = dKey(t.fecha); if(!m || k < m) m = k; } });
  return m;
}
function diasAbrir(k){ DIAS.k = k || dRefMes(); DIAS.abierto = true; diasModal(); }
function diasCerrar(){ DIAS.abierto = false; const m = document.getElementById('dtr'); if(m) m.classList.remove('on'); }
function diasMes(delta){
  const k = DIAS.k || dRefMes(), d = new Date(Number(k.slice(0,4)), Number(k.slice(5,7)) - 1 + delta, 1);
  const nk = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0'), min = diasMesMin();
  if(nk > dRefMes() || (min && nk < min)) return;
  DIAS.k = nk; diasModal();
}
function diasModal(){
  let m = document.getElementById('dtr');
  if(!m){
    m = document.createElement('div');
    m.id = 'dtr'; m.className = 'dtr'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Días trabajados');
    m.addEventListener('click', e => { if(e.target === m) diasCerrar(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape' && DIAS.abierto) diasCerrar(); });
    document.body.appendChild(m);
  }
  const k = DIAS.k || dRefMes(), D = diasData(k), min = diasMesMin();
  const nombre = D_MESES[Number(k.slice(5,7)) - 1] + ' ' + k.slice(0,4);
  const antes = !!min && k > min, desp = k < dRefMes();
  const fila = d => {
    const dt = new Date(d.f + 'T00:00:00');
    const sem = dt.toLocaleDateString('es-PY', { weekday:'short' }).replace('.', '');
    const lotes = Array.from(d.lotes).sort((a, b) => String(a).localeCompare(String(b), 'es', {numeric:true})).map(mpEsc).join(' · ');
    return `<div class="dtr-row"><div class="dtr-d">${dt.getDate()}<small>${mpEsc(sem)}</small></div><div class="dtr-m">${d.bb ? d.bb + ' bigbag' + (d.bb===1?'':'s') : 'Sin bigbags'}${d.kg > 0 ? ' · ' + dT(d.kg) + ' t procesadas' : ''}<small>${lotes}</small></div><div class="dtr-c">${d.turnos.has('DIA') ? '<span class="dtr-chip d">Día</span>' : ''}${d.turnos.has('NOCHE') ? '<span class="dtr-chip n">Noche</span>' : ''}</div></div>`;
  };
  m.innerHTML = `<div class="dtr-box"><div class="dtr-h"><button type="button" class="dtr-b" onclick="diasMes(-1)" ${antes ? '' : 'disabled'} aria-label="Mes anterior">‹</button><div class="dtr-t"><h3>${nombre}</h3><small>Días trabajados</small></div><button type="button" class="dtr-b" onclick="diasMes(1)" ${desp ? '' : 'disabled'} aria-label="Mes siguiente">›</button><button type="button" class="dtr-b x" onclick="diasCerrar()" aria-label="Cerrar">×</button></div>

  const conBB = new Set(DASH.bbs.map(b => b.lote_id));

function dashGraficos(anim, solo){
  const quiere = k => !solo || solo.indexOf(k) >= 0;

  const tt = v => dN(v, v < 10 && v % 1 ? 1 : 0);
  const sub = (id, html) => { const e = document.getElementById(id); if(e) e.innerHTML = html; };

  if(quiere('lin')){
    const esT = DASH.metrica === 't';
    const vals = esT ? m.rec.map(v => v/1000) : m.car;
    const act = vals.slice(0, n), tot = act.reduce((x,y) => x + y, 0), best = act.indexOf(Math.max(...act));
    sub('dSubLin', act.some(v => v > 0) ? `Total ${dN(tot, esT ? 0 : 0)} ${esT ? 't' : 'cargas'} · promedio ${dN(tot / Math.max(1, act.filter(v => v > 0).length), esT ? 0 : 1)} por mes activo · mejor: ${D_MES3[best]}` : 'Sin recepciones este año');
    set('dGLinea', dLinea('dGLinea', [{ v:vals, c:D_COL[0], area:true }], n, esT ? tt : (v => dN(v, 0)), i => {
      const ant = i > 0 ? m.rec[i-1] : null, p = ant != null ? dPct(m.rec[i], ant) : null;
      return `<b>${D_MESES[i]} ${a}</b><br>${dT(m.rec[i])} t líquidas · ${m.car[i]} carga${m.car[i]===1?'':'s'}<br>${m.provs[i]} proveedor${m.provs[i]===1?'':'es'}${m.hum[i] != null ? '<br>Humedad prom. ' + dN(m.hum[i],1) + '%' : ''}${p != null ? '<br>' + (p >= 0 ? '▲ ' : '▼ ') + dN(Math.abs(p),0) + '% vs mes anterior' : ''}`;
    }, DASH.mes && DASH.anio === a ? mes0 : null, true), anim);

    const pT = m.proc.reduce((x,y) => x + y, 0), rT = m.rec.reduce((x,y) => x + y, 0);
    sub('dSubBar', rT > 0 ? `Recibido ${dT(rT)} t · procesado ${dT(pT)} t` : 'Sin datos este año');
    set('dGBar', dBarras('dGBar', [{ k:'rec', n:'Recibido', v:m.rec.map(v => v/1000), c:D_COL[0] }, { k:'proc', n:'Procesado', v:m.proc.map(v => v/1000), c:D_COL[1] }], tt, i => `<b>${D_MESES[i]} ${a}</b><br>Recibido: ${dT(m.rec[i])} t<br>Procesado: ${dT(m.proc[i])} t${m.rec[i] > 0 && m.proc[i] > 0 ? '<br>' + dN(m.proc[i] / m.rec[i] * 100, 0) + '% de lo recibido' : ''}`), anim);
    const nb = document.getElementById('dNotaBar'); if(nb) nb.textContent = pT > 0 ? 'Lo procesado se cuenta en el mes en que se cerró cada lote' : 'Lo procesado aparece cuando se cierra un lote';
  }
  if(quiere('cal')){
    const hh = m.hum.slice(0, n).filter(v => v != null), ii = m.imp.slice(0, n).filter(v => v != null);
    sub('dSubCal', hh.length ? `Humedad prom. ${dN(hh.reduce((x,y) => x + y, 0) / hh.length, 1)}% · impureza prom. ${dN(ii.reduce((x,y) => x + y, 0) / ii.length, 1)}%` : 'Sin datos este año');
    const ser = []; if(!DASH.hideCal.hum) ser.push({ v:m.hum, c:D_COL[1] }); if(!DASH.hideCal.imp) ser.push({ v:m.imp, c:D_COL[3] });
    set('dGCal', dLinea('dGCal', ser.length ? ser : [{ v:m.hum, c:D_COL[1] }], n, v => dN(v, 1), i => `<b>${D_MESES[i]} ${a}</b><br>Humedad: ${m.hum[i] != null ? dN(m.hum[i],1) + '%' : '-'}<br>Impureza: ${m.imp[i] != null ? dN(m.imp[i],1) + '%' : '-'}<br>${m.car[i]} carga${m.car[i]===1?'':'s'}`, null, false), anim);
  }
  if(quiere('dona')){
    const mk = DASH.anio + '-' + String(DASH.mes).padStart(2,'0'), por = {};
    DASH.rec.forEach(r => { if(dKey(r.fecha) !== mk) return; const k = r.proveedor || 'Sin proveedor'; const o = por[k] = por[k] || { v:0, c2:0, hn:0, pn:0 }; o.v += Number(r.kg_liquido_carga||0); o.c2++; const nt = Number(r.peso_neto_kg||0); if(nt > 0 && r.pct_humedad != null){ o.hn += nt * Number(r.pct_humedad); o.pn += nt; } });
    const arr = Object.keys(por).map(k => ({ n:k, v:por[k].v, c2:por[k].c2, h:por[k].pn ? por[k].hn / por[k].pn : null })).sort((x,y) => y.v - x.v);
    const top = arr.slice(0,5).map((x,i) => ({ ...x, c:D_COL[i] })), resto = arr.slice(5);
    if(resto.length) top.push({ n:'Otros (' + resto.length + ')', v:resto.reduce((x,y) => x + y.v, 0), c2:resto.reduce((x,y) => x + y.c2, 0), h:null, c:D_COL[5] });
    const total = arr.reduce((x,y) => x + y.v, 0), car = arr.reduce((x,y) => x + y.c2, 0);
    DASH.donaItems = top; DASH.donaTotal = total; DASH.donaCargas = car;
    sub('dSubDona', arr.length ? `${arr.length} proveedor${arr.length===1?'':'es'} · mayor: ${mpEsc(dCorto(arr[0].n,22))} (${dN(arr[0].v/total*100,0)}%)` : D_MESES[DASH.mes-1] + ' ' + DASH.anio);
    set('dGDona', dDona(top, total, car), anim);
  }
}

const gsNorm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let gsSel = 0, gsItemsCur = [];
function gsCompute(){
  const all = [{id:'home', label:'Inicio', icon:ICONS.home}, ...(tabsMenu())];
  const q = gsNorm(document.getElementById('gsInput').value.trim());
  gsItemsCur = all.filter(t => gsNorm(t.label).includes(q));
}
function gsRender(){
  gsCompute();
  if(gsSel >= gsItemsCur.length) gsSel = 0;
  const l = document.getElementById('gsList');
  l.innerHTML = gsItemsCur.length ? gsItemsCur.map((t,i) => `<button type="button" class="gs-item ${i===gsSel?'sel':''}${puedeVer(t.id) ? '' : ' bloq'}" role="option" onmousedown="event.preventDefault();gsGo('${t.id}')">${t.icon}<span>${t.label}</span>${puedeVer(t.id) ? '' : '<i class="bloq-mini" aria-hidden="true">' + ICONS.lock + '</i>'}</button>`).join('') : '<div class="gs-empty">Sin resultados</div>';
  l.classList.remove('hidden');
}
function gsClose(){ document.getElementById('gsList').classList.add('hidden'); }
function gsGo(id){
  const i = document.getElementById('gsInput'); i.value = ''; i.blur(); gsClose();
  navGo(id);
}
(function(){
  const i = document.getElementById('gsInput'); if(!i) return;
  i.addEventListener('focus', () => { gsSel = 0; gsRender(); });
  i.addEventListener('input', () => { gsSel = 0; gsRender(); });
  i.addEventListener('blur', () => setTimeout(gsClose, 120));
  i.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); gsSel = Math.min(gsSel + 1, Math.max(gsItemsCur.length - 1, 0)); gsRender(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); gsSel = Math.max(gsSel - 1, 0); gsRender(); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(gsItemsCur[gsSel]) gsGo(gsItemsCur[gsSel].id); }
    else if(e.key === 'Escape'){ i.value = ''; i.blur(); gsClose(); }
  });
  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && mqDesk.matches){ e.preventDefault(); i.focus(); i.select(); }
  });
})();

  if(activeTab === id) return;
  setNavOn(id);
  const tok = ++navTok;
